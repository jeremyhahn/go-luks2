# golangci-lint configuration for go-luks2.
#
# This file is part of the SECURITY gate, not a style preference: staticcheck,
# errcheck, gosimple, unused, ineffassign, misspell and gocritic must all be
# enabled. Installing the umbrella linter with the security linters switched
# off looks like a lint gate and catches none of what one is for. In
# golangci-lint v2
# gosimple was merged into staticcheck (the S1xxx checks), so enabling
# staticcheck covers it.
version: "2"

run:
  timeout: 5m
  # Tests are analysed too. Skipping them makes `unused` fire on helpers that
  # only the test suite calls, which is a false positive that invites deleting
  # live code. The noisier linters are relaxed on _test.go below instead.
  tests: true
  # No build-tags here on purpose. The unit tests carry //go:build !integration
  # and the integration suite carries //go:build integration, so adding
  # `integration` swaps one set for the other and makes `unused` fire on every
  # helper the unit tests call. The default (untagged) build is the one CI
  # lints and the one the library ships.

linters:
  enable:
    - govet
    - errcheck
    - staticcheck # includes the former gosimple (S1xxx) checks
    - unused
    - ineffassign
    - misspell
    - gocritic
    - forbidigo
    - depguard

  settings:
    # Typed errors only (errors.md 2, DESIGN.md C.2). Library and command code
    # builds an *errs.Error or a package error type, never an fmt.Errorf, and a
    # package declares its sentinels in its errors.go and nowhere else. And no
    # time.Sleep (go-style).
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Errorf$
          msg: "typed errors only: build an *errs.Error (internal/errs) or a package error type"
        - pattern: ^errors\.New$
          msg: "declare sentinels in the package's errors.go"
        # go-style: no time.Sleep. A wait selects on a timer from an injected
        # internal/clock.Clock, so it can be bounded, cancelled and tested.
        - pattern: ^time\.Sleep$
          msg: "wait on a timer from an internal/clock.Clock instead"
    # The import DAG (DESIGN.md §A.2) as data, one rule per row: each
    # in-module package names exactly what it may import, so a layering
    # violation is a lint finding rather than something that only shows up
    # as a cycle (most of this DAG does NOT round-trip into a cycle if
    # violated -- pkg/luks2 importing pkg/filesystem is not a compile error,
    # since pkg/filesystem never imports pkg/luks2 back). Every rule's Allow
    # list repeats the same six entries (stdlib plus the handful of
    # third-party deps this module uses nowhere root- or layering-sensitive:
    # YAML anchors cannot splice a sequence into another sequence's
    # elements, only full-document merges, so there is no shorter way to
    # write this) and the exact
    # in-module packages that row names; nothing else in this module's own
    # tree is reachable. pkg/luks2 additionally denies os/exec outright
    # (over Allow's $gostd, which would otherwise cover it through plain
    # "os"): the one case in this table where a narrower Deny has to win
    # over a broader Allow, because neither $gostd nor any of these lists
    # can name "every os/* package except exec" directly. _test.go is
    # exempt throughout: fixtures legitimately reach across the DAG for
    # setup (pkg/luks2's own white-box tests attach loop devices, format
    # through pkg/dmcrypt's test helpers, and so on) in ways production
    # code must not.
    depguard:
      rules:
        internal-errs:
          files: [internal/errs/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid]
        internal-clock:
          files: [internal/clock/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid]
        internal-fips:
          files: [internal/fips/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid, github.com/jeremyhahn/go-luks2/internal/errs]
        internal-secret:
          files: [internal/secret/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid, github.com/jeremyhahn/go-luks2/internal/errs]
        internal-af:
          files: [internal/af/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/fips
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-areacipher:
          files: [internal/areacipher/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-kdf:
          files: [internal/kdf/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/fips
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-header:
          files: [internal/header/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/kdf
            - github.com/jeremyhahn/go-luks2/internal/fips
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-recoverykey:
          files: [internal/recoverykey/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-volkey:
          files: [internal/volkey/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-device:
          files: [internal/device/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-dm:
          files: [internal/dm/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/anatol/devmapper.go
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-keyring:
          files: [internal/keyring/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        internal-command:
          files: [internal/command/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid, github.com/jeremyhahn/go-luks2/internal/errs]
        internal-cli:
          files: [internal/cli/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/pkg/luks2
            - github.com/jeremyhahn/go-luks2/pkg/dmcrypt
            - github.com/jeremyhahn/go-luks2/pkg/keyprovider
            - github.com/jeremyhahn/go-luks2/pkg/loop
            - github.com/jeremyhahn/go-luks2/pkg/filesystem
            - github.com/jeremyhahn/go-luks2/pkg/wipe
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        pkg-luks2:
          files: [pkg/luks2/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/errs
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/fips
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/af
            - github.com/jeremyhahn/go-luks2/internal/areacipher
            - github.com/jeremyhahn/go-luks2/internal/kdf
            - github.com/jeremyhahn/go-luks2/internal/header
            - github.com/jeremyhahn/go-luks2/internal/recoverykey
            - github.com/jeremyhahn/go-luks2/internal/volkey
            - github.com/jeremyhahn/go-luks2/internal/device
          deny:
            - pkg: os/exec
              desc: "pkg/luks2 is rootless and exec-free (DESIGN.md §A.2); root/exec code lives in dmcrypt, loop, filesystem, keyprovider, internal/dm, internal/keyring and internal/command"
        pkg-dmcrypt:
          files: [pkg/dmcrypt/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/anatol/devmapper.go
            - github.com/jeremyhahn/go-luks2/pkg/luks2
            - github.com/jeremyhahn/go-luks2/internal/volkey
            - github.com/jeremyhahn/go-luks2/internal/dm
            - github.com/jeremyhahn/go-luks2/internal/keyring
            - github.com/jeremyhahn/go-luks2/internal/device
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        pkg-keyprovider:
          files: [pkg/keyprovider/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/pkg/luks2
            - github.com/jeremyhahn/go-luks2/internal/command
            - github.com/jeremyhahn/go-luks2/internal/secret
            - github.com/jeremyhahn/go-luks2/internal/errs
        pkg-loop:
          files: [pkg/loop/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/device
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        pkg-filesystem:
          files: [pkg/filesystem/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/command
            - github.com/jeremyhahn/go-luks2/internal/errs
        pkg-wipe:
          files: [pkg/wipe/**, "!**/*_test.go"]
          allow:
            - $gostd
            - golang.org/x/sys
            - golang.org/x/crypto
            - golang.org/x/term
            - github.com/jeremyhahn/go-enclave
            - github.com/google/uuid
            - github.com/jeremyhahn/go-luks2/internal/device
            - github.com/jeremyhahn/go-luks2/internal/clock
            - github.com/jeremyhahn/go-luks2/internal/errs
        cmd-luks2:
          files: [cmd/luks2/**, "!**/*_test.go"]
          allow: [$gostd, golang.org/x/sys, golang.org/x/crypto, golang.org/x/term, github.com/jeremyhahn/go-enclave, github.com/google/uuid, github.com/jeremyhahn/go-luks2/internal/cli]
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Would require changing exported signatures across the LUKS2 header
        # and keyslot types, which are large by the on-disk format's design.
        - hugeParam
        - rangeValCopy

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test bodies deliberately discard errors from setup helpers, pass nil
      # contexts to prove the nil path is handled, and keep instrumentation
      # fields a given case does not read. That is the tests doing their job.
      # The library itself is still linted in full.
      - path: _test\.go
        linters:
          - errcheck
          - forbidigo
          - gocritic
          - staticcheck
          - unused
      # A package's sentinels are declared in its errors.go.
      - path: (^|/)errors\.go$
        linters:
          - forbidigo
        text: "errors\\.New"
      # Test tooling reports to a person, not to a caller that classifies the
      # error; errors.md 2 permits fmt.Errorf under test/.
      - path: ^test/
        linters:
          - forbidigo
    paths:
      - third_party$
      - builtin$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$

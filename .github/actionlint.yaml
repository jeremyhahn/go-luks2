# actionlint-template: v3 — fleet self-hosted runner labels for actionlint.
# Lists the self-hosted runner labels so actionlint still catches a misspelled one; add a label here with the workflow that uses it.
self-hosted-runner:
  labels:
    - ubuntu-latest
    - ubuntu-22.04
    - codex
    - codex-task
    - claude
    - code-review
    - qwen

# code-review.yml's `A && B || die` checks trip SC2015 (info); ignored for that file and check only.
paths:
  .github/workflows/code-review.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2015:.+'

# claude-review: v1.2 — DISABLED AT THE TRIGGER (owner ruling 2026-08-24:
# Codex is the sole designated peer reviewer; codex-review.yml reviews every
# PR). The workflow is kept rather than deleted so it can be re-enabled by
# restoring the `pull_request` trigger, should Claude peer review ever be
# wanted again.
#
# THE TRIGGER-LEVEL DISABLE IS LOAD-BEARING FOR THE MERGE GATE, not merely for
# lint, and this file previously got it wrong.
#
# A job disabled with a false CONDITION still registers its commit-status
# context. This forge then writes a terminal `skipped` status and a `pending`
# status for that context in the same second, and which one a consumer resolves
# as "latest" is a race — the two status API endpoints have been measured
# disagreeing about the same commit. A merge gate that ingests one result per
# context and fails closed will therefore strand on the `pending` winner, and
# every automated merge waits forever until someone republishes the context by
# hand.
#
# It was stranding here. Before this change the job carried `if: false`, the
# forge reported the workflow `active`, and every pull request in this
# repository ended with a `Claude Review` context stuck at `pending` — visible
# on the head of PR #86, alongside seven green checks. It blocked nothing only
# because branch protection currently requires the `CI Gate` job and nothing
# else, which is a property of today's protection config rather than of this
# workflow.
#
# ONLY A TRIGGER WITH NO `pull_request` EVENT NEVER REGISTERS THE CONTEXT AT
# ALL. Do not move the disable back onto the job as a condition. A non-constant
# expression that satisfies actionlint reintroduces the stranding just as a
# constant one does — the context is registered by the trigger firing, not by
# the job running. Verify a change here by confirming a head commit carries NO
# `Claude Review` context whatsoever: `skipped` still means it registered.
#
# Secondary reason, same conclusion: actionlint rejects a constant expression
# in a job condition ("constant expression in condition [if-cond]"), which
# fails the workflow-lint step in any repository that lints its workflows.
#
# `runs-on: claude` is restricted: only this workflow may use it. That label
# mounts a live Claude session credential, so the label IS the capability and
# handing it to a second workflow hands that workflow the credential.
# Self-hosted only. Copied from a shared template; a change here belongs
# upstream in the template too.
name: Claude Review

on:
  # Manual dispatch only — the pull_request trigger is intentionally absent so
  # this review does not run automatically, and so it registers no status
  # context. Restore it here to re-enable.
  #
  # pr_number is REQUIRED: a dispatched run carries no pull_request event
  # payload, so without it PR_NUM resolves to the empty string and the review
  # script has no target.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

jobs:
  review:
    name: Claude Review
    # Guard the credential-mounting job off github.com regardless of trigger.
    if: github.server_url != 'https://github.com'
    runs-on: claude
    timeout-minutes: 40
    env:
      REPO: ${{ github.event.repository.name }}
      # Dispatch-only trigger: the PR number comes from the required input,
      # never from a pull_request event payload, which does not exist here.
      PR_NUM: ${{ inputs.pr_number }}
      GITEA_CLAUDE_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
    steps:
      - name: Run Claude review
        run: /opt/claude-worker/claude-review.sh

name: Nightly

# nightly-template v1.0 — the known-red and long-horizon jobs, off the push path.
#
# Owner ruling 2026-08-20 (fail-fast pipeline for iteration speed; issue #14):
# jobs that are known-red with tracked issues, or that verify a slow-moving
# property, do NOT run per push — a known-red job burning runner-minutes per
# push produces information we already have. They run here nightly, plus on
# demand via workflow_dispatch, and are NOT in any merge gate. When their
# tracked issues land, a job may move back to ci.yml — that move is deliberate,
# not automatic.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  # Kept in lockstep with ci.yml. The template omits this block, which leaves
  # `env.GO_VERSION` empty in the fips job below — reported upstream.
  GO_VERSION: "1.27.0"

jobs:
  fips:
    name: FIPS
    runs-on: ubuntu-latest
    # needs: none — nightly runs standalone; build health is ci.yml's job.
    timeout-minutes: 30
    env:
      GOFIPS140: latest
      # STRICT mode, not `on` (ratified 2026-08-17). `fips140=on` loads the Go
      # Cryptographic Module but still PERMITS non-approved algorithms, so a
      # path using SHA-1 succeeds and the gate reports green — a gate that
      # cannot fail on the thing it exists to catch is decoration.
      # `fips140=only` makes non-approved operations error or panic, which is
      # what a FedRAMP / PCI DSS / HIPAA compliance gate has to do.
      #
      # If this job fails, that failure IS the finding. Do not weaken it back
      # to `on` to make it pass — fix the call site, or document a deliberate
      # exemption with the owner's approval.
      GODEBUG: fips140=only
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all packages (FIPS mode)
        run: go build ./...

      # Mirrors the repo's own unit-test scope with ONLY the FIPS env changed.
      # `./...` is the right scope here because the integration suites sit
      # behind `//go:build integration` and so are already excluded; the race
      # detector is omitted to match the ci.yml fips job this replaces.
      - name: Unit tests (FIPS mode)
        run: go test -count=1 -timeout=900s ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # aquasecurity/trivy-action fetches its install script through a nested
      # checkout that a self-hosted runner resolves against its own server
      # instead of github.com, failing with git exit 128. It is therefore
      # github.com-only, and so is its consumer, the code scanning upload.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url == 'https://github.com'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      # Any non-github.com Actions host runs the same gate from the
      # trivy CLI, installed from the upstream release script. Same scanners,
      # same severities, same exit code — the dashboard upload is the only
      # thing GitHub gets and the other host does not.
      - name: Install trivy CLI
        if: github.server_url != 'https://github.com'
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Trivy gate (fail on CRITICAL/HIGH)
        if: github.server_url != 'https://github.com'
        run: make trivy-fs

      # Misconfiguration scanning (owner ruling 2026-08-20). It runs HERE, with
      # an advisory exit code, so findings surface daily without a brand-new
      # finding class blocking every merge on the day it is switched on.
      # Promote it to the PR gate once its baseline is clean — and promote it,
      # rather than leaving it advisory forever, which is how an advisory scan
      # becomes decoration.
      - name: Trivy misconfiguration scan (advisory)
        if: github.server_url != 'https://github.com'
        run: trivy fs --scanners misconfig --exit-code 0 --format table .

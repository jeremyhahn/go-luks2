name: Nightly

# Long-horizon jobs off the push path: scheduled daily at 05:45 UTC and on demand, in no merge gate.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The pinned trivy release archive, accepted only if it matches the SHA-256 pinned in the Makefile.
      # trivy action at its floating `master` branch on github.com, and a piped
      # install of trivy's contrib/install.sh from its main branch everywhere
      # else: an unreviewed script from a moving branch that then installed
      # whatever trivy was newest.
      - name: Install trivy (pinned, SHA-256 verified)
        run: make trivy-install

      # Code scanning is github.com-only.
      - name: Trivy scan (SARIF for code scanning)
        if: github.server_url == 'https://github.com'
        run: make trivy-sarif

      - name: Upload Trivy SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      # The gate: critical and high vulnerabilities and secrets fail the job; the release runs the same target.
      - name: Trivy gate (fail on CRITICAL/HIGH)
        run: make trivy-fs TOOLS_REQUIRED=1

      # Misconfiguration scanning, advisory until its baseline is clean.
      - name: Trivy misconfiguration scan (advisory)
        run: make trivy-misconfig

# signatures-template: v1 (ci-template v1.35.2) — the commit signature gate.
#
# v1 (2026-11-11, Company Agent m2577, Codex finding on xkey-android #129):
# the verifier ci.yml v1.35/v1.35.1 ran as a job of the pull request's own
# workflow, so the pull request's tree held the script that judged it: a PR
# could edit ci.yml and pass its own Signatures job. This workflow runs on
# `pull_request_target`, so GitHub reads it from the BASE branch, never from
# the pull request. It checks out the base only, fetches the pull request's
# commits as objects, and reads them with git (`verify-commit`, `log`,
# `cat-file`). It never checks out, builds or runs anything from the pull
# request. Its token is `contents: read` and is not persisted in the clone.
#
# The rules are v1.35.1's: the registry is .github/allowed_signers read from
# the base commit (synced from the handbook's
# software/templates/signing/<repo>.allowed_signers); a commit passes when
# `git verify-commit` (gpg.format=ssh, gpg.ssh.allowedSignersFile) accepts it
# AND the key's registered principal is the committer email; a commit GitHub
# made (committer noreply@github.com) passes when the API reports it verified
# with committer web-flow. It fails closed on an unsigned commit, an unknown
# key, a principal mismatch, an unreadable base, an unreadable head and an
# unreadable API. One change from v1.35.1: there is no head fallback. A base
# with no registry fails, because under pull_request_target the head is
# untrusted input.
#
# Adoption (one CI-file PR per repository): this file as
# .github/workflows/signatures.yml, .github/allowed_signers, and ci.yml
# v1.35.2 (no `signatures` job). That PR has no Signatures run, because the
# workflow is not on the base yet. Once it lands, every later pull request
# and push to main gets the `Signatures / Signatures` check, and the
# repository ruleset requires that context beside CI Gate (a ruleset change,
# made by its owner, not by the adoption PR).
name: Signatures

on:
  pull_request_target:
    branches: [main]
    # No draft skip: a skipped required check reads as passed, so the job runs
    # on every PR event that can change the commits or the base.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signatures:
    name: Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # pull_request_target checks out the base branch by default. The ref is
      # named anyway so no edit can point it at the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit signatures against .github/allowed_signers
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          zero() { [ -z "$1" ] || printf '%s' "$1" | grep -qE '^0+$'; }
          isrev() { ! zero "$1" && git cat-file -e "$1^{commit}" 2>/dev/null; }
          ASF="${RUNNER_TEMP:-/tmp}/allowed_signers"
          if [ "$EVENT" = pull_request_target ]; then
            [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] && [ -n "$PR" ] || { echo "FAIL a pull_request_target run without its base, head or number"; exit 1; }
            REG="$BASE_SHA"
            # The pull request's commits, as objects only: nothing is checked
            # out or run. refs/pull/N/head carries fork heads too.
            git -c protocol.version=2 fetch -q --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" 2>/dev/null || true
            isrev "$HEAD_SHA" || git fetch -q --no-tags origin "$HEAD_SHA" 2>/dev/null || true
            isrev "$HEAD_SHA" || { echo "FAIL the head ${HEAD_SHA:0:12} cannot be read (moved on: the next synchronize run checks the new head)"; exit 1; }
          else
            REG="$BEFORE"
          fi
          if ! zero "$REG" && ! isrev "$REG"; then
            git fetch -q --no-tags origin "$REG" 2>/dev/null || true
            isrev "$REG" || { echo "FAIL the base ${REG:0:12} cannot be read, so neither the registry nor the range can be checked"; exit 1; }
          fi
          # The registry comes from the base, so a pull request cannot add the
          # key that signs it. No head fallback: under pull_request_target the
          # head is untrusted input.
          if isrev "$REG" && git cat-file -e "$REG:.github/allowed_signers" 2>/dev/null; then
            git show "$REG:.github/allowed_signers" > "$ASF"
            echo "registry: .github/allowed_signers at ${REG:0:12}"
          elif [ "$EVENT" = push ] && zero "$REG" && git cat-file -e "$HEAD_SHA:.github/allowed_signers" 2>/dev/null; then
            # A push with no before (a new main): the pushed commit is already
            # on main, so its own registry is the trusted one.
            git show "$HEAD_SHA:.github/allowed_signers" > "$ASF"
            echo "registry: .github/allowed_signers at ${HEAD_SHA:0:12} (no before)"
          else
            echo "FAIL no .github/allowed_signers at the base ${REG:0:12}"; exit 1
          fi
          if [ "$EVENT" = pull_request_target ]; then RANGE="$BASE_SHA..$HEAD_SHA"
          elif isrev "$BEFORE"; then RANGE="$BEFORE..$HEAD_SHA"
          else RANGE="$HEAD_SHA -1"; fi
          # shellcheck disable=SC2086 # RANGE is one or two words on purpose
          COMMITS=$(git rev-list --reverse $RANGE) || { echo "FAIL cannot list the range $RANGE"; exit 1; }
          N=$(printf '%s\n' "$COMMITS" | grep -c . || true)
          echo "checking $N commit(s) in $RANGE"
          reg_principals=$(awk '!/^[[:space:]]*(#|$)/ {print $1}' "$ASF")
          shown() { # print an email only when it is public: a registry principal or a GitHub noreply
            if printf '%s\n' "$reg_principals" | grep -qxF -- "$1" || printf '%s' "$1" | grep -qE '@users\.noreply\.github\.com$|^noreply@github\.com$'; then
              printf '%s' "$1"; else printf 'an address not in the registry'; fi
          }
          g() { git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$ASF" "$@"; }
          BAD=0
          for c in $COMMITS; do
            ce=$(git log -1 --format=%ce "$c")
            s=$(git log -1 --format=%s "$c" | cut -c1-60)
            if [ "$ce" = noreply@github.com ]; then
              # GitHub made it (a squash merge, an update-branch merge): accept it
              # only when the API says GitHub signed and verified it as web-flow.
              v=$(curl -fsS --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
                  "${API}/repos/${REPO}/commits/${c}" | jq -r '[(.commit.verification.verified|tostring), .commit.verification.reason, (.committer.login // "none")] | @tsv') \
                || { echo "FAIL ${c:0:12} committed by GitHub, and the API could not be read: $s"; BAD=1; continue; }
              IFS=$'\t' read -r ok reason login <<<"$v"
              if [ "$ok" = true ] && [ "$login" = web-flow ]; then
                echo "OK   ${c:0:12} GitHub web-flow, verified: $s"
              else
                echo "FAIL ${c:0:12} committed as GitHub but not verified (verified=$ok reason=$reason committer=$login): $s"; BAD=1
              fi
              continue
            fi
            # grep reads the whole object (no -q), so under pipefail a long
            # commit message never ends the pipeline with SIGPIPE.
            if ! git cat-file commit "$c" | grep '^gpgsig' >/dev/null; then
              echo "FAIL ${c:0:12} unsigned, committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            if ! g verify-commit "$c" >/dev/null 2>&1; then
              echo "FAIL ${c:0:12} signed by a key not in the registry (or a bad signature), committer $(shown "$ce"): $s"; BAD=1; continue
            fi
            signer=$(g log -1 --format=%GS "$c")
            if [ "$signer" != "$ce" ]; then
              echo "FAIL ${c:0:12} principal mismatch: the key is registered to $signer, the committer is $(shown "$ce"): $s"; BAD=1; continue
            fi
            echo "OK   ${c:0:12} signed by $signer: $s"
          done
          exit $BAD

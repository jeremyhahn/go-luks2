# codex-review-template: v1 — automated Codex peer review for pull requests.
# Copied from a shared template into each repository, so a change here belongs
# upstream in the template too. Self-hosted-ONLY by design: the public host
# remains an owner-gated manual channel, so the job guards itself off
# github.com.
#
# The `codex` runs-on label routes this job to the dedicated review runners,
# whose job image bakes the codex CLI and the review assets, and whose config
# mounts the host's logged-in codex OAuth session. ONLY this workflow may
# declare `runs-on: codex` — that label carries the credential mount, so the
# label IS the capability and handing it to a second workflow hands that
# workflow a live session.

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Codex Review
    runs-on: codex
    # The review image is the job container; nothing to install.
    if: github.server_url != 'https://github.com'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Codex peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: /opt/codex-review/pr-review.sh

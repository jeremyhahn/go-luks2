# codex-review-template: v1 — automated Codex peer review for pull requests.
# Copied from a shared template into each repository, so a change here belongs
# upstream in the template too. Self-hosted-ONLY by design: the public host
# remains an owner-gated manual channel, so the job guards itself off
# github.com.
#
# The `codex` runs-on label routes this job to the dedicated review runners,
# whose job image bakes the codex CLI and the review assets, and whose config
# mounts the host's logged-in codex OAuth session. ONLY this workflow may
# declare `runs-on: codex` — that label carries the credential mount, so the
# label IS the capability and handing it to a second workflow hands that
# workflow a live session.

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Codex Review
    runs-on: codex
    # The review image is the job container; nothing to install.
    if: github.server_url != 'https://github.com'
    timeout-minutes: 45
    env:
      # CANARY (2026-09-02): this repository is the single opt-in for the
      # `exec-basis` prompt overlay, which requires every verdict to state what
      # it actually ran and whether it completed. The other 16 consumers stay on
      # the base prompt.
      #
      # Why here: this repo has the most review traffic and a twelve-round
      # baseline measured on PR #91 — 3 rounds completed a full package run and
      # said so, 2 disclosed an interrupted or compile-only run (one of them an
      # APPROVE resting on `go test -run '^$' -count=0`), and 5 said nothing at
      # all, including the round a merge was cleared on. Reviewer job durations
      # ranged 75s-380s on identical work, so the review window is a distribution
      # rather than a budget.
      #
      # The overlay does NOT change what satisfies the gate, only what the
      # verdict reports. The footer carries `prompt exec-basis@<hash>` so canary
      # output is distinguishable from control output.
      #
      # ROLLBACK: delete these two lines. No image rebuild needed.
      # PROMOTE:  move the overlay's content into the base prompt and delete the
      #           fragment, then rebuild the review image so every consumer gets
      #           it. Promotion is deliberate and separate: a canary that becomes
      #           the default by accident is not a canary.
      CODEX_REVIEW_PROMPT_VARIANT: exec-basis
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Codex peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: /opt/codex-review/pr-review.sh

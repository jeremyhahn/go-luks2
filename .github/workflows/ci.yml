name: CI

# ONE workflow file, run by two different Actions hosts: github.com and a
# self-hosted forge. Steps that only work on github.com are guarded on
# github.server_url; everything that gates a merge runs on both.
#
# ci-template v1.9 (owner ruling 2026-08-20, issue #14) — STAGED FAIL-FAST,
# and, since #136, supersession as well. The self-hosted host exposes no REST
# route to cancel a run, so nothing can reach in and stop one from outside. Two
# mechanisms cover that, and they answer different questions:
#
#   WITHIN one run, fail-fast comes from ORDERING: a fast tier (lint, build,
#   unit tests) gates the expensive tier (security, integration). A broken push
#   reports in minutes and burns nothing downstream.
#
#   ACROSS runs, the `concurrency` block below cancels a run the moment a newer
#   head lands on the same ref. It is a property of the workflow the scheduler
#   reads, not an API call — which is exactly why it works on a host where no
#   cancel route exists. "No cancel API" was long read here as "cancellation is
#   impossible"; the narrow claim is true and the conclusion was not.
#
# trivy and fips moved to nightly.yml: both were known-red on every push, and a
# known-red job burning runner-minutes per push verifies nothing.
on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:

# Supersede an in-flight run when a newer head lands on the same ref: the older
# run is cancelled and the newest survives. Measured across this portfolio, 73%
# of runs were already superseded yet ran to completion, on a runner pool every
# repository shares — so the wasted slots were other projects' queue latency,
# not only this one's.
#
# `${{ github.workflow }}` LEADS the key deliberately. It scopes the group to
# this workflow alone, so a cancellation here can never reach the separate
# review workflow that also gates a merge; that one carries its own group.
#
# `cancel-in-progress` is the literal `true` and must stay literal. This host
# does not evaluate expressions in that field — any non-empty value is truthy —
# so a `${{ ... }}` guard meant to narrow it would read as always-on instead.
#
# MAIN PUSHES ARE IN SCOPE, and that is the cost of the line above rather than
# an oversight. `push` fires only on `main`, so every trunk commit shares the
# one group `CI-refs/heads/main`: merge two pull requests a few minutes apart
# and the FIRST merge commit's run is cancelled by the second. `main` then
# carries a commit whose CI never completed, reported `cancelled`.
#
# The usual narrowing — `cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}`
# — is exactly what the paragraph above says this host cannot do: the
# expression is not evaluated, the value is non-empty, and it reads as `true`.
# So the choice here is between per-push supersession everywhere and none at
# all, and it is taken deliberately: a superseded trunk run is re-runnable from
# the forge, the tags a release is verified against are cut from a commit that
# has been through a completed run, and 73% waste on a shared pool is a cost
# every other project in it pays. Recorded rather than fixed, because the fix
# is a host capability this host does not have.
#
# `github.ref` rather than `github.head_ref || github.ref` is safe ONLY while
# `push` is restricted to `main`: for a pull_request the ref is already
# `refs/pull/<n>/merge`, so supersession works. Add a push trigger for
# `issue/*` and the same commit lands in two groups, and the figure above
# regresses without anything failing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # latest 1.26 patch (owner ruling 2026-08-20): 1.27.0 is BLOCKED — a
  # transitive dependency fails to compile under it (undefined fastrand64).
  # Never `stable`: it flipped to 1.27.0 mid-campaign and broke every repo
  # riding it.
  GO_VERSION: "1.26.7"

  # ANALYSIS TOOL PINS (#21, #44). These are the versions BAKED into the
  # self-hosted runner image; the steps below assert the binary they got
  # matches, and refuse to run otherwise.
  #
  # Pinned because an unpinned scanner self-updates underneath you. When it
  # does, a new rule fires on code untouched for months and reddens whichever
  # pull request happens to run next: the error accuses innocent work, `main`
  # is latently red, and nobody can reproduce the previous green. gosec was
  # exactly this — `make security` reported `Gosec : dev`, meaning a binary
  # built from source at an unknown revision, so two runs of the same commit
  # could disagree and neither was reproducible.
  #
  # Bumping one of these is a DELIBERATE change, one issue per bump, and the
  # runner image is bumped in the same breath — a version skew between the two
  # fails this job rather than silently scanning with something else.
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.7.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      # COMPILE EVERY SUPPORTED BUILD-TAG CONFIGURATION (#43), in the FAST
      # tier, so it gates before anything expensive runs. This replaces a bare
      # `go vet ./...`, which covered the default configuration only.
      #
      # Nothing previously enforced that a file's build tag matches the symbols
      # it uses, and the gap had already cost a regression: a test file landed
      # untagged while a helper it called 15 times lives under
      # `//go:build !integration`. go build, go vet, go test -race on both
      # packages, golangci-lint, gosec, govulncheck and go mod verify all
      # returned 0; only `-tags=integration` was red, and the only job that ran
      # it was the Docker integration suite at the far end of the pipeline.
      #
      # The tag list is DERIVED from the //go:build lines in the tree, not
      # written down — a written list is accurate until someone adds a tag and
      # then it is silently short. It is also compile-only: no volumes, no
      # privileges, no root, under a second.
      #
      # .golangci.yml stays default-tag-only, deliberately and correctly:
      # adding `integration` there SWAPS one set for the other and makes
      # `unused` fire on every helper the unit tests call. This step is what
      # covers the tag dimension; the linter is not.
      - name: Compile every supported build-tag configuration
        run: ./scripts/build-tags.sh

      # LOCK-COVERAGE GUARD. Unique per-attempt names stopped two jobs killing
      # each other and thereby allowed two suites to run at once against a
      # host-global loop-device pool. The lock keeps that safe, and a lock is
      # only as good as its coverage -- one unlocked entry point restores the
      # contention entirely. The invariant was broken twice while being
      # introduced, both times by enumerating the MECHANISM (`docker run`)
      # instead of the RESOURCE (the pool), so it is checked rather than
      # remembered. --self-test first: a guard that cannot say "no" reports what
      # a clean check reports.
      - name: Refuse an unlocked privileged integration entry point
        run: |
          ./scripts/integration-lock-guard.sh --self-test
          ./scripts/integration-lock-guard.sh

      # REGRESSION GUARD (#17). `losetup -D` detaches every loop device on the
      # machine; `dmsetup remove_all` removes every dm mapping. Neither is
      # namespaced, so both reach the HOST whatever the container is confined
      # to — measured on the machine where this was found, every run asked the
      # kernel to remove the mapping under the root filesystem, and survived
      # only because those devices were held open.
      #
      # This is a check rather than a rule because the rule already existed: a
      # standing written instruction not to add a second `losetup -D` call
      # site, at a point when there were four, one of which then survived the
      # fix for the other three because it lived in a file nothing CI-facing
      # opens.
      - name: Refuse ownership-blind device teardown
        run: ./scripts/no-global-device-cleanup.sh

      # PUBLIC-MIRROR GUARD (#20). This repository is mirrored publicly and a
      # release publishes a tree byte-identical to the internal tag, so every
      # tracked file is a published file. #20 asserts a WHOLE-TREE property —
      # no workstation paths, no private repo name, no internal forge address,
      # no named runner hosts, no internal ticket numbers, no citations of
      # company documents that resolve to nothing outside.
      #
      # It runs on every push because such a property stops holding the moment
      # anything merges beneath it. Establishing it once on a branch and
      # trusting people to re-check is how it decays; the issue's own
      # verification section says to re-run the sweep after any rebase, which
      # is a job for a gate rather than for a habit.
      - name: Refuse internal infrastructure detail
        run: ./scripts/no-internal-disclosure.sh

      # Six defects in one branch (#96) were one idea: "I could not find out"
      # rendered as "it is fine". Review found each of them, at one per round,
      # and only because the reviewer happened to look there. This is the same
      # check mechanically, on every run.
      #
      # It self-tests FIRST, and that ordering is the point: a guard that cannot
      # say both yes and no is the defect it exists to catch, one level up. It
      # would have caught five of the six instances before any review round --
      # verified against the historical commits.
      - name: Refuse an error collapsed into a benign answer
        run: |
          ./scripts/error-collapse-guard.sh --self-test
          ./scripts/error-collapse-guard.sh

      # The version gate has its own tests, and they run HERE rather than only
      # on a developer's machine — a suite nothing executes is a suite that can
      # rot into agreement with whatever the code does. They use fakes printing
      # the real output formats, take no network, and finish in under a second.
      # They exist because the comparison they cover shipped FAILING OPEN: a
      # substring test accepted v11.7.0 for a v1.7.0 pin.
      - name: Test the pinned-version gate
        run: ./scripts/require-tool-test.sh

      # The two repository guards get their own behavioural tests, for the same
      # reason the version gate does: running a guard against the current clean
      # tree proves it can say yes and nothing else, and a guard that has
      # stopped detecting is indistinguishable from a clean repository. Every
      # review round on these found a fail-open path a clean-tree run called
      # fine -- one of them introduced BY the fix for an earlier finding. Each
      # is a case in the suite. Fixtures in throwaway git repos; no network, no
      # devices.
      - name: Test the repository guards
        run: ./scripts/guards-test.sh

      # NO NETWORK INSTALL (#44). golangci-lint is baked into the self-hosted
      # runner image at GOLANGCI_LINT_VERSION. The install this replaces had
      # grown a hand-rolled 3-attempt retry loop, which is the tell: every host
      # in this fleet resolves an AAAA record for sum.golang.org and none has a
      # default IPv6 route, so a module fetch intermittently dies with
      # ENETUNREACH when Go's v6->v4 fallback does not complete. Retrying was
      # treating the symptom in one repo; baking the tool removes the fetch.
      #
      # THE PIN MOVED v2.12.2 -> v2.13.2, DELIBERATELY AND ON EVIDENCE.
      # v2.12.2 was pinned because @latest had moved to v2.13.0, which panicked
      # under Go 1.26 ("nilness: internal error: unhandled builtin recover" in
      # honnef.co/go/tools) and took the whole gate down. The runner image has
      # since been rebuilt with v2.13.2, and this gate is what surfaced the
      # skew — the job went red naming both versions instead of quietly linting
      # with something other than the pin, which is the entire point of it.
      #
      # Measured before moving the pin rather than assumed from a version
      # number: v2.13.2 was installed and run against this repository under Go
      # 1.26.7. It exits 0 with "0 issues.", does not panic, and reports the
      # SAME seven enabled linters as v2.12.2 (errcheck, gocritic, govet,
      # ineffassign, misspell, staticcheck, unused) — so the bump does not
      # silently drop a security linter, which would be the quiet way for this
      # to go wrong. The binary tested self-reports mod sum
      # h1:bCyq3E4vo9qwzifjpzJqYndEt7Ncva80qkk8G2B4TXU=, identical to the one
      # the runner reported, so this is the same artifact and not merely the
      # same version string.
      - name: Require golangci-lint at the pinned version
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/.github/require-tool.sh" \
            golangci-lint "$GOLANGCI_LINT_VERSION" \
            "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

      # .golangci.yml enables the security linters (staticcheck, errcheck,
      # unused, ineffassign, misspell, gocritic). The umbrella linter with
      # those switched off looks like a lint gate and catches none of what one
      # is for.
      - name: Run golangci-lint
        run: golangci-lint run --timeout=10m ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # STAGED FAIL-FAST (v1.9): gated on the fast tier — a push that cannot
    # lint, build or pass unit tests should not spend a heavy gosec and
    # govulncheck pass.
    needs: [lint, build, test-unit]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # NO NETWORK INSTALL (#44), same reason as the lint job: both tools are
      # baked into the self-hosted runner image at the pinned versions above,
      # and the `go install` steps this replaces were a live source of
      # intermittent ENETUNREACH failures on every Security Scan leg.
      #
      # This step is also the fix for `Gosec : dev` (#21). gosec takes its
      # version string from ldflags, NOT from the module path, so
      # `go install ...@v2.29.0` alone still self-reports `dev` — installing at
      # a pin was never sufficient and that is why the assertion, rather than
      # the pin, is the deliverable. The image builds it with the -X flag; the
      # fallback below does the same.
      - name: Require gosec and govulncheck at the pinned versions
        run: |
          set -eu
          "${GITHUB_WORKSPACE}/.github/require-tool.sh" \
            gosec "$GOSEC_VERSION" \
            "github.com/securego/gosec/v2/cmd/gosec" \
            -ldflags "-X main.Version=${GOSEC_VERSION}"
          "${GITHUB_WORKSPACE}/.github/require-tool.sh" \
            govulncheck "$GOVULNCHECK_VERSION" \
            "golang.org/x/vuln/cmd/govulncheck"

      # The Makefile carries the flags and the justification for every
      # suppression, and CI calls that same target — so a finding a developer
      # sees locally is the finding that blocks the merge, with no second set
      # of flags that can drift. gosec runs with no -exclude rules: the
      # findings this repository carries are annotated at the line that
      # produces them, so a new occurrence elsewhere still fails.
      # GOSEC_EXTRA only adds the SARIF written for the upload below; gosec
      # still exits non-zero on a finding and gates here.
      #
      # THIS IS THE INVOCATION THE -concurrency BOUND PROTECTS (#22), and it is
      # this job — a container-capped runner — that needs it. gosec sizes its
      # worker pool from runtime.NumCPU(), ignoring GOMAXPROCS and ignoring
      # cgroup CPU limits, so unbounded it spawns one worker per HOST core here
      # and is OOM-killed. An OOM exits 137, and a non-zero exit from gosec
      # reads as a SECURITY FINDING — so the failure would present as this gate
      # catching something, and send the next person auditing code that was
      # never the problem.
      #
      # The flag is NOT restated here on purpose. It lives at GOSEC_CONCURRENCY
      # in the Makefile, with the same reasoning at the definition, and this job
      # calls that target — one bound, one place, nothing to drift. Overriding
      # it from this workflow would recreate exactly the second-set-of-flags
      # problem the paragraph above says this arrangement avoids.
      - name: Run gosec
        run: make gosec GOSEC_EXTRA="-fmt=sarif -out=gosec.sarif"

      # The code scanning API is github.com-only; anywhere else this 404s. The
      # scan itself has already run and already failed the job on a finding.
      - name: Upload gosec SARIF
        if: always() && github.server_url == 'https://github.com'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # govulncheck is also the §9 forcing function for toolchain currency: it
      # fails on a known-vulnerable stdlib, so a stale GO_VERSION breaks here.
      - name: Run govulncheck
        run: make govulncheck

      - name: Verify module integrity
        run: make verify

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # THE RACE LEGS BELOW NAME THEIR PACKAGES; THIS ASSERTS THE LIST IS
      # COMPLETE (#34). Today `go list ./...` returns exactly the two packages
      # raced below, so the enumeration is accurate — which is exactly when to
      # install the check, because its failure mode is silent. Add a third
      # package and CI would race two of three: no job fails, no warning
      # appears, and the legs quietly stop covering the module.
      #
      # The enumeration is kept rather than replaced with `./...` because each
      # leg writes its own coverage profile and the two are reported
      # separately. Asserting the list is the other branch of the issue's
      # acceptance and fails LOUDLY at the moment of divergence.
      - name: Assert the race legs cover every package
        run: ./scripts/race-packages.sh ./pkg/luks2 ./cmd/luks2 ./test/harness ./test/harness/cmd/luks2-testreap

      # WHAT THE RACE DETECTOR HERE DOES AND DOES NOT COVER (#34 item 3),
      # stated so "we run the race detector" is never read as more than it is:
      #
      #   COVERED: the DEFAULT-tag build of ./pkg/luks2 and ./cmd/luks2.
      #   NOT COVERED: anything behind `//go:build integration`. That includes
      #     pkg/luks2's own integration-tagged test files — this package is
      #     raced under the default tag set, which excludes them — and the
      #     packages test/integration/pkg and test/integration/cli, which do
      #     not exist at all without the tag.
      #
      # DECISION, recorded rather than left as an accident of how these legs
      # were written: the integration suites are NOT race-checked, for now.
      # They run in a container, against loop devices, device-mapper and
      # mounts, and they are already the pipeline's long pole; -race measured
      # ~4.6x on this codebase, and the unit suite needs
      # 30 minutes without it. That is a cost to weigh, and it cannot be
      # weighed from a workstation: the container refuses to run where the host
      # device-mapper is visible with foreign mappings, so the number has to
      # come from a runner.
      #
      # WHAT WOULD CHANGE IT: time `go test -race -tags=integration ./pkg/luks2`
      # inside the integration container on a runner. That one suite is the
      # part worth racing — it is the library's own concurrency-sensitive code,
      # as opposed to the two black-box CLI-driving suites. If it fits the
      # budget, add -race to that entrypoint line and narrow this note; if it
      # does not, record the measured cost here so the next person does not
      # re-derive it. This is a deliberate NO, not an oversight, and it is
      # reversible on evidence.
      #
      # -timeout 30m, deliberately, against Go's 10-minute DEFAULT.
      #
      # This suite is KDF-bound by design. Opening a volume costs a
      # 600000-iteration digest derivation plus the keyslot's own, and an
      # expensive KDF is the security feature, not an inefficiency to optimise
      # away. On top of that CI runs it under -race, measured at ~4.6x the plain
      # cost on a workstation, and this runner is a further ~2.6x slower than
      # one. 10 minutes was never a considered budget for that; it is simply
      # what go test defaults to, and the package crossed it at 600.08s.
      #
      # The headroom is NOT the fix for a slow suite -- that was removing the
      # 45% of CI runtime the enclave-custody tests were spending on redundant
      # container formats, which is done. This keeps a legitimately slow suite
      # from being reported as a hang.
      # CRYPTSETUP IS A TEST DEPENDENCY OF ./pkg/luks2, NOT AN OPTIONAL EXTRA.
      #
      # conformance_test.go is in the DEFAULT tag set, so it runs in this job --
      # and its `requireCryptsetup` used to t.Skipf when the binary was absent.
      # This runner image has no cryptsetup, so every TestConformance_* passed
      # here having executed nothing, and the job reported success. Measured on
      # PR #159's unit leg: NINE skip messages across conformance_test.go and
      # geometry_test.go, all green.
      #
      # That suite is the whole bidirectional interoperability property -- that
      # cryptsetup can open what this library writes, and the reverse. It took
      # seven review rounds to earn, after a period when cryptsetup refused
      # every container this library produced and an encrypted volume had NO
      # recovery path. Guarding it with a mechanism that turns absence into
      # success is how that regresses unnoticed.
      #
      # ../handbook/software/conventions/testing-guidelines.md ranks the remedies
      # and this is the first one. The devcontainer and the integration image
      # already install cryptsetup-bin; this job was the only place it was
      # missing.
      #
      # The version is asserted, not assumed. An install that silently produced
      # no usable binary would put the suite straight back to skipping, which is
      # the failure this step exists to remove.
      - name: Install cryptsetup (a test dependency of ./pkg/luks2)
        run: |
          set -eu
          if ! command -v cryptsetup >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq cryptsetup-bin
          fi
          cryptsetup --version
          command -v cryptsetup >/dev/null 2>&1 || {
            echo "::error::cryptsetup is still absent after install; the conformance suite would skip and report green."
            exit 1
          }

      - name: Run unit tests (pkg/luks2)
        run: go test -v -race -timeout 30m -coverprofile=coverage-pkg.out -covermode=atomic ./pkg/luks2

      - name: Run unit tests (cmd/luks2)
        run: go test -v -race -timeout 30m -coverprofile=coverage-cli.out -covermode=atomic ./cmd/luks2

      # WITHOUT -race, deliberately, and not a duplicate of the step above.
      #
      # The PBKDF2 calibration defect (#52) is invisible under -race. Measured:
      # the old implementation gated its extrapolation on
      # `elapsed.Milliseconds() > 0`, race instrumentation slows the probe past
      # 1ms, the gate passes, and the broken code returns a plausible,
      # correctly-scaling count. Uninstrumented, the same code returns a
      # hardcoded 100000 on every pbkdf2 volume it formats -- 25-100x under the
      # requested work factor. Every calibration test passes against the
      # restored defect under -race and fails against it without.
      #
      # This job otherwise runs ./pkg/luks2 under -race only, which is how that
      # weakening survived five merges and three releases of green CI. The
      # uninstrumented build is the one that ships.
      - name: Run PBKDF2 calibration tests (no -race)
        run: make test-calibration

      # test/harness is the ledger that keeps the integration suite from
      # leaking host state (#96). It is raced HERE, in the unit tier, because
      # everything in it is in-memory and file-based -- it never touches
      # device-mapper or a loop device, which is exactly why it can be.
      #
      # It also has to be somewhere: a package CI builds but never tests is a
      # blind spot, and this one decides what gets REMOVED from a host. The
      # reaper command is listed alongside it so race-packages.sh's enumeration
      # stays complete.
      - name: Run unit tests (test/harness)
        run: go test -v -race -timeout 30m -coverprofile=coverage-harness.out -covermode=atomic ./test/harness ./test/harness/cmd/luks2-testreap

      # Recorded so the next slow or failing run has evidence rather than a
      # guess. RLIMIT_MEMLOCK is the one that turns this package's fail-closed
      # design into a red suite: measured on a workstation, the suite passes
      # down to 512 KiB and fails comprehensively at 64 KiB with
      # "could not allocate locked memory ... limit reached?".
      - name: Record the resource limits these tests ran under
        if: always()
        run: |
          echo "RLIMIT_MEMLOCK (KiB): $(ulimit -l)"
          echo "nproc: $(nproc)"
          df -h /tmp | tail -1

      # Every profile the legs above produce is merged here. A profile that is
      # written and then left out does not fail anything -- the leg still gates
      # -- it just makes the reported number describe less of the module than a
      # reader assumes, which is the same silent narrowing scripts/race-packages.sh
      # exists to prevent one level up. Adding a race leg means adding its
      # profile to this list.
      - name: Merge coverage
        run: |
          echo "mode: atomic" > coverage.out
          grep -v "^mode:" coverage-pkg.out >> coverage.out 2>/dev/null || true
          grep -v "^mode:" coverage-cli.out >> coverage.out 2>/dev/null || true
          grep -v "^mode:" coverage-harness.out >> coverage.out 2>/dev/null || true

      - name: Show coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "Coverage: ${coverage}"

      # upload-artifact v4+ refuses to run against any server that is not
      # github.com — it detects one and reports "not currently supported on
      # GHES", and the self-hosted forge presents as such. The tests above have
      # already run and already gated; only the artifact is skipped.
      - name: Upload coverage
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.out

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # EVERY DOCKER NAME THIS JOB CREATES IS UNIQUE TO THIS JOB ATTEMPT (#105).
    #
    # Docker names and image tags are unique PER HOST, not per job. Six open
    # pull requests share four runners, so two integration jobs routinely land
    # on one machine — and both used to use the constant name
    # `go-luks2-test-runner` and the constant tag `go-luks2-integration-test`.
    # Two separate defects followed, and both were measured rather than
    # theorised:
    #
    #   THE KILL. `docker rm -f` sends SIGKILL. Job B's pre-run cleanup killed
    #   job A's RUNNING container mid-suite, and A's step exited 137.
    #   Reproduced deterministically by running the old four-line sequence
    #   twice on one host: job A exit=137, job B exit=0. It looked like an OOM
    #   and was not one — Infrastructure found no OOM kill in eighteen hours —
    #   and SIGKILL cannot be caught, which is why no `defer` or `t.Cleanup` in
    #   the suite ever ran and why the container leaked every loop device and
    #   device-mapper mapping it held.
    #
    #   THE WRONG RESULT, quieter and worse. A shared image TAG is resolved at
    #   `docker run` time. Job B's build moved the tag between job A's build
    #   and A's run, so A tested B's tree and reported the result against A's
    #   commit. Measured: two images built from different sources under one
    #   tag, and the first job's run printed the SECOND job's content. That
    #   failure is GREEN, so nothing would ever have reported it.
    #
    # run_attempt is part of the name because a re-run of this job must not
    # collide with its own previous attempt.
    #
    # WHAT THIS FIX UNCOVERS, stated rather than left to be discovered (#104)
    #
    # The collision was, accidentally, the only thing SERIALISING integration
    # jobs on a runner: two landed, the second force-removed the first, and the
    # survivor had the host to itself. Unique names remove the kill, so two
    # suites now genuinely run at once — privileged, on one kernel, against one
    # loop-device pool. That can convert #104 from intermittent to routine, and
    # it is not hypothetical arithmetic:
    #
    #   /sys/module/loop/parameters/max_loop = 8, so nodes loop0..loop7 exist
    #   and nothing creates loop8. TestLoopDeviceMultiple alone holds 5 at its
    #   peak, and no integration test calls t.Parallel(), so one suite peaks at
    #   5 of 8. TWO CONCURRENT SUITES NEED 10 AND THE HOST HAS 8. The CI
    #   failure log confirms the same ceiling on the runner: loop0..loop7 all
    #   allocated, and then
    #   `failed to open /dev/loop8: no such file or directory`.
    #
    # It does not follow that this change makes things worse on net. The
    # SIGKILL it removes was ITSELF a leak source — a killed container runs no
    # cleanup and abandons every loop device it held, which is what consumed
    # the low minors in the first place. Fewer kills means fewer orphans means
    # a deeper pool. Which effect dominates is not something this comment can
    # claim, so it does not.
    #
    # A `concurrency:` group was considered as a companion and REJECTED, for
    # two reasons:
    #
    #   It cannot be scoped to a runner. Concurrency keys are evaluated when
    #   the job is created, before it is assigned, so `runner.*` is not in
    #   scope for one. The only key available is a constant, which serialises
    #   integration across ALL FOUR runners — trading a random kill for a
    #   queue one job deep across the whole pool, on the slowest leg there is.
    #
    #   And it would not close the hole. The loop pool is host-global and
    #   shared with everything else on the box; serialising this repository's
    #   own jobs narrows the window and leaves the failure reachable.
    #
    # The companion is #104 itself — already filed, task:ready, effort:low —
    # because its fix removes the ceiling rather than rationing it: create the
    # node for the minor LOOP_CTL_GET_FREE returned (major 7) instead of
    # assuming udev already did. Measured while answering this: in a
    # `--privileged` container /dev is a FRESH TMPFS, not the host's — docker
    # populates it once at creation and there is no udev inside — so a device
    # the kernel adds later gets no node in the container, ever. The "wait
    # briefly for udev" alternative in #104 cannot work here; mknod is the only
    # option that does. That measurement is posted on #104.
    env:
      # The job term is the literal job id, NOT ${{ github.job }}. Uniqueness
      # already comes from run_id + run_attempt; the job term only has to be a
      # legal token, and github.job is not reliably one. This forge resolves it
      # to the job KEY -- measured: container go-luks2-test-runner-17144-test-
      # integration-1 on run 17144 -- but GitHub Actions documents it as unset
      # outside step execution, and act-derived runners have resolved it to the
      # display NAME, which here is "Integration Tests". A space makes both a
      # container name and an image tag invalid ([a-zA-Z0-9][a-zA-Z0-9_.-]*),
      # so the merge-gating job would die on a malformed name rather than on
      # anything it tests. A literal cannot diverge between hosts.
      ITEST_IMAGE: go-luks2-integration-test:${{ github.run_id }}-test-integration-${{ github.run_attempt }}
      ITEST_CONTAINER: go-luks2-test-runner-${{ github.run_id }}-test-integration-${{ github.run_attempt }}
    # STAGED FAIL-FAST (v1.9): gated on the fast tier, not on `security` — two
    # expensive jobs gating each other would serialise them for no benefit.
    # The suite races on host-global loop devices — /dev/loop* is NOT
    # namespaced, so two concurrent runs on one machine share one pool — which
    # is why it runs inside the container and never bare on a shared runner.
    needs: [lint, build, test-unit]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # go.mod pins github.com/jeremyhahn/go-enclave, whose module PATH says
      # github.com while it is served from a private module host. The runner
      # injects GOPRIVATE and the tokenised insteadOf rewrite into this job's
      # environment, but a job environment does NOT cross into a docker build --
      # hence handing it over explicitly.
      #
      # Written under RUNNER_TEMP, deliberately OUTSIDE the build context: the
      # Dockerfile ends with `COPY . .`, so a credentials file inside the
      # workspace would be baked into a layer. .dockerignore lists gomodauth* as
      # a second line of defence. It is a BuildKit secret, never a build arg --
      # an arg is recoverable with `docker history`.
      #
      # On GitHub none of these variables exist, the file is written empty, and
      # the Dockerfile's mount is optional, so the same build works there
      # against the public proxy.
      #
      # The variables are read straight from the shell environment, NOT through
      # ${{ env.X }} -- that expression reads this workflow's own `env:` block,
      # which does not define them, and would quietly write blanks. The failure
      # then looks like an unrelated "unknown revision".
      - name: Stage module-fetch credentials
        run: |
          set -eu
          umask 077
          : > "${RUNNER_TEMP}/gomodauth.env"
          if [ -n "${GIT_CONFIG_KEY_0:-}" ]; then
            {
              printf 'export GOPRIVATE=%s\n' "${GOPRIVATE:-}"
              printf 'export GIT_CONFIG_COUNT=%s\n' "${GIT_CONFIG_COUNT:-}"
              printf 'export GIT_CONFIG_KEY_0=%s\n' "${GIT_CONFIG_KEY_0}"
              printf 'export GIT_CONFIG_VALUE_0=%s\n' "${GIT_CONFIG_VALUE_0:-}"
            } > "${RUNNER_TEMP}/gomodauth.env"
            echo "staged private-module credentials"
          else
            echo "no private-module credentials here; resolving from the public proxy"
          fi

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=gomodauth,src="${RUNNER_TEMP}/gomodauth.env" \
            -f test/integration/Dockerfile \
            -t "$ITEST_IMAGE" .

      - name: Remove staged credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/gomodauth.env"

      # NO PRE-RUN `docker rm -f`. The deleted line existed to clear a leftover
      # from this job's previous attempt; with a name unique to the attempt
      # there is nothing of ours to clear, and a delete by any broader name is
      # the race itself. Cleanup of THIS job's container moved to the always()
      # step below, which is where it belongs: the old trailing `rm -f` never
      # ran when the suite failed, because the step aborts on the failing
      # command, so a red run left its container behind for the next job's
      # pre-run delete to collect — the very line that did the killing.
      - name: Run integration tests
        # LUKS2_TEST_STATE_DIR is bind-mounted from the RUNNER, not left inside
        # the container, and that is the whole mechanism (#96).
        #
        # The suite creates host dm mappings and loop devices -- neither is
        # namespaced, so they land on the machine however the container is
        # confined. Dropping --privileged (#80) did not change that and was
        # never going to: scoping device access decides which nodes are
        # reachable, not which kernel dm and loop belong to. The suite records
        # each one before creating it, and the next run removes exactly what
        # was recorded. A record kept inside the container dies with the run it
        # describes, which is precisely the run whose state needs removing, so
        # the ledger has to live on the host to be worth anything.
        #
        # The directory deliberately persists between jobs. It is NOT cleaned
        # here: a ledger left behind is a run that died, and erasing it would
        # discard the only record of what that run put on this machine.
        run: |
          set -eu
          STATE_DIR=/var/tmp/go-luks2-test-state

          # NOT created here, deliberately. The reaper inside the container runs
          # as root, before the #85 guard, and removes whatever the ledgers in
          # this directory name -- so the directory is part of the trust
          # boundary. Created by the RUNNER user it would be owned by a
          # non-root uid, and the harness refuses that: a root process must not
          # act on control files another user maintains.
          #
          # Docker creates a missing bind-mount source itself, as root:root
          # 0755, which is what the harness accepts. If the path already exists
          # and is not trustworthy -- someone else's, or group/other-writable,
          # /var/tmp being world-writable and sticky -- the run FAILS with a
          # diagnosis instead of proceeding, which is the intended outcome.
          if [ -e "${STATE_DIR}" ]; then
            echo "state dir already present:"
            ls -ldn "${STATE_DIR}"
          fi

          # No pre-run remove. With a name no other job attempt can hold there
          # is nothing of ours to clear, and a remove by any broader name is
          # the race itself (#105).
          # HOST-SCOPED SERIALIZATION. Per-attempt names stop two jobs killing
          # each other; they do NOT isolate the loop-device pool, which is
          # host-global -- a suite holds about five devices and the host provides
          # eight, so two overlapping suites can need ten and one fails for a
          # reason unrelated to the code under test. Unique names removed a
          # collision and exposed a contention.
          #
          # The lock is deliberately NOT inside STATE_DIR: the harness validates
          # that directory's owner because its ledgers authorize host device
          # removal, so a lock written there either breaks the suite or weakens
          # the check. Same path as the Makefile's ITEST_LOCK, because a second
          # lock path would serialize nothing.
          #
          # A workflow `concurrency:` key would be repo-scoped and would not
          # cover two repositories sharing a runner.
          # No privilege flags here, on purpose. They all live in
          # test/integration/docker-run.sh, which the Makefile targets call
          # too, so this workflow and a developer's `make integration-test`
          # cannot drift into running under different privilege (#80).
          flock /var/tmp/go-luks2-itest-loopdev.lock \
            env IMAGE="${ITEST_IMAGE}" TEST_STATE_DIR="${STATE_DIR}" \
              test/integration/docker-run.sh --name "${ITEST_CONTAINER}" --

      # Separate and always(): coverage is worth extracting from a suite that
      # failed, and this must not be skipped by the run step aborting.
      - name: Extract integration coverage
        if: always()
        run: |
          set -u
          if ! docker container inspect "$ITEST_CONTAINER" >/dev/null 2>&1; then
            echo "no container named ${ITEST_CONTAINER}; nothing to extract"
            exit 0
          fi
          if ! docker cp "${ITEST_CONTAINER}:/app/coverage.out" coverage-integration.out; then
            echo "::warning::the container exists but /app/coverage.out could not be copied"
          fi

      # Removes ONLY what this job attempt created, by its unique names, so it
      # cannot reach another job's container or image. Without this the unique
      # names would accumulate on the runner forever, since nothing else ever
      # deletes them now that the broad pre-run delete is gone.
      - name: Remove this job's container and image
        if: always()
        run: |
          set -u
          docker rm -f "$ITEST_CONTAINER" >/dev/null 2>&1 || true
          docker image rm -f "$ITEST_IMAGE" >/dev/null 2>&1 || true

      - name: Show integration coverage
        run: |
          if [ -f coverage-integration.out ]; then
            coverage=$(go tool cover -func=coverage-integration.out | grep total | awk '{print $3}')
            echo "Integration Coverage: ${coverage}"
          fi

      - name: Upload integration coverage
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    # FAST TIER (v1.9): no `needs`. build runs alongside lint and test-unit so
    # the three of them together are the gate the expensive tier waits on.
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o luks-linux-amd64 ./cmd/luks2

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o luks-linux-arm64 ./cmd/luks2

      # 32-BIT TARGETS, COMPILE ONLY. Both existing legs are 64-bit, so nothing
      # in this repository had ever compiled for a platform where `int` is 32
      # bits -- and a guard added in #112 to bound a uint32 conversion did not
      # build on 386 or arm, while building fine on amd64. An integer-width
      # defect in the fix for integer-width defects, invisible to CI.
      #
      # The PACKAGE is what matters here, not just ./cmd/luks2: the defect was
      # in pkg/luks2 and a binary-only build would have missed it.
      #
      # `go vet`, NOT `go build`, and that distinction is the leg. go build does
      # not compile TEST files, so the first version of this step -- added
      # specifically to catch integer-width defects on 32-bit -- was
      # structurally unable to see them in tests, which is exactly where the
      # next FOUR landed. It passed while `go vet` failed on the same target and
      # the same commit.
      #
      # vet type-checks tests without running them, which is the whole check
      # here: every defect in this class is a compile-time one, and the suite
      # cannot be executed on a foreign architecture anyway. Running it under
      # emulation would be slow and would test qemu as much as the code.
      #
      # vet reports ONE error per package, so fixing a site reveals the next.
      # Four were found that way and the count was not knowable in advance --
      # if this leg fires, re-run it after each fix rather than assuming the
      # first message is the whole list.
      #
      # This is not hypothetical for the portfolio: go-trusted-platform targets
      # edge gateways, and 32-bit ARM is a real consumer architecture for a
      # disk-encryption library. A Layer 0 library that cannot build there is a
      # problem discovered at the consumer, which is the most expensive place.
      - name: Vet linux/386 (32-bit int, compiles tests)
        env:
          GOOS: linux
          GOARCH: "386"
        run: go vet ./...

      - name: Vet linux/arm (32-bit int, compiles tests)
        env:
          GOOS: linux
          GOARCH: arm
        run: go vet ./...

      - name: Upload artifacts
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: luks-linux-*

  # The single required check. Branch protection requires THIS job and nothing
  # else, so adding a job above means adding it to `needs` AND to the results
  # list below; a job left out of both runs and gates nothing.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    # v1.9: trivy and fips moved to nightly.yml (known-red jobs off the push
    # path — owner ruling 2026-08-20); they gate nothing here.
    needs: [lint, security, build, test-unit, test-integration]
    steps:
      # join(needs.*.result) is a GitHub extension that evaluates to an empty
      # string on the self-hosted host, so a gate built on it reports success
      # while jobs are
      # failing. Every job is listed by name, and a result that cannot be read
      # at all is treated as a failure rather than a pass.
      - name: Check job results
        env:
          LINT: ${{ needs.lint.result }}
          SECURITY: ${{ needs.security.result }}
          BUILD: ${{ needs.build.result }}
          TEST_UNIT: ${{ needs.test-unit.result }}
          TEST_INTEGRATION: ${{ needs.test-integration.result }}
        run: |
          # skipped != failed, but BOTH fail the gate: under staged fail-fast a
          # skipped job means an upstream stage failed, and naming it that way
          # prevents the failure mode this was written for — a red that reads
          # as a test failure while the tests in fact never ran.
          failed=0
          for job in LINT SECURITY BUILD TEST_UNIT TEST_INTEGRATION; do
            eval "result=\$$job"
            case "$result" in
              success) echo "OK   ${job}" ;;
              skipped) echo "SKIP ${job} (upstream stage failed — see its job)"; failed=1 ;;
              "")      echo "FAIL ${job} (<unreadable>)"; failed=1 ;;
              *)       echo "FAIL ${job} (${result})"; failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "CI gate failed: not every job reported success."
            exit 1
          fi
          echo "CI gate passed."

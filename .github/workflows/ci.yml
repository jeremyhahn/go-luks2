# ci-template: v1.34.1 (customized)
# v1.34.1 (ruling 377): GO_BUILD_PROXY is <DEVCACHE_GOPROXY>|https://proxy.golang.org,
# with no trailing `direct`: no direct fetch, anywhere
# (dependency-resolution.md). A GOPRIVATE path never uses GOPROXY. The
# toolchain stage's network GOPROXY (ci-toolchain-run, the template's
# in-toolchain-image.sh v5) loses its `direct` entry as well.
# v1.34: the `changes`, `schedule-guard` and `arch-gates` jobs are one
# `preflight` job: the schedule guard first, before anything is checked out,
# then one checkout with persist-credentials false, the changed-files step and
# the architecture gate. Its outputs are needs.preflight.outputs.*, and CI
# Gate checks `preflight` in place of the three.
# v1.33.2: the releasability step takes the InfoSec waiver. A matched line
# that carries `lab-string-ok: <reason>` (colon and reason required) is listed
# as waived, path and line only, and does not fail; a bare marker still fails.
# v1.33.1 and v1.33: the pattern file has five classes, coord-host,
# internal-email, lab-address, lab-host and owner-path (optional `/i`), and
# the image namespace is the repository variable CI_IMAGE_NAMESPACE.
# v1.32: the releasability step reads the private pattern file as
# `class<TAB>regex` lines and greps the regex fields with -E.
# v1.31: the internal-name gate reads its patterns from the Actions secret
# RELEASABILITY_PATTERNS, never from this repository, and prints path and line
# only.
# v1.30: the five fixes of the 72-hour CI evaluation. (1) The lint-class
# stages leave the image job for a `lint` job that builds the toolchain image
# alone (`make docker-build-toolchain`) and runs beside build and test; the
# registry cache of the toolchain image (publish-images,
# scripts/ci-image-cache.sh) is not adopted here, see CUSTOMIZE below. (2) A
# push to main whose tree already has a green full tier gets the guard's
# `proven` verdict; on github.com the guard makes no API call, so `proven`
# cannot occur here. (3) lint-gates is path-scoped on a PR
# (LINT_GATES_PATTERN), and a PR from a checkpoint branch (lane-ckpt/*) is
# refused. (4) Every job carries timeout-minutes. (5) `make gosec` runs on the
# PR tier in the lint job (make security keeps it on the full tier), and a
# workflow_dispatch off main is refused: no full tier on a PR branch.
# v1.29.5 and v1.29.4: each image build passes
# GO_BUILD_PROXY=<DEVCACHE_GOPROXY>|https://proxy.golang.org when the runner
# sets DEVCACHE_GOPROXY and the cache answers a 5-second probe, as one quoted
# make argument (the Makefile passes it to docker build by name, `--build-arg
# GO_BUILD_PROXY`, so no shell sees the `|`); otherwise none, as before. The
# guard reads `waiting` before `in_progress`. The toolchain stage takes the job
# slot's memory bound (--memory and --memory-swap from the job's cgroup
# memory.max, 8g with no limit, IN_IMAGE_MEMORY overrides) and keeps Go's
# build scratch (TMPDIR, GOTMPDIR) on an anonymous volume on /var/tmp, not the
# 3 GB /tmp tmpfs.
# v1.29.3: a schedule run's concurrency group is `schedule-{repository}`, and
# the schedule guard (now a preflight step) holds a schedule run's jobs while
# a main push run is in flight. No workflow here is scheduled, so the guard
# only refuses (v1.30).
# CUSTOMIZE (go-luks2, the v1.29.3 to v1.34.1 adoption): the canonical
# scripts stay Makefile recipes (ci-toolchain-run, ci-reap-stacks,
# ci-trim-caches, apk-index-sum), because the public release ships no shell
# scripts. publish-images and scripts/ci-image-cache.sh are not adopted: the
# job skips on github.com, where this repository runs, and the script would be
# a shipped shell script with no registry to talk to; every job builds its
# toolchain image itself, as before. The lint job takes the image job's
# lint-class steps: the tool pins, make lint, the releasability gates (make
# releasability, this repository's RELEASABILITY_TEST, and the private
# patterns), the build-tag assertion, make gosec (PR tier) and make
# deps-check. The image job skips on a docs-only PR (`code` in CI Gate). The
# runners are unchanged: the Docker jobs, lint included, take the
# bigdisk-docker routing of ruling 442, the rest ubuntu-latest.
# v1.29.2 (Company Agent ruling 239(8), 2026-10-28): comments only; no job,
# gate or tier changes. A CUSTOMIZE job gated on a changes output (a path-gated
# suite) needs the image job too and tests an output of the image job in its
# `if:`. On a pull_request, an `if:` that reads only `needs.changes.result` or
# only `needs.changes.outputs.*` left such a job skipped unstarted (two runs
# in a row); one that also tests the image job's output started it. A
# repository needs no adoption PR.
# v1.29.1 (Company Agent ruling 226(15), 108 repair, 2026-10-27): lint fails
# fast. The lint-gates job runs `make lint-gates` without `-k`, so the first
# failing gate ends the step. Under `-k` make went on running the other gates
# after one had failed: in another repository's run Lint took 51.5 min, 37 of
# them after the `go vet` failure. A red gate now reports as soon as it fails,
# and the gates after it run on the next push. No other job, gate or tier
# changes. A repository adopts v1.29.1 as a CI-file PR.
# v1.29.0 (Company Agent ruling 220(5) and 221(4), 2026-10-27):
# the Alpine package index checksum joins the integration image's tag hash.
# Before v1.29 the tag hashed only the tree, so a tree whose files had not
# changed kept its cached image after Alpine shipped a fix, and `trivy image`
# stayed red on a fixed CVE until an unrelated file moved (another
# repository's main, CVE-2026-92392, libcurl 8.23.0-r0). A new step, "Read the Alpine
# package index", runs scripts/apk-index-sum.sh (v1, ships beside this file)
# and puts its value in APK_INDEX_SUM. Every job that names the integration
# image (image, lint-gates, integration, soak) runs it before "Name the
# integration image", so none waits for the image job's serial stages. The
# repository's `make -s it-image` hashes APK_INDEX_SUM, and `make
# docker-build` passes it to the integration image's build as `--build-arg
# APK_INDEX_SUM`. The Dockerfile's `integration` stage declares the ARG and
# then, as root, runs `apk upgrade --no-cache`, so a new sum misses the cache
# from that step on (ci-standard.md §9, devcontainer.md §6); `base` and
# `toolchain` do not declare it. So a new Alpine package release changes the
# tag and forces a rebuild, with the fixed package. A base image the script
# cannot read fails the job: a missing index is never a pass. A repository
# adopts v1.29 as one PR: this file, scripts/apk-index-sum.sh (in its
# shellcheck list), the Makefile's APK_INDEX_SUM in it-image and docker-build,
# and the Dockerfile's ARG and apk upgrade. A repository whose integration
# image has no apk base gets `none`, a constant, so its tag changes only with
# its tree. The parallel stage jobs move to v1.30: `runs-on` cannot take a
# needs output on the forge's Actions runner, and the registry-push question
# is with the owner.
# CUSTOMIZE (v1.29): "Read the Alpine package index" runs `make -s
# apk-index-sum`, the Makefile recipe of scripts/apk-index-sum.sh v1, because
# the public release ships no shell scripts; so no script joins a shellcheck
# list. This repository's integration image builds on the Debian Go image,
# which has no apk, so the recipe prints `none`, the image's tag changes only
# with the tree, and the Dockerfile declares the ARG with no apk upgrade (the
# base stage's apt-get upgrade takes Debian's fixes).
# v1.28.0 (Company Agent ruling 219(3), 2026-10-26): `make deps-check` joins
# the PR tier as a lint-class gate. Its step in the image job drops the
# CI_FULL_TIER condition and runs on every event, as `make lint` does, so a
# module behind its dependency floor fails the PR, not main after the merge
# (another repository's main went red on its push run for exactly this). The
# step keeps IN_IMAGE_NETWORK=bridge for the module proxy and runs in seconds;
# it stays on the full tier too. The image job is already `pr` in CI Gate, so
# no needs or results line changes. A repository adopts v1.28 as a CI-file PR;
# none hand-patches its ci.yml ahead of it.

name: CI

# ONE workflow file, run by two different Actions hosts: github.com and a
# self-hosted forge. Steps that only work on github.com are guarded on
# github.server_url; everything that gates a merge runs on both.
#
# RUNNERS (Company Agent m2077): every job runs on GitHub-hosted
# `ubuntu-latest`, so main's CI Gate can go green on GitHub. The self-hosted
# labels this file used (`bigdisk` for the image-building jobs, `ci-gate` for
# the gate) are gone, and .github/actionlint.yaml no longer lists them. A
# hosted runner has 4 cores, about 14 GB of free disk and a 6 h job limit:
# every job that builds a devcontainer image runs "Free runner disk" before
# its build (github.com only), and no job's timeout (120 min at most) comes
# near the limit, so none is sharded.
#
# Ruling 442: the jobs that build a devcontainer image (lint, image,
# lint-gates, merge-check, integration, soak, test-race, fips) run on the bigdisk-docker
# pool, a throwaway guest per job, for a push to main and a same-repository
# pull request, and on ubuntu-latest for every other event. Their "Free
# runner disk" step runs on the hosted runner only. bigdisk-docker is not the
# retired bigdisk label.
#
# ci-template v1.21 (ci-standard.md §2, devcontainer.md §7): every stage runs in
# this repository's own devcontainer image and no other. No job sets up Go or
# installs a tool on the runner; the image's pin file decides every version
# and the Makefile carries every flag set. Each stage is one `make` target run
# in the toolchain image through `make ci-toolchain-run`, which copies the
# checkout into the container: a runner reaches its daemon through a socket,
# so a bind mount would resolve on the daemon's host. The canonical scripts
# are Makefile recipes here (ci-toolchain-run, ci-reap-stacks,
# ci-trim-caches, assert-build-tags) because the public release ships no
# shell scripts.
#
# ci-template v1.22 (ci-standard.md §6): the stages keep the Go build,
# golangci-lint and module caches in named volumes on the runner's Docker
# host, kept across jobs and split by trust class (CI_CACHE_CLASS: `main` for
# a push to main, `pr` otherwise), never in a job container's writable layer
# or its /tmp. `make ci-trim-caches` bounds the repository's cache volumes on
# the host (CI_CACHE_MAX_GIB, default 32). CUSTOMIZE: the race, FIPS and
# merged-tree jobs run their stages through the same recipe, so they take the
# same CI_CACHE_CLASS.
#
# ci-template v1.22.2 (ci-standard.md §7): each stage runs at the job slot's
# CPU bound. ci-toolchain-run reads the job container's cgroup cpu.max and
# gives the stage container that --cpus, with GOMAXPROCS from it; no number is
# hardcoded here or in the Makefile.
#
# ci-template v1.23 (ci-standard.md §9): the integration image is named by its
# content, go-luks2-ci-it:<hash> (`make -s it-image`), built once per runner
# and reused by every job and run of that tree. No job removes it: each job
# holds a lease on it (a created, never started container), and
# `make ci-reap-stacks` removes an image older than REAP_IMAGE_MIN_AGE that no
# container uses.
#
# Concurrency (ci-template v1.26.2): main CI runs are keyed per sha. The main
# group is the workflow, the event and the commit, so each commit's run on
# main is its own group and runs to the end, and a merge never cancels the main
# run in progress; a schedule or workflow_dispatch run never shares a group
# with a push run. Every other ref is one group, so a PR's newer run cancels
# the older.
#
# Draft pull requests (ci-template v1.26): a draft PR runs no CI. Every job but
# CI Gate skips when github.event.pull_request.draft is true, and CI Gate
# fails on a draft without running anything, so no draft head carries a green
# or skipped gate into its merge. Marking the PR ready starts no run (there is
# no edited or ready_for_review trigger): the PR's own lane pushes an empty
# commit when the PR leaves draft.
#
# The forge credentials are masked first in every job that has them, and
# reach an image build only as the gomodauth BuildKit secret, from a file
# outside the context that the job removes. No step prints that file, the job
# environment or a matched line; test/ci/workflows asserts it.
#
# ACROSS runs, supersession: the self-hosted host exposes no REST route to
# cancel a run, so the `concurrency` block below is what sheds a superseded
# run.
#
# THREE TIERS, ONE GATE (ci-standard.md §8, sdlc §5a).
#
#   PR tier    every event but a draft PR: Preflight (changed files,
#              schedule guard, architecture gate), Lint, Devcontainer image,
#              Lint Gates, Merged Tree and Race. Lint (ci-template v1.30)
#              runs the tool pins, lint, the releasability gates, the
#              build-tag assertion, gosec and deps-check in the toolchain
#              image. Lint Gates (v1.27) runs `make lint-gates` beside it,
#              only when the Makefile defines the target. The image job runs
#              build and test in the toolchain image built at this commit,
#              and with them the linux binaries, the 32-bit vet, the unit
#              legs (no -race) and their coverage gate, the calibration tests
#              and the API gate. Race is the -race unit run with its
#              pkg/luks2 budget. A PR whose every changed file matches
#              DOCS_ONLY_PATTERN skips the image job, the tag assertion,
#              gosec and the race run; lint and the gates that read the docs
#              still run.
#   Full tier  push to main, workflow_dispatch, and a
#              pull_request labelled `ci:full`: the PR tier plus Integration
#              and FIPS, each its own job in the image, and the image job's
#              security (gosec, govulncheck, go mod verify, trivy's filesystem
#              scan) and trivy image steps. v1.30: a workflow_dispatch off
#              main is refused, never the full tier.
#   Nightly    workflow_dispatch only: the full tier plus
#              Soak, the integration suite looped in the integration image
#              for SOAK_MINUTES.
#
# CI Gate, the single required check, needs EVERY job and reads each by name,
# tagged `pr`, `code`, `scoped`, `full` or `nightly`. A `full` job may be
# skipped only while the full tier is not selected, a `nightly` job only off
# workflow_dispatch, a `code` job only on a docs-only PR and a `scoped` job
# only when no changed file matches LINT_GATES_PATTERN; any other skip, and
# every failure or cancellation, fails it. On a
# draft PR every job but CI Gate skips and CI Gate itself fails.
#
# No CI workflow in this repository is scheduled: its nightly run is suspended,
# so the full tier runs on push to main, workflow_dispatch and a `ci:full` PR,
# and Soak on workflow_dispatch only. nightly.yml stays
# dispatch-only; nightly.yml still runs trivy's filesystem scan, uploads its
# SARIF to code scanning on github.com, and runs the advisory
# misconfiguration scan.
#
# The full tier is CI_FULL_TIER below. A job-level `if:` cannot read env, so
# every full-tier job repeats its expression, and test/ci/workflows asserts
# they stay identical:
#
#   push, or workflow_dispatch on main         -> full tier
#   pull_request labelled ci:full              -> full tier
#
# LABEL EVENTS DO NOT RUN CI. ci.yml does not fire on `labeled`: on this host
# every label add and remove arrives as `labeled`, so each review or task
# label started a run that cancelled the PR's run in progress. A label is read
# when a run starts, so ci:full selects the full tier for any run that begins
# with the label on the PR. The gate is never skipped by an event condition: a
# job skipped by `if:` still posts a status under its name, and both hosts
# count a skipped required check as passing. Gitea does not evaluate
# expressions in a job's `name:`, so every name is literal.
# test/ci/workflows asserts the types below and the literal gate name.
on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
    # v1.25.4: no `labeled`. Gitea 1.27.1 sends every
    # label add AND remove as `label_updated`, and its matcher maps that to
    # `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`.
    types: [opened, synchronize, reopened]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:

# v1.26.2: on main the group is the workflow, the event and the commit sha,
# so each main run is its own group and a merge never cancels the main run in
# progress; a schedule or workflow_dispatch run is in its own event's group
# and never shares one with a push run (superseding v1.25's `main-{event}`
# group). Every other ref is one group, so a PR's newer run cancels the
# older. No expression reaches cancel-in-progress: Gitea 1.27.1 never
# released a main run queued behind one that set it to an expression.
# v1.29.3: a schedule run's group is `schedule-{repository}`, with no sha, so a
# repository has one schedule run at a time (none is scheduled here).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated. The
  # integration suites and their `!integration` stubs sit behind
  # `integration`; lint, gosec and the assertion below read it, never the
  # unit run (the Makefile's GO_BUILD_TAGS block says why).
  GO_BUILD_TAGS: "integration"
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, workflow_dispatch), and a PR labelled ci:full.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  # v1.30 (fix 5): a workflow_dispatch off main is not the full tier (the
  # schedule guard refuses it and CI Gate fails).
  CI_FULL_TIER: ${{ (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')) || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24: the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.30 (fix 3): a PR runs the lint-gates job only when a changed file
  # matches this extended regex. CUSTOMIZE: this repository defines no
  # lint-gates target, so the default, every file, stands.
  LINT_GATES_PATTERN: '.'
  # v1.26.1: the template's RELEASABILITY_TEST variable and its docs-only step
  # are not used here. CUSTOMIZE: this repository's releasability check is the
  # gate `make releasability`, not a `go test`, and the lint job's
  # "Public-releasability gate" step below runs it on every pull request,
  # docs-only ones included (it has no docs_only condition), so a private value
  # in README.md or docs/ fails the PR.

  # ANALYSIS TOOL PINS (#21, #44). CUSTOMIZE: the image builds golangci-lint,
  # gosec and govulncheck from build/docker/devcontainer/tool-pins.env; the
  # image job asserts the binaries in it against these, so a skew between the
  # two fails the job rather than scanning with something else. Bumping one is
  # a DELIBERATE change, and the pin file is bumped in the same breath.
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  # ---- PR tier ----
  #
  # v1.34: one preflight job, in place of the changes, schedule-guard and
  # arch-gates jobs, in this order: the schedule guard, before anything is
  # checked out, so AGENT_TOKEN (a schedule run and a push to main only)
  # reaches a step beside no repository code; one checkout with
  # persist-credentials false; the changed-files step; the architecture gate.
  # v1.24: is every file this PR changes markdown or under docs/? Off a PR,
  # and on a PR in the full tier, the answer is no without a diff. Any doubt
  # (a failed diff, an empty list) reads as false. v1.30: lint_gates is false
  # only on a PR whose changed files all miss LINT_GATES_PATTERN.
  # v1.29.3 and v1.30: the guard sets `verdict`. `refused`: a
  # workflow_dispatch off main, or a pull request from a checkpoint branch
  # (lane-ckpt/*); every job but CI Gate skips and CI Gate fails. Off
  # github.com, on a schedule run, `busy` while a main push run is in flight
  # and `unreadable` when the API gives no count; on a push to main, `proven`
  # when a green full-tier run already proved this tree. On github.com, where
  # this repository runs, the guard makes no API call, so only `run` and
  # `refused` occur here. Every other job runs only on `run`.
  # Architecture gate (v1.20): go-objstore owns every blob backend, and a repo
  # reaches it only through the packages that are its storage seam; this
  # library has none, so no package may import it. Test files are exempt. A
  # source check with grep on the runner's shell, on the PR tier.
  preflight:
    name: Preflight [changed files, schedule guard, architecture gates]
    runs-on: ubuntu-latest
    # v1.26: a draft PR runs no CI; every job that needs this one skips with it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10       # v1.34: the three jobs had 5 each
    permissions:
      actions: read
      contents: read
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE: this library has no storage seam, so no package may import go-objstore
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      lint_gates: ${{ steps.diff.outputs.lint_gates }}   # v1.30
      verdict: ${{ steps.guard.outputs.verdict }}
      proof: ${{ steps.guard.outputs.proof }}   # v1.30
    steps:
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          # v1.30: a push to main reads the tree proof with it as well.
          BOT: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          runs() {
            local st n
            N=0
            # v1.29.4: waiting is read before in_progress. A run only moves
            # waiting, then in_progress, then done, so one waiting at the
            # first query is still waiting, in progress or done at the
            # second, and counted or finished. The other order lets a run
            # start between the two queries and be counted by neither.
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          # get <token> <url> <file>: 0 on a 200 reply, saved in <file>.
          get() {
            [ "$(curl -sS --max-time 30 -o "$3" -w '%{http_code}' \
              -H @<(printf 'Authorization: token %s\n' "$1") "$2")" = 200 ]
          }
          # v1.30: proof <token>: sets PROOF to the id of the newest of this
          # workflow's last 20 successful runs whose head commit has this
          # commit's tree and whose Integration jobs all succeeded (at least
          # one). It returns 1 when a reply is not 200, and 0 with PROOF
          # empty when no run proves the tree.
          proof() {
            local tree id sha t
            PROOF=
            get "$1" "$REPO_API/git/commits/$SHA" "$RUNNER_TEMP/c.json" || return 1
            tree=$(jq -er '.commit.tree.sha' "$RUNNER_TEMP/c.json") || return 1
            get "$1" "$RUNS_API?status=success&limit=20" "$RUNNER_TEMP/ok.json" || return 1
            while read -r id sha; do
              get "$1" "$REPO_API/git/commits/$sha" "$RUNNER_TEMP/c.json" || continue
              t=$(jq -r '.commit.tree.sha' "$RUNNER_TEMP/c.json")
              [ "$t" = "$tree" ] || continue
              get "$1" "$REPO_API/actions/runs/$id/jobs?limit=100" "$RUNNER_TEMP/j.json" || continue
              if jq -e '[.jobs[] | select(.name | startswith("Integration"))] | length > 0 and all(.conclusion == "success")' \
                   "$RUNNER_TEMP/j.json" >/dev/null; then
                PROOF=$id
                echo "tree $tree: run $id (head $sha) has a green full tier"
                return 0
              fi
            done < <(jq -r '.workflow_runs[]? | "\(.id) \(.head_sha)"' "$RUNNER_TEMP/ok.json")
            echo "tree $tree: no green full-tier run among the last 20 successful runs"
          }
          verdict=run N=0 PROOF=
          # v1.30 (fixes 3 and 5): the refusals come first.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            verdict=refused
            echo "::error::workflow_dispatch on $REF: the full tier runs on main only, never on a PR branch (ci-template v1.30); every job skips and CI Gate fails"
          elif [ "$EVENT" = pull_request ] && [ "${HEAD_REF#lane-ckpt/}" != "$HEAD_REF" ]; then
            verdict=refused
            echo "::error::a pull request from checkpoint branch $HEAD_REF: a checkpoint branch never opens a PR (ci-template v1.30); every job skips and CI Gate fails"
          fi
          if [ "$verdict" != run ]; then
            :
          elif [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "on github.com the guard makes no API call: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every guarded job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its guarded jobs, and CI Gate posts skipped"
          fi
          # v1.30 (fix 2): the tree proof, on a push to main on the forge only.
          if [ "$verdict" = run ] && [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$SERVER" != https://github.com ]; then
            if { [ -n "$JOB_TOKEN" ] && proof "$JOB_TOKEN"; } || { [ -n "$BOT" ] && proof "$BOT"; }; then
              if [ -n "$PROOF" ]; then
                verdict=proven
                echo "::notice::this tree already has a green full tier in run $PROOF: the guarded jobs skip, and CI Gate passes on it"
              fi
            else
              echo "::warning::the tree proof could not be read: the full tier runs"
            fi
          fi
          echo "verdict: $verdict${PROOF:+ (proof: run $PROOF)}"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"

      # v1.34: the full history on a PR run for the changed-files diff, one
      # commit otherwise. No credential is left in the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' && env.CI_FULL_TIER != 'true') && '0' || '1' }}
          persist-credentials: false

      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # v1.30: lint_gates is false only on a PR whose changed files all
          # miss LINT_GATES_PATTERN; any doubt runs the job.
          docs_only=false lint_gates=true
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files" | grep -qE "$LINT_GATES_PATTERN" || lint_gates=false
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only; lint-gates: $lint_gates"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "lint_gates=$lint_gates" >> "$GITHUB_OUTPUT"

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # v1.30 (fix 1, parallel jobs; fix 5, gosec on the PR tier): the
  # lint-class stages, moved from the image job, in a job of their own that
  # needs the toolchain image alone, so they run beside build and test and not
  # in series before them. The PR tier runs `make gosec` here; the full tier
  # runs gosec in the image job's `make security`, so it runs once per event.
  # It runs on a docs-only PR, with the releasability gates, as the image job
  # did; the build-tag assertion and gosec skip there.
  lint:
    name: Lint [lint, gosec, deps-check, build tags, releasability]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: preflight   # v1.34
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 60       # CUSTOMIZE: a cold toolchain image build on a hosted runner, then the lint-class stages
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step. The runner
      # injects them as plain environment (dependency-resolution.md §6), which
      # the log does not mask by itself, and the token sits inside
      # GIT_CONFIG_KEY_0's URL, so it is masked alone as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # v1.30: the toolchain image alone (`make docker-build-toolchain`),
      # which skips when the daemon holds its tag. v1.29.4, v1.29.5 and
      # v1.34.1: the module fetches go through DEVCACHE_GOPROXY first when the
      # runner sets it and the cache answers, then the public proxy, with no
      # `direct` entry.
      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-trim-caches

      # CUSTOMIZE: the analysers must SAY they are the pinned versions (#21):
      # gosec takes its version from ldflags, so a pinned install alone still
      # self-reports `dev`, and a scan by an unknown version is no gate.
      - name: Require the analysis tools at their pins (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="go run ./test/tools/require-tool golangci-lint $GOLANGCI_LINT_VERSION github.com/golangci/golangci-lint/v2/cmd/golangci-lint && go run ./test/tools/require-tool gosec $GOSEC_VERSION github.com/securego/gosec/v2/cmd/gosec && go run ./test/tools/require-tool govulncheck $GOVULNCHECK_VERSION golang.org/x/vuln/cmd/govulncheck"

      # make lint: gofmt, golangci-lint and actionlint, each required, golangci-
      # lint printing path and line only. .golangci.yml enables staticcheck,
      # errcheck, unused, ineffassign, misspell and gocritic. v1.27: a repo's
      # `make lint-gates` runs in the lint-gates job beside this one, never
      # here and never as a prerequisite of lint.
      - name: make lint (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.32 (2026-11-08, Company Agent m2098 item 2, InfoSec finding): the
      # internal-name gate. Its patterns are internal values, so they never
      # live in this repository: the Actions secret RELEASABILITY_PATTERNS
      # carries the private pattern file, whose source is kept outside this
      # repository. Blank
      # and `#` lines are skipped; every other line is `class<TAB>regex`, a
      # class of coord-host, internal-email, lab-address, lab-host or
      # owner-path (v1.33; an `/i` suffix is allowed) and a POSIX extended regex. A malformed line, an unknown
      # class or a regex grep -E refuses fails the step, which prints the line
      # number only. v1.31 grepped whole lines with -F, so no line matched and
      # the gate was green for a false reason. The step prints path and line
      # of a match, never the value. A run without the secret (a fork PR)
      # skips with a notice; a push to main without it fails. v1.33.2: a
      # matched line that carries the InfoSec waiver, `lab-string-ok: <reason>`
      # (colon and reason required, public-hygiene.md), is listed as waived,
      # path and line only, and does not fail; a bare marker still fails.
      - name: Releasability (private patterns)
        if: ${{ !cancelled() }}
        env:
          RELEASABILITY_PATTERNS: ${{ secrets.RELEASABILITY_PATTERNS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RELEASABILITY_PATTERNS" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::RELEASABILITY_PATTERNS is not set; the gate needs the private pattern file (public-hygiene.md)"
              exit 1
            fi
            echo "::notice::RELEASABILITY_PATTERNS is not available to this run; pushes to main run the gate"
            exit 0
          fi
          pf=$(mktemp)
          chmod 600 "$pf"
          trap 'rm -f "$pf"' EXIT
          tab=$(printf '\t')
          n=0 bad=0 count=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            trimmed=${line#"${line%%[![:space:]]*}"}
            case $trimmed in ''|'#'*) continue ;; esac
            case $line in
              *"$tab"*) ;;
              *) echo "::error::pattern line $n is not class<TAB>regex"; bad=1; continue ;;
            esac
            class=${line%%"$tab"*}
            re=${line#*"$tab"}
            case $class in
              coord-host|internal-email|lab-address|lab-host|owner-path) ;;
              coord-host/i|internal-email/i|lab-address/i|lab-host/i|owner-path/i) ;;
              *) echo "::error::pattern line $n has an unknown class"; bad=1; continue ;;
            esac
            if [ -z "$re" ]; then
              echo "::error::pattern line $n has an empty regex"; bad=1; continue
            fi
            rc=0
            grep -E -e "$re" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::pattern line $n has a regex grep -E refuses"; bad=1; continue
            fi
            printf '%s\n' "$re" >> "$pf"
            count=$((count + 1))
          done <<< "$RELEASABILITY_PATTERNS"
          if [ "$bad" != 0 ]; then
            echo "::error::the private pattern file is malformed (line numbers above; the values are not shown)"
            exit 1
          fi
          if [ "$count" = 0 ]; then
            echo "::error::RELEASABILITY_PATTERNS holds no class<TAB>regex line"
            exit 1
          fi
          rc=0
          out=$(git grep -n -I -i -E -f "$pf" -- .) || rc=$?
          case $rc in
            0|1) ;;
            *)
              echo "::error::git grep failed (rc $rc)"
              exit 1 ;;
          esac
          waiver='lab-string-ok:[[:space:]]*[[:alnum:]]'
          waived=$(printf '%s\n' "$out" | grep -E -e "$waiver" | cut -d: -f1,2 || true)
          hits=$(printf '%s\n' "$out" | grep -v -E -e "$waiver" | grep -v '^$' | cut -d: -f1,2 || true)
          unset out
          nw=0
          if [ -n "$waived" ]; then
            nw=$(printf '%s\n' "$waived" | wc -l)
            echo "::notice::$nw matched lines carry the lab-string-ok waiver (path:line; the values are not shown):"
            printf '%s\n' "$waived"
          fi
          if [ -n "$hits" ]; then
            echo "::error::internal names in the tracked tree (path:line; the values are not shown):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "releasability: $count private patterns, 0 matches, $nw waived"

      # Over this checkout's git index: a fleet address, hostname or owner
      # path in any tracked file, or a tracked file the public release must
      # not carry, fails the job.
      - name: Public-releasability gate (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="make releasability"

      # v1.9.2: the declared tag set must select code. Each tag is checked by
      # removal: if dropping it changes no selected file (tests included), it
      # is misspelled or dead.
      - name: Assert every build tag selects code (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make assert-build-tags GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.30 (fix 5): gosec on the PR tier, through the developers' target,
      # with no network and the tool required. On the full tier make security
      # runs it in the image job.
      - name: make gosec (PR tier, toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER != 'true' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make gosec TOOLS_REQUIRED=1 GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.28: a lint-class gate of seconds on the PR tier, every event, a
      # docs-only PR included (ruling 219(3)); it was full tier only from v1.23.
      - name: make deps-check (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="make deps-check"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # The image job builds both devcontainer images once (`make docker-build`)
  # and runs each stage as its own step (v1.30: the lint-class stages are the
  # lint job's); `if: !cancelled()` runs every stage
  # after a failed one, so one run reports them all. make security and make
  # deps-check (and trivy) get a network, for the vulnerability databases and
  # the module proxy; everything else runs without one.
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (ci-toolchain-run, ci-standard.md §6), so a stage writes its caches there
  # and not into its container's layer.
  #
  # v1.23: build and the unit runs are the PR tier and run on every event. security and trivy image are full tier only
  # (env.CI_FULL_TIER): main after every merge, dispatch, ci:full.
  # v1.28: deps-check is a lint-class gate on the PR tier (ruling 219(3)); v1.30
  # moves it to the lint job.
  # v1.24, v1.30: on a docs-only PR the job skips.
  #
  # v1.29 (Company Agent ruling 220(5)): the job reads the Alpine package
  # indexes the build resolves against (`make -s apk-index-sum`, the template's
  # scripts/apk-index-sum.sh as a Makefile recipe) into APK_INDEX_SUM, which
  # the integration image's tag hashes and its build takes as a build argument
  # (ci-standard.md §9, devcontainer.md §6). A new Alpine package release, a
  # CVE fix among them, changes the tag, so the next run rebuilds the image
  # rather than reuse a cached one with the old package (CVE-2026-92392).
  image:
    name: Devcontainer image [build, test, security, trivy image]
    # The bigdisk-docker pool (ruling 442) or ubuntu-latest, with "Free
    # runner disk" before the build on the latter: the hosted runner's stock
    # free disk does not hold both devcontainer images.
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: preflight           # v1.24; v1.34
    # v1.30: only on the guard's `run` (not `refused`), and never on a
    # docs-only PR (`code` in CI Gate).
    if: ${{ needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.docs_only != 'true' }}
    timeout-minutes: 120
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: a scheduled run (none is
      # scheduled here) is on main, so it would write main's set too.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step. The runner
      # injects them as plain environment (dependency-resolution.md §6), which
      # the log does not mask by itself, and the token sits inside
      # GIT_CONFIG_KEY_0's URL, so it is masked alone as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # v1.23: the integration image is named by its content,
      # go-luks2-ci-it:<hash> (`make -s it-image`, ci-standard.md §9), so every
      # job of every run on this runner names the same image for the same
      # tree, builds it once and reuses it. No job removes it; the reap step does.
      # v1.29 (ruling 220(5)): the Alpine package index checksum joins the
      # integration image's tag hash (`make -s apk-index-sum`). A base image
      # the recipe cannot read fails the step.
      - name: Read the Alpine package index
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Build the devcontainer images
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1 (2026-10-20, from a Codex review): the lease is bounded and
      # never skipped. v1.23 leased only an image it found, so an
      # image reaped before the lease (or a failed `docker create`) left the
      # job running unleased and green. Now the step inspects the image, leases
      # it by id (--pull never), and inspects the tag again for the same id. If
      # the image is gone at either inspect it builds it once with
      # `make docker-build`, leases and inspects again, and fails the step if
      # it is still missing. A missing image is never a success.
      # v1.25.2 (2026-10-21, from a Codex review): the lease holds the image
      # id, not the tag. Two trees that differ only in a file the build ignores
      # share one image id under two tags, and `docker image rm <tag>` untags
      # such an image even while a container uses it. The step exports the
      # leased id as IT_LEASE_ID, and every later step that names IT_IMAGE
      # (docker save, make integration-test, each soak iteration) first runs
      # `docker tag "$IT_LEASE_ID" "$IT_IMAGE"`, which puts back a tag a
      # reaper removed before the lease. docker save keeps the tag, so the
      # archive keeps its repo tag. reap-stale-ci-stacks.sh v4 also keeps
      # every tag of an id a container uses.
      # v1.25.3 (2026-10-21, from a Codex review): the inspect, lease and
      # second inspect run under the daemon's image lock, a created container
      # named <prefix>image-lock (reap-stale-ci-stacks.sh v5 takes it around
      # its check and removal), so no reaper removes the tag between them. The
      # rebuild runs without it. The step writes image_lock and image_unlock
      # to $RUNNER_TEMP/image-lock.sh, and each re-tag takes the lock too. A
      # lock created more than 600 s ago is removed by its id; a step waits
      # 660 s for the lock and then fails.
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            rc=0
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job. CUSTOMIZE:
      # the template's trim-ci-caches.sh, as a recipe.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-trim-caches

      - name: make build (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make build"

      # The linux/amd64 and linux/arm64 CLI, -trimpath, as the binaries
      # artifact; and the 32-bit compile-only leg (the reasoning is at
      # vet-32bit in the Makefile).
      - name: Linux binaries and 32-bit vet (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make build-linux vet-32bit" CI_OUT="luks-linux-amd64 luks-linux-arm64"

      # upload-artifact v4+ refuses any server that is not github.com. The
      # build above has already gated; only the artifact is skipped.
      - name: Upload binaries
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries
          path: luks-linux-*

      - name: make test (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test"

      # CUSTOMIZE, in place of the template's `make coverage`: the unit legs
      # run uninstrumented here and their per-package gate reads
      # coverage-floors.txt, because the raced run, with its pkg/luks2 budget,
      # is the Race job. The legs and the gate share ONE container:
      # the gate reads the profiles the legs write.
      - name: Unit legs and coverage gate, no -race (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test-unit-norace UNIT_TEST_FLAGS=-v && make coverage-gate" CI_OUT=coverage.out

      # RLIMIT_MEMLOCK turns a correct design into a red suite below 512 KiB.
      # Read in the image, under the limits ci-toolchain-run sets.
      - name: Record the resource limits these tests ran under (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="echo 'RLIMIT_MEMLOCK (KiB), nproc, /tmp:' && ulimit -l && nproc && df -h /tmp"

      - name: Upload coverage
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: coverage.out

      # WITHOUT -race, deliberately, and with the calibration BENCHMARKS: the
      # PBKDF2 calibration defect (#52) is invisible under -race.
      - name: PBKDF2 calibration tests, no -race (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test-calibration"

      # The pkg/luks2 API must honor every disposition in
      # test/tools/apidump/baseline/disposition-luks2.tsv exactly.
      - name: API-diff gate (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make api-diff"

      # gosec, govulncheck, go mod verify and trivy's filesystem scan; the target owns gosec's
      # flags and its worker bound. Nothing is uploaded to code scanning.
      - name: make security (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="make security GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # Fails on CRITICAL and HIGH findings that have a fix: --ignore-unfixed
      # (v1.19) and --skip-dirs /opt/go/mod (v1.20). trivy's filesystem scan and make
      # security never take --ignore-unfixed.
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          docker save -o it-image.tar "$IT_IMAGE"
          make ci-toolchain-run \
            CMD="trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # v1.27: a repository's `make lint-gates` (its own gates beside `make lint`:
  # script, workflow, generated-code and module checks) runs in this job, in
  # parallel with the image job's `make lint`, not in series after it, so
  # Lint's wall time is the longer of the two and not their sum. It runs only
  # when the Makefile (or a tracked *.mk) defines a lint-gates target; a
  # repository without one gets an OK and a green job, with no image built.
  # `make lint` and `go vet` stay where they are. A repository whose `make
  # lint` lists lint-gates as a prerequisite removes it from lint in the PR
  # that adopts v1.27, or the gates run twice. The toolchain image comes from
  # `make docker-build`, as in the image job, which builds only a tag the
  # daemon does not already hold (devcontainer.md §6). A lint-class check, so
  # it is on the PR tier and runs on a docs-only PR. CUSTOMIZE: this
  # repository defines no lint-gates target, so the job prints OK and passes;
  # the stage recipes are Makefile targets (ci-reap-stacks, ci-trim-caches,
  # ci-toolchain-run), as in the image job.
  # v1.29.1 (ruling 226(15), 108 repair): the step fails fast. `make
  # lint-gates` runs without `-k`, so the first failing gate ends the step
  # and the job; the gates after it run on the next push.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: preflight     # v1.34
    # v1.26: never on a draft. v1.30: only on the guard's `run`, and on a PR
    # only when a changed file matches LINT_GATES_PATTERN (fix 3).
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' && needs.preflight.outputs.lint_gates != 'false' }}
    timeout-minutes: 45       # CUSTOMIZE: the repo's lint-gates time, with honest headroom
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # v1.22: the cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # v1.21.1: mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A source check on the runner's shell: no make recipe runs here.
      - name: Does the Makefile define lint-gates?
        id: probe
        run: |
          mapfile -t mk < <(git ls-files -- Makefile '*.mk')
          if [ "${#mk[@]}" -gt 0 ] && grep -qE '^lint-gates[[:space:]]*:([^=]|$)' "${mk[@]}"; then
            echo "lint-gates target found"
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          else
            echo "OK: no lint-gates target in the Makefile; nothing to run"
            echo "has_target=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reap stale CI stacks
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: ${{ steps.probe.outputs.has_target == 'true' && github.server_url == 'https://github.com' && runner.environment == 'github-hosted' }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # make docker-build needs the integration image's name (as in the image
      # job); this job never runs or leases that image.
      # v1.29: the Alpine package index checksum, which that name hashes (as in
      # the image job).
      - name: Read the Alpine package index
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Build the devcontainer images
        if: ${{ steps.probe.outputs.has_target == 'true' }}
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.22: bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-trim-caches

      # v1.29.1: no -k; the first failing gate ends the step (ruling 226(15)).
      - name: make lint-gates
        if: ${{ !cancelled() && steps.probe.outputs.has_target == 'true' && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # CUSTOMIZE: bridge when a gate needs the module proxy or a network
        run: make ci-toolchain-run CMD="make lint-gates GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # THE MERGE RESULT, which nothing else in this pipeline looks at. CUSTOMIZE:
  # a job of the integration job's shape. Every other check reads the BRANCH
  # HEAD, Gitea publishes no /merge ref, and `git merge-tree` answers "do
  # these conflict?", never "is the result correct?" -- so branch green, main
  # green and the merge of the two red was invisible (measured twice on
  # 2026-09-13). `go vet ./...` compiles the test files, where both breakages
  # were. The tree is constructed on the runner with git and run in the
  # toolchain image; the network is for a merged go.mod that names modules
  # the image's cache lacks.
  merge-check:
    name: Merged Tree
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: preflight   # v1.34
    # v1.26: never on a draft. v1.30: only on the guard's `run`.
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 60
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      # Full history: merge-tree needs the base branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # Runs on push too, reporting success, rather than carrying an `if:` that
      # skips it: the gate counts a SKIPPED pr job as a failure on purpose.
      - name: Construct the merge
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: the merge result IS this commit, already checked by the other jobs"
            exit 0
          fi
          base="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --quiet origin "$base"
          # A conflict is an earlier and different answer from a broken merge.
          if ! tree=$(git merge-tree --write-tree "origin/$base" HEAD 2>/dev/null); then
            echo "::error::This branch conflicts with $base. Rebase it; the merge result cannot be evaluated until it applies."
            exit 1
          fi
          mkdir .merged
          git archive "$tree" | tar -x -C .merged
          # `go vet` over no packages exits 0, so an empty tree must not pass.
          if [ ! -f .merged/go.mod ]; then
            echo "::error::The extracted merge tree has no go.mod, so nothing was checked."
            exit 1
          fi
          echo "MERGED_TREE=.merged" >> "$GITHUB_ENV"

      - name: Build the toolchain image
        if: env.MERGED_TREE != ''
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: Compile the merged tree (toolchain image)
        if: env.MERGED_TREE != ''
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="cd .merged && go build ./... && go vet ./... && go vet -tags=integration ./... && echo 'the merge of this branch with its base compiles'"

      - name: Tear down
        if: always()
        run: rm -rf "$RUNNER_TEMP/gomodauth.env" .merged

  # v1.29.2 (ruling 239(8)): a CUSTOMIZE job that runs only when certain
  # paths change (the preflight job gains an output for them, `optee` here)
  # needs the image job as well, and its `if:` tests an image job output
  # that its build step sets (here `built`, which the image job declares in
  # `outputs:` when a repository adds such a job), never `needs.<job>.result`
  # and never the preflight job's outputs alone. Reading
  # `needs.preflight.outputs.*` in the same `if:` is fine:
  #   needs: [preflight, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) }}

  # ---- Full tier ----
  #
  # Every full-tier job's `if:` is CI_FULL_TIER's expression, and CI Gate
  # reads env.CI_FULL_TIER; the table at the top of this file reads it out.

  # CUSTOMIZE (ci-template v1.18): the suite runs in the devcontainer
  # `integration` image built at this commit, as the compose service in
  # build/docker/devcontainer/compose.yaml. That service carries
  # test/tools/docker-run's privilege set and no more -- a test pins the two
  # equal -- because the suite drives host device-mapper and loop devices. The
  # compose project is go-luks2-ci-<run>-<attempt>, the reaper runs first, and
  # the teardown runs last under if: always(). Every project and container
  # name is unique to the job attempt; the integration image is the run's
  # content-addressed one, leased and never removed here. The ledger directory
  # (TEST_STATE_DIR) is bind-mounted from the runner host and deliberately
  # persists between jobs.
  integration:
    name: Integration [integration image]
    # v1.26: never on a draft PR, ci:full or not. v1.30: only on the guard's
    # `run` (a dispatch off main is refused).
    needs: preflight   # v1.34
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ITEST_CONTAINER: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}-itest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1: bounded, building the image once if it is missing (as in the
      # image job); a missing image fails the step.
      # v1.25.2: exports the leased id as IT_LEASE_ID, which the suite's step
      # tags as IT_IMAGE before it runs (as in the image job).
      # v1.25.3: the lease and the re-tag run under the image lock (as in the
      # image job).
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            rc=0
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # The container's default command is `make coverage-combined`, so its
      # exit status carries the combined coverage gate; the target copies the
      # profile out and fails a container that passed without leaving one.
      - name: make integration-test (integration image)
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          image_lock || exit 1
          docker tag "$IT_LEASE_ID" "$IT_IMAGE"
          image_unlock
          make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS"

      # compose interpolates the whole file even to take it down, and its
      # required values are set only inside the make recipe; placeholders
      # satisfy them here. `down` removes by project name.
      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          docker rm -f "$ITEST_CONTAINER" >/dev/null 2>&1 || true
          GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
            docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

      - name: Upload integration coverage
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          if-no-files-found: error

  # Soak (v1.23): the integration suite looped in the integration image until
  # SOAK_MINUTES have passed, each iteration its own compose stack, torn down
  # before the next; the first red iteration fails the job. v1.24:
  # workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`.
  # CUSTOMIZE: each iteration's container is named under the project, as in
  # the integration job, and removed with it.
  soak:
    name: Soak [integration image]
    # v1.30: a dispatch off main is refused, so soak runs only on `run`.
    needs: preflight   # v1.34
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.preflight.outputs.verdict == 'run' }}
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      IT_PROJECT: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      # v1.29: the Alpine package index checksum (as in the image job).
      - name: Read the Alpine package index
        run: |
          sum=$(make -s apk-index-sum)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (from a Codex review). A
      # reused image can be older than REAP_IMAGE_MIN_AGE, so its age alone
      # does not keep another run's reap step off it while this job needs it.
      # A created, never-started container that names the image holds it,
      # because `docker image rm` refuses an image a container uses. Tear down
      # removes the lease; one a dead job leaves behind is a stale container,
      # which the reap step removes after the job timeout like any other.
      # v1.25.1: bounded, building the image once if it is missing (as in the
      # image job); a missing image fails the step.
      # v1.25.2: exports the leased id as IT_LEASE_ID, which the suite's step
      # tags as IT_IMAGE before it runs (as in the image job).
      # v1.25.3: the lease and the re-tag run under the image lock (as in the
      # image job).
      - name: Lease the integration image
        run: |
          lease="${CI_STACK_PREFIX}lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
          # v1.25.3: the daemon's image lock, shared with the reaper (v5) and
          # every re-tag. The next steps source these from image-lock.sh.
          image_lock() {
            local lock="${CI_STACK_PREFIX}image-lock" held at t i
            for ((i = 0; i < 660; i++)); do
              docker image inspect "$lock:base" >/dev/null 2>&1 ||
                head -c 1024 /dev/zero | docker import - "$lock:base" >/dev/null 2>&1 || true
              IMAGE_LOCK_ID=$(docker create --pull never --name "$lock" "$lock:base" true 2>/dev/null) && return 0
              IMAGE_LOCK_ID=
              if read -r held at < <(docker inspect -f '{{.Id}} {{.Created}}' "$lock" 2>/dev/null) &&
                t=$(date -d "$at" +%s 2>/dev/null) && [ $(($(date +%s) - t)) -ge 600 ]; then
                echo "removing the stale image lock $lock (created $at)"
                docker rm "$held" >/dev/null 2>&1 || true
                continue
              fi
              sleep 1
            done
            echo "::error::the image lock $lock was not free within 660 s"
            return 1
          }
          image_unlock() {
            [ -z "${IMAGE_LOCK_ID:-}" ] || docker rm "$IMAGE_LOCK_ID" >/dev/null 2>&1 || true
            IMAGE_LOCK_ID=
          }
          declare -f image_lock image_unlock > "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          take_lease() {
            id=$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null) || return 1
            docker create --pull never --name "$lease" "$id" true >/dev/null || return 1
            [ "$(docker image inspect -f '{{.Id}}' "$IT_IMAGE" 2>/dev/null)" = "$id" ] && return 0
            docker rm "$lease" >/dev/null 2>&1 || true
            return 1
          }
          image_lock || exit 1
          if ! take_lease; then
            image_unlock
            echo "integration image $IT_IMAGE is missing or went before its lease; building it once"
            ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
              for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
                if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
              done )
            rc=0
            bp=
            if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
              bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
            fi
            make docker-build ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE" || rc=$?
            rm -f "$RUNNER_TEMP/gomodauth.env"
            if [ "$rc" -ne 0 ]; then
              echo "::error::building the integration image $IT_IMAGE failed (exit $rc)"
              exit "$rc"
            fi
            image_lock || exit 1
            if ! take_lease; then
              echo "::error::the integration image $IT_IMAGE is missing after one rebuild, so this job holds no lease on it"
              exit 1
            fi
          fi
          image_unlock
          echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          echo "IT_LEASE_ID=$id" >> "$GITHUB_ENV"

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # compose interpolates the whole file even to take it down; the
      # placeholders are the integration job's.
      - name: Soak (integration suite, looped)
        run: |
          . "$RUNNER_TEMP/image-lock.sh"
          trap image_unlock EXIT
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            image_lock || exit 1
            docker tag "$IT_LEASE_ID" "$IT_IMAGE"
            image_unlock
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$p" ITEST_CONTAINER="$p-itest" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            docker rm -f "$p-itest" >/dev/null 2>&1 || true
            GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
              docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            p=$(cat "$RUNNER_TEMP/soak-project")
            docker rm -f "$p-itest" >/dev/null 2>&1 || true
            GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
              docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # ---- PR tier, continued ----
  #
  # CUSTOMIZE: THE RACE LEGS, a job of the integration job's shape in
  # the toolchain image, through the Makefile so that this job and a
  # developer's `make test-unit` run the same commands under the same two
  # numbers (#92): UNIT_TEST_TIMEOUT, the ceiling that fails the run, and
  # UNIT_TEST_TARGET, the budget for ./pkg/luks2 under -race. What is raced is
  # the DEFAULT tag set; coverage is GATED on the image job's uninstrumented
  # run. v1.23: a repo's race job is the PR tier (`pr` in CI Gate, no tier
  # `if:`); v1.24: on a docs-only PR its steps skip, as the image job's unit
  # runs do.
  test-race:
    name: Race
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    needs: preflight   # v1.34
    # v1.26: never on a draft. v1.30: only on the guard's `run`.
    if: ${{ !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 60
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
      # CUSTOMIZE (v1.29.4's memory bound): the -race run of pkg/luks2 holds
      # several Argon2id derivations at once, each up to its memory cost and
      # multiplied by the race detector's shadow memory, and was OOM-killed
      # under the 8g default. 14g fits a 16 GB hosted runner and a pool guest.
      IN_IMAGE_MEMORY: 14g
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build the toolchain image
        if: needs.preflight.outputs.docs_only != 'true'
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: Unit tests, -race (toolchain image)
        if: needs.preflight.outputs.docs_only != 'true'
        run: make ci-toolchain-run CMD="make test-unit UNIT_TEST_FLAGS=-v"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # CUSTOMIZE: THE FIPS 140-3 GATE, a job of the integration job's shape in
  # the toolchain image; `make test-fips-mode` holds its mode, packages and
  # timeouts. STRICT mode, not `on` (ratified 2026-08-17): `fips140=on` still
  # PERMITS non-approved algorithms, so a path using SHA-1 would report green.
  # If this job fails, that failure IS the finding. Do not weaken it back to
  # `on` to make it pass -- fix the call site, or document a deliberate
  # exemption with the owner's approval.
  #
  # The FIPS import proof (#84, owner ruling 2026-09-25) runs first and
  # verbosely: a cryptsetup Argon2id volume is migrated with MigrateToFIPS in
  # a child run with GODEBUG=fips140=off and opened by a child with
  # fips140=only; the test fails if either child did not run in its mode.
  fips:
    name: FIPS
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","x64","bigdisk-docker"]') || 'ubuntu-latest' }}
    # v1.26: never on a draft PR, ci:full or not. v1.30: only on the guard's `run`.
    needs: preflight   # v1.34
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft && needs.preflight.outputs.verdict == 'run' }}
    timeout-minutes: 30
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Company Agent m2077: a GitHub-hosted runner starts with about 14 GB
      # free, which the devcontainer images this job builds outgrow. On
      # github.com only, remove the preinstalled SDKs and images this
      # pipeline never uses before the build. A runner elsewhere keeps its
      # disk as it is.
      - name: Free runner disk
        if: github.server_url == 'https://github.com' && runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune --all --force >/dev/null || true
          df -h /

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          bp=
          if [ -n "${DEVCACHE_GOPROXY:-}" ] && curl -s -o /dev/null --max-time 5 "$DEVCACHE_GOPROXY/"; then
            bp="GO_BUILD_PROXY=$DEVCACHE_GOPROXY|https://proxy.golang.org"
          fi
          make docker-build-toolchain ${bp:+"$bp"} MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: FIPS build, import proof and unit tests (toolchain image)
        run: make ci-toolchain-run CMD="make test-fips-mode"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # THE ONE GATE, and the single required check. It needs EVERY job above, in
  # every tier, and reads each by name on a `check` line tagged `pr`, `code`,
  # `scoped`, `full` or `nightly`; test/ci/workflows derives the tags from the
  # jobs' `if:` and fails on a job left out or mis-tagged.
  #
  #   success                              passes
  #   skipped, the guard's `proven` tree   passes: a green full tier proved it (not nightly)
  #   skipped, `code`, docs-only PR        passes: no code changed (v1.30)
  #   skipped, `scoped`, no file matched   passes: LINT_GATES_PATTERN missed (v1.30)
  #   skipped, `full`, tier not run        passes: the full tier was not selected
  #   skipped, `nightly`, not nightly      passes: not a dispatch
  #   skipped, anything else               fails: a job that never ran proved nothing
  #   failure, cancelled, unreadable       fails
  #   the guard's `refused`                fails (v1.30)
  #
  # v1.29.3: on a schedule run the guard decides; `busy` skips the gate, so it
  # posts `skipped`, never a green nightly (no workflow here is scheduled).
  # CUSTOMIZE: FULL_TIER and NIGHTLY are validated, so an unevaluated
  # expression is not a "no", and an empty result reads `<unreadable>`. Do not
  # use join(needs.*.result); it evaluates empty on Gitea. It runs on
  # ubuntu-latest and takes no checkout: one run step.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ always() && (github.event_name != 'schedule' || needs.preflight.outputs.verdict != 'busy') }}
    timeout-minutes: 5        # v1.30
    # CUSTOMIZE: the repo's job list. Add every CUSTOMIZE job here AND as a
    # check line below; remove none of the template's jobs.
    needs: [preflight, lint, image, lint-gates, merge-check, test-race, integration, fips, soak]   # v1.34
    steps:
      - name: Fail closed on any non-success
        env:
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          # v1.26: a draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
          # v1.29.3: the schedule guard's verdict on a schedule run.
          SCHEDULE: ${{ github.event_name == 'schedule' }}
          SCHEDULE_GUARD: ${{ needs.preflight.outputs.verdict }}
          # v1.30: the proving run of a proven main push, the docs-only PR
          # flag (a `code` job skips on it) and the lint-gates path scope (a
          # `scoped` job skips when no file matched).
          PROOF: ${{ needs.preflight.outputs.proof }}
          DOCS_ONLY: ${{ needs.preflight.outputs.docs_only == 'true' }}
          LINT_GATES_SEL: ${{ needs.preflight.outputs.lint_gates != 'false' }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly: ${NIGHTLY}"
          case "${FULL_TIER}" in
            true|false) ;;
            *) echo "FAIL FULL_TIER is '${FULL_TIER}', neither true nor false"; exit 1;;
          esac
          case "${NIGHTLY}" in
            true|false) ;;
            *) echo "FAIL NIGHTLY is '${NIGHTLY}', neither true nor false"; exit 1;;
          esac
          check() { # <job> <result> <pr|code|scoped|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "${SCHEDULE_GUARD}" = proven ] && [ -n "${PROOF}" ] && [ "$3" != nightly ]; then
                  echo "SKIP $1 (tree proven by run ${PROOF})"
                elif [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only pull request)"
                elif [ "$3" = scoped ] && [ "${LINT_GATES_SEL}" != true ]; then
                  echo "SKIP $1 (no changed file matches LINT_GATES_PATTERN)"
                elif [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 (${2:-<unreadable>})"; BAD=1;;
            esac
          }
          # v1.30: a refused run (a dispatch off main, a checkpoint-branch PR)
          # fails. v1.29.3: a schedule run reaches this step on any verdict
          # but `busy`; any verdict but `run` means its jobs skipped because
          # the guard had no count: fail closed.
          if [ "${SCHEDULE_GUARD}" = refused ]; then
            echo "FAIL preflight (refused: a workflow_dispatch off main or a PR from lane-ckpt/*; see its log)"; BAD=1
          fi
          if [ "${SCHEDULE}" = true ] && [ "${SCHEDULE_GUARD}" != run ]; then
            echo "FAIL preflight (verdict '${SCHEDULE_GUARD:-none}': the guarded jobs skipped because the guard could not read the API; see its log)"; BAD=1
          fi
          check preflight   "${{ needs.preflight.result }}" pr
          check lint        "${{ needs.lint.result }}" pr
          check image       "${{ needs.image.result }}" code
          check lint-gates  "${{ needs.lint-gates.result }}" scoped
          check merge-check "${{ needs.merge-check.result }}" pr
          check test-race   "${{ needs.test-race.result }}" pr
          check integration "${{ needs.integration.result }}" full
          check fips        "${{ needs.fips.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          if [ "$BAD" -ne 0 ]; then
            echo "CI gate failed: not every job reported success."
          else
            echo "CI gate passed."
          fi
          exit $BAD

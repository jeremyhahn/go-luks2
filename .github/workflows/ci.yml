# ci-template: v1.25 (customized)

name: CI

# ONE workflow file, run by two different Actions hosts: github.com and a
# self-hosted forge. Steps that only work on github.com are guarded on
# github.server_url; everything that gates a merge runs on both, and every
# runner choice is the template's `github.server_url` expression.
#
# ci-template v1.21 (ci-standard.md §2, devcontainer.md §7): every stage runs in
# this repository's own devcontainer image and no other. No job sets up Go or
# installs a tool on the runner; the image's pin file decides every version
# and the Makefile carries every flag set. Each stage is one `make` target run
# in the toolchain image through `make ci-toolchain-run`, which copies the
# checkout into the container: a runner reaches its daemon through a socket,
# so a bind mount would resolve on the daemon's host. The canonical scripts
# are Makefile recipes here (ci-toolchain-run, ci-reap-stacks,
# ci-trim-caches, assert-build-tags) because the public release ships no
# shell scripts.
#
# ci-template v1.22 (ci-standard.md §6): the stages keep the Go build,
# golangci-lint and module caches in named volumes on the runner's Docker
# host, kept across jobs and split by trust class (CI_CACHE_CLASS: `main` for
# a push to main or the schedule, `pr` otherwise), never in a job container's writable layer
# or its /tmp. `make ci-trim-caches` bounds the repository's cache volumes on
# the host (CI_CACHE_MAX_GIB, default 32). CUSTOMIZE: the race, FIPS and
# merged-tree jobs run their stages through the same recipe, so they take the
# same CI_CACHE_CLASS.
#
# ci-template v1.22.2 (ci-standard.md §7): each stage runs at the job slot's
# CPU bound. ci-toolchain-run reads the job container's cgroup cpu.max and
# gives the stage container that --cpus, with GOMAXPROCS from it; no number is
# hardcoded here or in the Makefile.
#
# ci-template v1.23 (ci-standard.md §9): the integration image is named by its
# content, go-luks2-ci-it:<hash> (`make -s it-image`), built once per runner
# and reused by every job and run of that tree. No job removes it: each job
# holds a lease on it (a created, never started container), and
# `make ci-reap-stacks` removes an image older than REAP_IMAGE_MIN_AGE that no
# container uses.
#
# ci-template v1.25: the concurrency block is canonical. On main the group is
# the workflow and the event, so a push to main cancels the in-progress main
# push run of an older commit, and the newest run validates every merge under
# it; a schedule or workflow_dispatch run cancels only an older run of its own
# event. Every other ref is one group, so a PR's newer run cancels the older.
#
# The forge credentials are masked first in every job that has them, and
# reach an image build only as the gomodauth BuildKit secret, from a file
# outside the context that the job removes. No step prints that file, the job
# environment or a matched line; test/ci/workflows asserts it.
#
# ACROSS runs, supersession: the self-hosted host exposes no REST route to
# cancel a run, so the `concurrency` block below is what sheds a superseded
# run.
#
# THREE TIERS, ONE GATE (ci-standard.md §8, sdlc §5a).
#
#   PR tier    every event: Changed files, Devcontainer image, Merged Tree,
#              Architecture Gates and Race. The image job runs lint, the
#              build-tag assertion, build and test in the toolchain image
#              built at this commit, and with them the linux binaries, the
#              32-bit vet, the unit legs (no -race) and their coverage gate,
#              the calibration tests and the releasability and API gates.
#              Race is the -race unit run with its pkg/luks2 budget. A PR
#              whose every changed file matches DOCS_ONLY_PATTERN skips the
#              build, the tag assertion and the unit runs; lint and the gates
#              that read the docs still run.
#   Full tier  push to main, the nightly schedule, workflow_dispatch, and a
#              pull_request labelled `ci:full`: the PR tier plus Integration
#              and FIPS, each its own job in the image, and the image job's
#              security (gosec, govulncheck, go mod verify, trivy's filesystem
#              scan), deps-check and trivy image steps.
#   Nightly    the schedule and workflow_dispatch only: the full tier plus
#              Soak, the integration suite looped in the integration image
#              for SOAK_MINUTES.
#
# CI Gate, the single required check, needs EVERY job and reads each by name,
# tagged `pr`, `full` or `nightly`. A `full` job may be skipped only while the
# full tier is not selected, a `nightly` job only off the schedule and
# dispatch; any other skip, and every failure or cancellation, fails it.
#
# Exactly one CI workflow is scheduled, this one: main's full tier and Soak
# run nightly as well as after every merge. nightly.yml and batch.yml stay
# dispatch-only; nightly.yml still runs trivy's filesystem scan, uploads its
# SARIF to code scanning on github.com, and runs the advisory
# misconfiguration scan.
#
# The full tier is CI_FULL_TIER below. A job-level `if:` cannot read env, so
# every full-tier job repeats its expression, and test/ci/workflows asserts
# they stay identical:
#
#   push, schedule or workflow_dispatch        -> full tier
#   pull_request labelled ci:full              -> full tier
#
# LABEL EVENTS DO NOT RUN CI. ci.yml does not fire on `labeled`: on this host
# every label add and remove arrives as `labeled`, so each review or task
# label started a run that cancelled the PR's run in progress. A label is read
# when a run starts, so ci:full selects the full tier for any run that begins
# with the label on the PR. The gate is never skipped by an event condition: a
# job skipped by `if:` still posts a status under its name, and both hosts
# count a skipped required check as passing. Gitea does not evaluate
# expressions in a job's `name:`, so every name is literal.
# test/ci/workflows asserts the types below and the literal gate name.
on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
    # No `labeled`. Gitea 1.27.1 sends every label add AND remove as
    # `label_updated`, and its matcher maps that to `labeled` whichever label
    # moved. An action outside `types` matches nothing: no run, no status.
    # The cost: adding `ci:full` waits for the PR's next push or update-branch,
    # or a workflow_dispatch run.
    types: [opened, synchronize, reopened]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:
  # v1.23: main's full tier nightly as well as after every merge. Scheduled
  # runs are on the default branch. CUSTOMIZE: the hour, off nightly.yml's.
  schedule:
    - cron: '0 4 * * *'

# v1.25: on main the group is the workflow and the event, so a push to main
# cancels the in-progress main push run of an older commit, and a schedule or
# workflow_dispatch run cancels only an older run of its own event. Every
# other ref is one group, so a PR's newer run cancels the older. No expression
# reaches cancel-in-progress: the self-hosted host never released a main run
# queued behind one that set it to an expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event_name) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated. The
  # integration suites and their `!integration` stubs sit behind
  # `integration`; lint, gosec and the assertion below read it, never the
  # unit run (the Makefile's GO_BUILD_TAGS block says why).
  GO_BUILD_TAGS: "integration"
  # v1.23: the full tier (ci-standard.md §8). Every event but pull_request
  # (push to main, schedule, workflow_dispatch), and a PR labelled ci:full.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  CI_FULL_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24: the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'

  # ANALYSIS TOOL PINS (#21, #44). CUSTOMIZE: the image builds golangci-lint,
  # gosec and govulncheck from build/docker/devcontainer/tool-pins.env; the
  # image job asserts the binaries in it against these, so a skew between the
  # two fails the job rather than scanning with something else. Bumping one is
  # a DELIBERATE change, and the pin file is bumped in the same breath.
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.8.0"

jobs:
  # ---- PR tier ----
  #
  # v1.24: is every file this PR changes markdown or under docs/? Off a PR,
  # and on a PR in the full tier, the answer is no without a diff.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ github.event_name == 'pull_request' && env.CI_FULL_TIER != 'true' }}
        with:
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The image job builds both devcontainer images once (`make docker-build`)
  # and runs each stage as its own step; `if: !cancelled()` runs every stage
  # after a failed one, so one run reports them all. make security and make
  # deps-check (and trivy) get a network, for the vulnerability databases and
  # the module proxy; everything else runs without one.
  #
  # v1.22: every stage mounts the build and golangci-lint cache volumes, and a
  # bridge stage the module cache volume, from the runner's Docker host
  # (ci-toolchain-run, ci-standard.md §6), so a stage writes its caches there
  # and not into its container's layer.
  #
  # v1.23: lint, assert-build-tags, build and the unit runs are the PR tier and
  # run on every event. security, deps-check and trivy image are full tier only
  # (env.CI_FULL_TIER): main after every merge, nightly, dispatch, ci:full.
  # v1.24: on a docs-only PR the build, the tag assertion and the unit runs
  # skip.
  image:
    name: Devcontainer image [lint, build, test, security, deps-check, trivy image]
    # bigdisk: the runners whose disks hold the toolchain and integration
    # images this job builds.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: changes             # v1.24
    timeout-minutes: 120
    env:
      # v1.22: the cache volumes' trust class. Only a push to main writes the
      # caches main's build reads; every other event, pull requests included,
      # gets the `pr` set (ci-standard.md §6). v1.23: the nightly schedule runs
      # on main, so it writes main's set too.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # v1.21.1: mask the forge credentials before any other step. The runner
      # injects them as plain environment (dependency-resolution.md §6), which
      # the log does not mask by itself, and the token sits inside
      # GIT_CONFIG_KEY_0's URL, so it is masked alone as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # v1.23: the integration image is named by its content,
      # go-luks2-ci-it:<hash> (`make -s it-image`, ci-standard.md §9), so every
      # job of every run on this runner names the same image for the same
      # tree, builds it once and reuses it. No job removes it; the reap step does.
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      - name: Build the devcontainer images
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_IMAGE="$IT_IMAGE"
          rm -f "$RUNNER_TEMP/gomodauth.env"
          echo "TOOLCHAIN_IMAGE=$(make -s toolchain-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image. A reused image can be older
      # than REAP_IMAGE_MIN_AGE, so its age alone does not keep another run's
      # reap step off it while this job needs it. A created, never-started
      # container that names the image holds it, because `docker image rm`
      # refuses an image a container uses. Tear down removes the lease; one a
      # dead job leaves behind is a stale container, which the reap step
      # removes after the job timeout like any other.
      - name: Lease the integration image
        run: |
          if docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            lease="go-luks2-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
            docker create --name "$lease" "$IT_IMAGE" true >/dev/null && echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          fi

      # v1.22: bound this repo's cache volumes on the host before the stages
      # add to them (ci-standard.md §6). It never fails the job. CUSTOMIZE:
      # the template's trim-ci-caches.sh, as a recipe.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-trim-caches

      # CUSTOMIZE: the analysers must SAY they are the pinned versions (#21):
      # gosec takes its version from ldflags, so a pinned install alone still
      # self-reports `dev`, and a scan by an unknown version is no gate.
      - name: Require the analysis tools at their pins (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="go run ./test/tools/require-tool golangci-lint $GOLANGCI_LINT_VERSION github.com/golangci/golangci-lint/v2/cmd/golangci-lint && go run ./test/tools/require-tool gosec $GOSEC_VERSION github.com/securego/gosec/v2/cmd/gosec && go run ./test/tools/require-tool govulncheck $GOVULNCHECK_VERSION golang.org/x/vuln/cmd/govulncheck"

      # make lint: gofmt, golangci-lint and actionlint, each required, golangci-
      # lint printing path and line only. .golangci.yml enables staticcheck,
      # errcheck, unused, ineffassign, misspell and gocritic.
      - name: make lint (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="make lint GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      # v1.9.2: the declared tag set must select code. Each tag is checked by
      # removal: if dropping it changes no selected file (tests included), it
      # is misspelled or dead.
      - name: Assert every build tag selects code (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.GO_BUILD_TAGS != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make assert-build-tags GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: make build (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make build"

      # The linux/amd64 and linux/arm64 CLI, -trimpath, as the binaries
      # artifact; and the 32-bit compile-only leg (the reasoning is at
      # vet-32bit in the Makefile).
      - name: Linux binaries and 32-bit vet (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make build-linux vet-32bit" CI_OUT="luks-linux-amd64 luks-linux-arm64"

      # upload-artifact v4+ refuses any server that is not github.com. The
      # build above has already gated; only the artifact is skipped.
      - name: Upload binaries
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries
          path: luks-linux-*

      - name: make test (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test"

      # CUSTOMIZE, in place of the template's `make coverage`: the unit legs
      # run uninstrumented here and their per-package gate reads
      # coverage-floors.txt, because the raced run, with its pkg/luks2 budget,
      # is the Race job. The legs and the gate share ONE container:
      # the gate reads the profiles the legs write.
      - name: Unit legs and coverage gate, no -race (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test-unit-norace UNIT_TEST_FLAGS=-v && make coverage-gate" CI_OUT=coverage.out

      # RLIMIT_MEMLOCK turns a correct design into a red suite below 512 KiB.
      # Read in the image, under the limits ci-toolchain-run sets.
      - name: Record the resource limits these tests ran under (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="echo 'RLIMIT_MEMLOCK (KiB), nproc, /tmp:' && ulimit -l && nproc && df -h /tmp"

      - name: Upload coverage
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-unit
          path: coverage.out

      # WITHOUT -race, deliberately, and with the calibration BENCHMARKS: the
      # PBKDF2 calibration defect (#52) is invisible under -race.
      - name: PBKDF2 calibration tests, no -race (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make test-calibration"

      # Over this checkout's git index: a fleet address, hostname or owner
      # path in any tracked file, or a tracked file the public release must
      # not carry, fails the job.
      - name: Public-releasability gate (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: make ci-toolchain-run CMD="make releasability"

      # The pkg/luks2 API must honor every disposition in
      # test/tools/apidump/baseline/disposition-luks2.tsv exactly.
      - name: API-diff gate (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.changes.outputs.docs_only != 'true' }}
        run: make ci-toolchain-run CMD="make api-diff"

      # gosec, govulncheck, go mod verify and trivy's filesystem scan; the target owns gosec's
      # flags and its worker bound. Nothing is uploaded to code scanning.
      - name: make security (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="make security GO_BUILD_TAGS='$GO_BUILD_TAGS'"

      - name: make deps-check (toolchain image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="make deps-check"

      # Fails on CRITICAL and HIGH findings that have a fix: --ignore-unfixed
      # (v1.19) and --skip-dirs /opt/go/mod (v1.20). trivy's filesystem scan and make
      # security never take --ignore-unfixed.
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          make ci-toolchain-run \
            CMD="trivy image --input it-image.tar --ignore-unfixed --skip-dirs /opt/go/mod --severity CRITICAL,HIGH --exit-code 1"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # THE MERGE RESULT, which nothing else in this pipeline looks at. CUSTOMIZE:
  # a job of the integration job's shape. Every other check reads the BRANCH
  # HEAD, Gitea publishes no /merge ref, and `git merge-tree` answers "do
  # these conflict?", never "is the result correct?" -- so branch green, main
  # green and the merge of the two red was invisible (measured twice on
  # 2026-09-13). `go vet ./...` compiles the test files, where both breakages
  # were. The tree is constructed on the runner with git and run in the
  # toolchain image; the network is for a merged go.mod that names modules
  # the image's cache lacks.
  merge-check:
    name: Merged Tree
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 60
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      # Full history: merge-tree needs the base branch.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # Runs on push too, reporting success, rather than carrying an `if:` that
      # skips it: the gate counts a SKIPPED pr job as a failure on purpose.
      - name: Construct the merge
        run: |
          set -eu
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request: the merge result IS this commit, already checked by the other jobs"
            exit 0
          fi
          base="${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --quiet origin "$base"
          # A conflict is an earlier and different answer from a broken merge.
          if ! tree=$(git merge-tree --write-tree "origin/$base" HEAD 2>/dev/null); then
            echo "::error::This branch conflicts with $base. Rebase it; the merge result cannot be evaluated until it applies."
            exit 1
          fi
          mkdir .merged
          git archive "$tree" | tar -x -C .merged
          # `go vet` over no packages exits 0, so an empty tree must not pass.
          if [ ! -f .merged/go.mod ]; then
            echo "::error::The extracted merge tree has no go.mod, so nothing was checked."
            exit 1
          fi
          echo "MERGED_TREE=.merged" >> "$GITHUB_ENV"

      - name: Build the toolchain image
        if: env.MERGED_TREE != ''
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: Compile the merged tree (toolchain image)
        if: env.MERGED_TREE != ''
        env:
          IN_IMAGE_NETWORK: bridge
        run: make ci-toolchain-run CMD="cd .merged && go build ./... && go vet ./... && go vet -tags=integration ./... && echo 'the merge of this branch with its base compiles'"

      - name: Tear down
        if: always()
        run: rm -rf "$RUNNER_TEMP/gomodauth.env" .merged

  # Architecture gate (v1.20). go-objstore owns every blob backend, and a repo
  # reaches it only through the packages that are its storage seam; this
  # library has none, so no package may import it. Test files are exempt. A
  # source check with grep, not a stage: it runs on the runner's shell.
  arch-gates:
    name: Architecture Gates
    runs-on: ubuntu-latest
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: No direct go-objstore import outside the storage seam
        run: |
          if [ "$(sed -n 's/^module //p' go.mod)" = github.com/jeremyhahn/go-objstore ]; then
            echo "OK: this is go-objstore"; exit 0
          fi
          hits=$(grep -rln --include='*.go' '"github.com/jeremyhahn/go-objstore' . \
                 | grep -v '_test\.go$' \
                 | { if [ -n "$OBJSTORE_SEAMS" ]; then grep -vE "$OBJSTORE_SEAMS"; else cat; fi; } || true)
          if [ -n "$hits" ]; then
            echo "go-objstore may be imported only in the storage seam (OBJSTORE_SEAMS='$OBJSTORE_SEAMS'):"
            echo "$hits"; exit 1
          fi
          echo "OK: no go-objstore import outside the storage seam"

  # ---- Full tier ----
  #
  # Every full-tier job's `if:` is CI_FULL_TIER's expression, and CI Gate
  # reads env.CI_FULL_TIER; the table at the top of this file reads it out.

  # CUSTOMIZE (ci-template v1.18): the suite runs in the devcontainer
  # `integration` image built at this commit, as the compose service in
  # build/docker/devcontainer/compose.yaml. That service carries
  # test/tools/docker-run's privilege set and no more -- a test pins the two
  # equal -- because the suite drives host device-mapper and loop devices. The
  # compose project is go-luks2-ci-<run>-<attempt>, the reaper runs first, and
  # the teardown runs last under if: always(). Every project and container
  # name is unique to the job attempt; the integration image is the run's
  # content-addressed one, leased and never removed here. The ledger directory
  # (TEST_STATE_DIR) is bind-mounted from the runner host and deliberately
  # persists between jobs.
  integration:
    name: Integration [integration image]
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 120
    env:
      IT_PROJECT: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ITEST_CONTAINER: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}-itest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (as in the image job).
      - name: Lease the integration image
        run: |
          if docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            lease="go-luks2-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
            docker create --name "$lease" "$IT_IMAGE" true >/dev/null && echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          fi

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # The container's default command is `make coverage-combined`, so its
      # exit status carries the combined coverage gate; the target copies the
      # profile out and fails a container that passed without leaving one.
      - name: make integration-test (integration image)
        run: make integration-test MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS"

      # compose interpolates the whole file even to take it down, and its
      # required values are set only inside the make recipe; placeholders
      # satisfy them here. `down` removes by project name.
      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          docker rm -f "$ITEST_CONTAINER" >/dev/null 2>&1 || true
          GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
            docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

      - name: Upload integration coverage
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          if-no-files-found: error

  # Soak (v1.23): the integration suite looped in the integration image until
  # SOAK_MINUTES have passed, each iteration its own compose stack, torn down
  # before the next; the first red iteration fails the job. v1.24: nightly
  # and workflow_dispatch only, off main pushes and off ci:full; the Gate marks
  # it `nightly`. It replaces nothing in batch.yml, whose soak stays a dispatch.
  # CUSTOMIZE: each iteration's container is named under the project, as in
  # the integration job, and removed with it.
  soak:
    name: Soak [integration image]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    timeout-minutes: 90       # CUSTOMIZE: SOAK_MINUTES plus one iteration
    env:
      SOAK_MINUTES: 30        # CUSTOMIZE
      SOAK_TARGET: integration-test   # CUSTOMIZE: a make target of the integration image
      IT_PROJECT: go-luks2-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      # v1.23: the content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # v1.23: a lease on the integration image (as in the image job).
      - name: Lease the integration image
        run: |
          if docker image inspect "$IT_IMAGE" >/dev/null 2>&1; then
            lease="go-luks2-ci-lease-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$(od -An -N4 -tx1 /dev/urandom | tr -d ' \n')"
            docker create --name "$lease" "$IT_IMAGE" true >/dev/null && echo "IT_LEASE=$lease" >> "$GITHUB_ENV"
          fi

      - name: Write the module credential file
        run: |
          umask 077
          : > "$RUNNER_TEMP/gomodauth.env"
          for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
          done

      # compose interpolates the whole file even to take it down; the
      # placeholders are the integration job's.
      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make "$SOAK_TARGET" MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env" IT_PROJECT="$p" ITEST_CONTAINER="$p-itest" IT_IMAGE="$IT_IMAGE" GO_BUILD_TAGS="$GO_BUILD_TAGS" || rc=$?
            docker rm -f "$p-itest" >/dev/null 2>&1 || true
            GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
              docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            p=$(cat "$RUNNER_TEMP/soak-project")
            docker rm -f "$p-itest" >/dev/null 2>&1 || true
            GO_LUKS2_IT_IMAGE="$IT_IMAGE" GO_LUKS2_SECCOMP_PROFILE=unused GO_LUKS2_DM_MAJOR=0 GO_LUKS2_TEST_STATE_DIR=/unused \
              docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"
          [ -z "${IT_LEASE:-}" ] || docker rm "$IT_LEASE" >/dev/null || true

  # ---- PR tier, continued ----
  #
  # CUSTOMIZE: THE RACE LEGS, a job of the integration job's shape in
  # the toolchain image, through the Makefile so that this job and a
  # developer's `make test-unit` run the same commands under the same two
  # numbers (#92): UNIT_TEST_TIMEOUT, the ceiling that fails the run, and
  # UNIT_TEST_TARGET, the budget for ./pkg/luks2 under -race. What is raced is
  # the DEFAULT tag set; coverage is GATED on the image job's uninstrumented
  # run. v1.23: a repo's race job is the PR tier (`pr` in CI Gate, no tier
  # `if:`); v1.24: on a docs-only PR its steps skip, as the image job's unit
  # runs do.
  test-race:
    name: Race
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    needs: changes
    timeout-minutes: 60
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      - name: Build the toolchain image
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: Unit tests, -race (toolchain image)
        if: needs.changes.outputs.docs_only != 'true'
        run: make ci-toolchain-run CMD="make test-unit UNIT_TEST_FLAGS=-v"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # CUSTOMIZE: THE FIPS 140-3 GATE, a job of the integration job's shape in
  # the toolchain image; `make test-fips-mode` holds its mode, packages and
  # timeouts. STRICT mode, not `on` (ratified 2026-08-17): `fips140=on` still
  # PERMITS non-approved algorithms, so a path using SHA-1 would report green.
  # If this job fails, that failure IS the finding. Do not weaken it back to
  # `on` to make it pass -- fix the call site, or document a deliberate
  # exemption with the owner's approval.
  #
  # The FIPS import proof (#84, owner ruling 2026-09-25) runs first and
  # verbosely: a cryptsetup Argon2id volume is migrated with MigrateToFIPS in
  # a child run with GODEBUG=fips140=off and opened by a child with
  # fips140=only; the test fails if either child did not run in its mode.
  fips:
    name: FIPS
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'bigdisk' }}
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    timeout-minutes: 30
    env:
      # CUSTOMIZE (v1.22): the image job's cache class, for its stage.
      CI_CACHE_CLASS: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || 'pr' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      - name: Reap stale CI stacks
        run: make ci-reap-stacks

      - name: Build the toolchain image
        run: |
          ( umask 077; : > "$RUNNER_TEMP/gomodauth.env"
            for v in GOPRIVATE GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
              if [ -n "${!v:-}" ]; then printf '%s=%s\n' "$v" "${!v}" >> "$RUNNER_TEMP/gomodauth.env"; fi
            done )
          make docker-build-toolchain MODULE_ENV_FILE="$RUNNER_TEMP/gomodauth.env"
          rm -f "$RUNNER_TEMP/gomodauth.env"

      - name: FIPS build, import proof and unit tests (toolchain image)
        run: make ci-toolchain-run CMD="make test-fips-mode"

      - name: Tear down
        if: always()
        run: rm -f "$RUNNER_TEMP/gomodauth.env"

  # THE ONE GATE, and the single required check. It needs EVERY job above, in
  # every tier, and reads each by name on a `check` line tagged `pr`, `full`
  # or `nightly`; test/ci/workflows derives the tags from the jobs' `if:` and
  # fails on a job left out or mis-tagged.
  #
  #   success                              passes
  #   skipped, `full`, tier not run        passes: the full tier was not selected
  #   skipped, `nightly`, not nightly      passes: neither schedule nor dispatch
  #   skipped, anything else               fails: a job that never ran proved nothing
  #   failure, cancelled, unreadable       fails
  #
  # CUSTOMIZE: FULL_TIER and NIGHTLY are validated, so an unevaluated
  # expression is not a "no", and an empty result reads `<unreadable>`. Do not
  # use join(needs.*.result); it evaluates empty on Gitea. It runs on the
  # ci-gate runners, one CPU each, so it takes no checkout: one run step.
  ci-gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-gate' }}
    if: always()
    needs: [changes, image, integration, soak, arch-gates, merge-check, test-race, fips]
    steps:
      - name: Fail closed on any non-success
        env:
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          NIGHTLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          BAD=0
          echo "full tier selected: ${FULL_TIER}; nightly: ${NIGHTLY}"
          case "${FULL_TIER}" in
            true|false) ;;
            *) echo "FAIL FULL_TIER is '${FULL_TIER}', neither true nor false"; exit 1;;
          esac
          case "${NIGHTLY}" in
            true|false) ;;
            *) echo "FAIL NIGHTLY is '${NIGHTLY}', neither true nor false"; exit 1;;
          esac
          check() { # <job> <result> <pr|full|nightly>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = nightly ] && [ "${NIGHTLY}" != true ]; then
                  echo "SKIP $1 (nightly and dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 (${2:-<unreadable>})"; BAD=1;;
            esac
          }
          check changes     "${{ needs.changes.result }}" pr
          check image       "${{ needs.image.result }}" pr
          check arch-gates  "${{ needs.arch-gates.result }}" pr
          check merge-check "${{ needs.merge-check.result }}" pr
          check test-race   "${{ needs.test-race.result }}" pr
          check integration "${{ needs.integration.result }}" full
          check fips        "${{ needs.fips.result }}" full
          check soak        "${{ needs.soak.result }}" nightly
          if [ "$BAD" -ne 0 ]; then
            echo "CI gate failed: not every job reported success."
          else
            echo "CI gate passed."
          fi
          exit $BAD

# ci-template: v1.48 (customized)
# go-luks2 keeps these deviations from v1.48, each marked
# `# CUSTOMIZE (go-luks2):` where it lives: the merge-check, test-race and
# fips jobs and their CI Gate lines; a literal `runs-on: ubuntu-latest` on
# every job (owner ruling 999; bigdisk is retired here, so v1.48's preflight
# runner overflow is not adopted); no schedule trigger (#341,
# TestNoScheduleTrigger); no shell scripts (#211), so each template script is
# a Makefile target.
# v1.48 (2026-11-20, Tenant Agent ruling 1024 item 1, queue 250 (a), owner
# decision: the Dells' self-hosted runners supplement the 40 GitHub-hosted
# runners; hosted stays the default, and when the hosted pool is full a job
# runs on the Dells instead of queueing): a new preflight step, `Hosted or
# overflow runner (ruling 1024)`, counts this repository's jobs on
# GitHub-hosted runners (labels ubuntu-*, not self-hosted) in every queued
# and in-progress run, through the Actions API with the job token (actions:
# read; no new permission). It outputs `runner` and `runner_docker` as
# runs-on JSON: `"ubuntu-latest"` by default, and
# `["self-hosted","linux","x64","bigdisk"]` and `[...,"bigdisk-docker"]`
# when HOSTED_JOBS_PER_REPO (12, a new top-level env) or more hosted jobs of
# the repository are in progress, or a hosted job of another run has been
# queued HOSTED_QUEUE_GRACE_SECONDS (60) or more. The labels are the ones the
# Dell pools already register per repository. lint, image, lint-gates,
# integration and soak build or run images on a Docker daemon, so their
# runs-on reads runner_docker; CI Gate needs no daemon and reads runner
# (guarded with `|| '"ubuntu-latest"'`, since it also runs when preflight
# was skipped or failed, and then fails on its own). Each of them already
# needs preflight and keeps the self-hosted rules of v1.36, v1.44 and v1.45
# (no Actions cache, the LAN mask, the image history check): they run on
# bigdisk on the forge today. No fallback hides a failure, and the choice on
# error is hosted with a visible warning: when the counts cannot be read (a
# reply that is not 200, a list short of its total_count, a missing field,
# a threshold that is not a number), the step picks the hosted default and
# prints a ::warning that names why; it never sends a run to the Dells on
# an unread count. Off github.com it makes no call and each job keeps its
# forge label (bigdisk, ci-gate), as in v1.47. The preflight step `Runner
# labels (ruling 633)` accepts, in ci.yml only, a runs-on that reads exactly
# needs.preflight.outputs.runner or runner_docker: it evaluates the output at
# its default, which must give a standard image as finding (c) asks, and at
# its overflow, where exactly the matching bigdisk or bigdisk-docker list
# passes too. A self-hosted label any other way still needs its waiver.
# testdata/runner-select-tests.py runs the new step against a fake API, and
# testdata/runner-labels-tests.py part E holds the lint's cases. A
# repository adopts v1.48 as a one-file bump that keeps its CUSTOMIZE
# blocks; a CUSTOMIZE job that builds images may read runner_docker the same
# way, and one that adds `Free runner disk` runs it only when
# `runner.environment == 'github-hosted'`.
# v1.47 (2026-11-20, Tenant Agent ruling 1007; go-qrdb #1642's Codex review
# found that the v1.46 gate let `runs-on: codex  # self-hosted: hardware: ...`
# through on the waiver alone): the step `Runner labels (ruling 633)` checks
# the label and the category together. The review-only labels, `codex` and
# `qwen`, are reserved to code-review.yml whatever the waiver says: a job in
# any other workflow that names one, in its runs-on text or in what an
# expression there yields, is finding (f). In code-review.yml, `codex` takes
# only `credential:` and `qwen` only `hardware:`, and `credential:` is
# accepted only on the `codex` job; any other pairing is (f). Nothing else
# changes, and a repository that copied v1.46 unchanged passes v1.47.
# v1.46 (2026-11-20, Tenant Agent ruling 999, owner decision: GitHub-hosted
# standard runners for every CI job possible; self-hosted only for
# hardware-specific or oversize jobs, the reason recorded per job): the
# preflight step `Runner labels (ruling 633)` accepts a self-hosted runs-on
# on github.com only when its line names the category of its reason,
# `# self-hosted: hardware: <reason>` (a device, a GPU, a dedicated host or
# VM pool the job needs) or `# self-hosted: oversize: <reason>` (more than a
# standard runner's 4 vCPU, 16 GB, about 45 GB of disk after `Free runner
# disk`, or 6 hours). `# self-hosted: credential: <reason>` is accepted for
# the one job that holds a credential kept on one host (code-review.yml's
# Codex review), pending the Tenant Agent's answer on ruling 999. A v1.43
# reason with no category is now finding (e). A `release` job is the release
# rule's, unchanged. Every template job passes: batch.yml v1.3 and fuzz.yml
# v2 move to ubuntu-latest, code-review.yml v5.12.4 names its categories. A
# repository adopts v1.46 in ONE PR: each job that fits a standard runner
# moves to `ubuntu-latest` (keeping `Free runner disk` before an image
# build), and each job that stays self-hosted names its category and reason.
# v1.45 (2026-11-18, Tenant Agent ruling 901): every job that builds an image
# (lint, lint-gates, image, integration, soak) runs scripts/ci-image-history.sh
# on the images it will use, after its last build step and before its first
# use, on a pool runner: a pool build passes the LAN caches as BuildKit
# secrets, which no history entry keeps, and the check fails on any private
# address in an image's history or config. publish-images checks through
# ci-image-cache.sh v4 before the push, and masks the LAN addresses (ruling
# 887). Copy scripts/ci-image-history.sh (`chmod +x`); testdata/
# ci-image-history-tests.py holds the steps' places and publish's order.
# v1.44 (2026-11-18, Tenant Agent ruling 887; the owner's rule that internal
# addresses stay out of public repositories, and their CI logs count): every
# job that builds runs scripts/ci-mask-lan.sh right after the credential
# mask. A pool runner's environment names LAN addresses (the DEVCACHE_*
# package caches, GOPROXY's module proxy, the LAN CI registry); a BuildKit
# build echoes its build arguments and `go env` prints GOPROXY. The script
# prints ::add-mask:: for each private-address entry, its host:port and its
# host, so the runner masks them in every later line; on a GitHub-hosted
# runner the variables are unset and it prints nothing. A job a repository
# routes to a pool is therefore masked from its first build on. Copy the
# script to scripts/ci-mask-lan.sh (`chmod +x`); testdata/ci-mask-lan-tests.py
# holds the script and the step's place.
# v1.43 (2026-11-17, Tenant Agent ruling 833; the owner's 11-07 ruling that
# GitHub-hosted runners are the default, ruling 834's hosted-first phase 1):
# a job runs on a standard GitHub-hosted image unless it cannot fit one. The
# P1 repositories routed nearly every job to self-hosted pools for a push to
# main and a same-repository PR (go-qrdb 46 self-hosted references and no
# hosted runs-on), and about 250 jobs queued on the fleet while the 40
# hosted slots of a public repository's free standard runners sat idle. The
# preflight step `Runner labels (ruling 633)` gains two findings on
# github.com, for every job that does not name `release`: (c) its runs-on
# resolves, on some event, to anything but a standard GitHub-hosted image
# (ubuntu-latest, ubuntu-24.04, ubuntu-22.04, their -arm forms, ubuntu-slim),
# unless the runs-on line carries `# self-hosted: <reason>` (CUSTOMIZE: the
# jobs that cannot fit a standard runner, 4 vCPU, 16 GB, about 14 GB of disk
# and about 45 GB after `Free runner disk`: very large images or memory,
# privileged devices, hardware); (d) it names a larger runner (cores, large,
# xlarge, gpu), refused even with a reason, since a larger runner bills on a
# public repository. Every template job already passes; a repository adopts
# v1.43 by moving each job that fits to `ubuntu-latest` (keeping `Free runner
# disk` before an image build) and giving each job that stays a reason.
# v1.42 (2026-11-16, owner ruling 742 (1)): the CI Gate is hermetic. Its
# outcome depends only on the tree under test, on every event. The checks
# that fail on the state of the world rather than on a change leave ci.yml
# on every event: `make deps-check` (newer upstream releases and
# govulncheck's vulnerable requirements, both read from the network), the
# advisory half of `make security` (govulncheck and trivy fs against a fresh
# database) and `trivy image` of the integration image. Before it they turned
# mains red on their own, when an advisory or an upstream release appeared,
# and every PR cut from that main inherited the failure; v1.41's parity put
# them on every PR as well. They run only in scans.yml (scans v1.0.0, which
# replaces deps-bump.yml), on a schedule and on workflow_dispatch on main,
# never on a pull_request or a push. That workflow opens or updates ONE fix
# PR on ci/deps-bump with the bumps, and ONE issue for a finding the bump
# cannot clear. It is not the CI workflow, so a finding never reads as a red
# main and never starts revert-red-main.yml. gosec reads only the tree and
# stays on every event: the lint job runs `make gosec` again (v1.41 dropped
# the step and ran gosec inside `make security`). The lint job drops the
# deps-check steps and the image job drops `make security` and `trivy image`;
# the jobs, the needs list and CI Gate's check lines are unchanged.
# publish-images, on the release runner and never a PR gate, scans the
# toolchain image before it pushes it (ci-image-cache.sh v3). A repository
# adopts v1.42 in one CI-file PR that also takes ci-image-cache.sh v3,
# deletes .github/workflows/deps-bump.yml and adds scans.yml v1.0.0.
# Every other job, gate and tier is v1.41's.
# v1.41 (2026-11-16, owner ruling 742 (2)): PR/main parity. Every job and
# step that runs on a push to main also runs on a pull_request to main, with
# the same steps, so a PR never merges a change that main then fails on.
# CI_FULL_TIER is true on every event but a workflow_dispatch off main and
# off ci/deps-bump (which the preflight refuses), so a PR runs integration,
# make security and trivy image as main does; the integration job's `if:`
# no longer skips a PR. The `make gosec (PR tier)` step goes: make security
# runs gosec on every event. A PR run with a green Integration job proves its
# tree, so the squash merge of an up-to-date PR is a proven push and main
# skips its bigdisk jobs (v1.30 fix 2). `ci:full` no longer selects a tier;
# it only turns off the two PR path scopes below. The exceptions, each a job
# that cannot run on a PR by nature or a scope whose inputs a PR does not
# change: publish-images (pushes images to the registry from the release
# runner, ruling 633: no PR job may reach that runner); soak (schedule and
# workflow_dispatch only, never on a push either, so no parity gap); the
# docs-only scope (a PR whose every file matches DOCS_ONLY_PATTERN skips build
# and make coverage, whose inputs it does not touch) and the lint-gates path
# scope (LINT_GATES_PATTERN); a docs-only PR skips the image job (make security,
# trivy image) as before and now integration too, so CI Gate checks integration
# as `code`, not `full`. A repository adopts v1.41 in one CI-file PR and
# sizes its PR runner capacity for the integration job on every PR.
# Every other job, gate and tier is v1.40's.
# v1.40 (2026-11-16, owner ruling 732): a library behind a newer upstream
# release never fails CI. The deps-check step passes DEPS_CHECK_LAG=report on
# every event, so depscheck v1.1.0 (`-lag report`) reports every lag and fails
# only a vulnerable go.mod requirement, a lookup failure, and a fork replace or
# pseudo-version with no reason comment on a line the change adds or bumps
# (ruling 640). Before it, deps-check turned 11+ PRs red across three
# repositories for upstream releases the PRs never touched. The daily
# deps-bump.yml (deps-bump v1.1.0) keeps the full gate and carries every lag
# as ONE PR on ci/deps-bump. A repository adopts v1.40 in one CI-file PR with
# scripts/depscheck v1.1.0, the Makefile's `-lag $(DEPS_CHECK_LAG)` argument
# and deps-bump.yml v1.1.0. Every other job, gate and tier is v1.39's.
# v1.39 (2026-11-14, ruling 640, owner decision 222 (a)): deps-check fails a
# library behind its latest release only when the change adds that go.mod
# requirement or changes its version, or when govulncheck reports a version of
# a go.mod requirement vulnerable (stdlib, toolchain and indirect-only findings
# are reported); a lag the change did not touch is reported, not failed. A new
# lint-job step, `Base commit for deps-check (ruling 640)`, fetches one
# commit at depth 1 and exports DEPS_CHECK_BASE: the pull request's base sha
# (the merge ref's first parent) or a push's `before`; a schedule or
# workflow_dispatch run sets none and keeps the full gate. `make deps-check`
# receives it as a make variable. The preflight refusal of a workflow_dispatch
# off main exempts refs/heads/ci/deps-bump, which runs the PR tier: a PR that
# GITHUB_TOKEN opens starts no pull_request run, so deps-bump.yml dispatches
# this workflow there. The repository's deps-check is the shared
# depscheck v1.0.0 (templates/deps/depscheck) with `-vuln`, and the daily
# deps-bump.yml (deps-bump v1.0.0) opens the one PR on ci/deps-bump that
# carries the bumps. A repository adopts v1.39 in one CI-file PR with
# scripts/depscheck, its Makefile's deps-check and deps-bump targets, and
# .github/workflows/deps-bump.yml. Every other job, gate and tier is v1.38's.
# v1.38 (2026-11-14, owner ruling 633, decision 219(d)): release and publish
# jobs run only on `[self-hosted, linux, x64, release]`, and no pull request
# job ever does. A pull request's test code reached the Docker daemon that
# main's image builds and the Trivy gate also used, so it could re-tag a base
# or scan image they then trusted (go-xkms #1384). publish-images moves to
# that label; on GitHub it runs only when the repository variable
# RELEASE_RUNNER is `true`, so no run waits on a label with no runner, and on
# Gitea it runs as before. A new preflight step, `Runner labels (ruling
# 633)`, fails CI when a workflow of the repository has a job that names
# `release` and that a pull request could run, or whose `if:` does not
# restrict it to a push to main or a tag, or a workflow_dispatch on main.
# The bigdisk-docker pools get a rootless Docker daemon of their own at the
# same /var/run/docker.sock path (no workflow change; see ci-standard.md
# §3a). A repository adopts v1.38 in one CI-file PR that also moves its
# release.yml jobs to the release label, pins its build and scan images by
# @sha256 digest and pulls them by digest before docker create or run, and
# sets RELEASE_RUNNER only once Infrastructure reports the release pools
# live. Every other job, gate and tier is v1.37's.
# v1.37 (2026-11-13, ruling 580): every job in every template carries
# timeout-minutes so a hung job ends itself. Ceilings by kind: unit, race,
# lint and other test jobs 60; integration, image builds, soak and release
# 120; gates and aggregators 10. A repository sets a job at or under its
# ceiling, sized at 1.5 x the job's longest green run; a job whose green
# runs need more keeps its measured value. automerge.yml, nightly.yml and
# revert-red-main.yml gain the timeouts they lacked.
# v1.36 (2026-11-13, Tenant Agent, owner approval 16:1xZ: keep CI caches
# local): a self-hosted job never restores or saves the Actions cache, which
# lives in Azure blob storage behind the office's internet line. The
# self-hosted pools (dept-infra github/runner) give every job persistent
# per-host caches: GOCACHE and GOMODCACHE, CI_HOST_CACHE for anything else a
# repository caches (trusted-firmware's OP-TEE stack under
# $CI_HOST_CACHE/optee/<pin>, renamed into place whole), GOPROXY and
# DEVCACHE_GOPROXY through Athens, and TRIVY_DB_REPOSITORY and
# TRIVY_JAVA_DB_REPOSITORY through the dev-cache ghcr mirror. So, in any job
# that can run self-hosted: every actions/setup-go step takes
# `cache: ${{ runner.environment != 'self-hosted' }}`, and an actions/cache
# step runs only when a CI_HOST_CACHE lookup missed (once per host and key).
# scripts/in-toolchain-image.sh v6 passes the TRIVY_* settings to a bridge
# stage. GitHub-hosted jobs are unchanged. Every job, gate and tier is
# v1.35.3's.
# v1.35.3 (2026-11-12, Tenant Agent m2586 (1)): `pull_request` also fires on
# `ready_for_review`. A draft runs no CI (v1.26), and marking it ready started
# no run, so every draft converted to ready sat with no CI until someone
# pushed or closed and reopened it (go-quicraft reopened 8 PRs by hand). The
# ready_for_review run is the PR's first real run: the draft had none in
# flight for it to cancel. This supersedes v1.26's "no ready_for_review
# trigger" and its empty-commit step. Every job, gate and tier is v1.35.2's.
# v1.35.2 (2026-11-11, Tenant Agent m2577, Codex finding on xkey-android
# #129): the `Signatures` job leaves this workflow. It ran in the pull
# request's own workflow, so the pull request's tree held the verifier that
# judged it. It is now signatures.yml (signatures-template v1), on
# pull_request_target: GitHub reads it from the base branch, it checks out
# the base only and reads the pull request's commits as objects, and it no
# longer reads the registry from the head. CI Gate drops `signatures` from
# its needs; the ruleset requires `Signatures / Signatures` beside it. A
# repository adopts v1.35.2 in one CI-file PR: ci.yml, signatures.yml and
# .github/allowed_signers. Every other job, gate and tier is v1.35.1's.
# v1.35.1 (2026-11-11, Tenant Agent m2557, Codex findings on go-luks2 #444 and
# xkey-android #129): the Signatures job fetches a named base that is not in
# the clone and fails closed when it still cannot be read (it no longer falls
# back to the head's registry and the head commit alone), and its
# signature-presence check reads the whole commit object, so a long signed
# message cannot fail under pipefail with SIGPIPE.
# v1.35 (2026-11-11, Tenant Agent m2557, owner ruling on commit signing): a
# `Signatures` job verifies every commit in the range against the
# repository's .github/allowed_signers registry, read from the base commit,
# and accepts a GitHub-made commit only when the API reports it verified as
# web-flow; it fails closed and is in CI Gate's needs as a `pr` job. A
# repository adopts v1.35 in one CI-file PR with its .github/allowed_signers
# (handbook software/templates/signing/<repo>.allowed_signers); every other
# job, gate and tier is v1.34.1's.
# v1.34.1 (ruling 377): GO_BUILD_PROXY is <DEVCACHE_GOPROXY>|https://proxy.golang.org,
# with no trailing `direct`: no direct fetch, anywhere
# (dependency-resolution.md). A GOPRIVATE path never uses GOPROXY. The
# toolchain stage's network GOPROXY (ci-toolchain-run, the template's
# in-toolchain-image.sh v5) loses its `direct` entry as well.
# v1.34: the `changes`, `schedule-guard` and `arch-gates` jobs are one
# `preflight` job: the schedule guard first, before anything is checked out,
# then one checkout with persist-credentials false, the changed-files step and
# the architecture gate. Its outputs are needs.preflight.outputs.*, and CI
# Gate checks `preflight` in place of the three.
# v1.33.2: the releasability step takes the InfoSec waiver. A matched line
# that carries `lab-string-ok: <reason>` (colon and reason required) is listed
# as waived, path and line only, and does not fail; a bare marker still fails.
# v1.33.1 and v1.33: the pattern file has five classes, coord-host,
# internal-email, lab-address, lab-host and owner-path (optional `/i`), and
# the image namespace is the repository variable CI_IMAGE_NAMESPACE.
# v1.32: the releasability step reads the private pattern file as
# `class<TAB>regex` lines and greps the regex fields with -E.
# v1.31: the internal-name gate reads its patterns from the Actions secret
# RELEASABILITY_PATTERNS, never from this repository, and prints path and line
# only.
# v1.30: the five fixes of the 72-hour CI evaluation. (1) The lint-class
# stages leave the image job for a `lint` job that builds the toolchain image
# alone (`make docker-build-toolchain`) and runs beside build and test; the
# registry cache of the toolchain image (publish-images,
# scripts/ci-image-cache.sh) is not adopted here, see CUSTOMIZE below. (2) A
# push to main whose tree already has a green full tier gets the guard's
# `proven` verdict; on github.com the guard makes no API call, so `proven`
# cannot occur here. (3) lint-gates is path-scoped on a PR
# (LINT_GATES_PATTERN), and a PR from a checkpoint branch (lane-ckpt/*) is
# refused. (4) Every job carries timeout-minutes. (5) `make gosec` runs on the
# PR tier in the lint job (make security keeps it on the full tier), and a
# workflow_dispatch off main is refused: no full tier on a PR branch.
# v1.29.5 and v1.29.4: each image build passes
# GO_BUILD_PROXY=<DEVCACHE_GOPROXY>|https://proxy.golang.org when the runner
# sets DEVCACHE_GOPROXY and the cache answers a 5-second probe, as one quoted
# make argument (the Makefile passes it to docker build by name, `--build-arg
# GO_BUILD_PROXY`, so no shell sees the `|`); otherwise none, as before. The
# guard reads `waiting` before `in_progress`. The toolchain stage takes the job
# slot's memory bound (--memory and --memory-swap from the job's cgroup
# memory.max, 8g with no limit, IN_IMAGE_MEMORY overrides) and keeps Go's
# build scratch (TMPDIR, GOTMPDIR) on an anonymous volume on /var/tmp, not the
# 3 GB /tmp tmpfs.
# v1.29.3: a schedule run's concurrency group is `schedule-{repository}`, and
# the schedule guard (now a preflight step) holds a schedule run's jobs while
# a main push run is in flight. No workflow here is scheduled, so the guard
# only refuses (v1.30).
# CUSTOMIZE (go-luks2, the v1.29.3 to v1.34.1 adoption): the canonical
# scripts stay Makefile recipes (ci-toolchain-run, ci-reap-stacks,
# ci-trim-caches, apk-index-sum), because the public release ships no shell
# scripts. publish-images and scripts/ci-image-cache.sh are not adopted: the
# job skips on github.com, where this repository runs, and the script would be
# a shipped shell script with no registry to talk to; every job builds its
# toolchain image itself, as before. The lint job takes the image job's
# lint-class steps: the tool pins, make lint, the releasability gates (make
# releasability, this repository's RELEASABILITY_TEST, and the private
# patterns), the build-tag assertion, make gosec (PR tier) and make
# deps-check. The image job skips on a docs-only PR (`code` in CI Gate). The
# runners were unchanged by v1.35; ruling 999 since puts every job on
# ubuntu-latest.
# v1.29.2 (Company Agent ruling 239(8), 2026-10-28): comments only; no job,
# gate or tier changes. A CUSTOMIZE job gated on a changes output (a path-gated
# suite) needs the image job too and tests an output of the image job in its
# `if:`. On a pull_request, an `if:` that reads only `needs.changes.result` or
# only `needs.changes.outputs.*` left such a job skipped unstarted (two runs
# in a row); one that also tests the image job's output started it. A
# repository needs no adoption PR.
# v1.29.1 (ruling 226(15), 108 repair, 2026-10-27): lint fails
# fast. The lint-gates job runs `make lint-gates` without `-k`, so the first
# failing gate ends the step. Under `-k` make went on running the other gates
# after one had failed: in another repository's run Lint took 51.5 min, 37 of
# them after the `go vet` failure. A red gate now reports as soon as it fails,
# and the gates after it run on the next push. No other job, gate or tier
# changes. A repository adopts v1.29.1 as a CI-file PR.
# v1.29.0 (Company Agent ruling 220(5) and 221(4), 2026-10-27):
# the Alpine package index checksum joins the integration image's tag hash.
# Before v1.29 the tag hashed only the tree, so a tree whose files had not
# changed kept its cached image after Alpine shipped a fix, and `trivy image`
# stayed red on a fixed CVE until an unrelated file moved (another
# repository's main, CVE-2026-92392, libcurl 8.23.0-r0). A new step, "Read the Alpine
# package index", runs scripts/apk-index-sum.sh (v1, ships beside this file)
# and puts its value in APK_INDEX_SUM. Every job that names the integration
# image (image, lint-gates, integration, soak) runs it before "Name the
# integration image", so none waits for the image job's serial stages. The
# repository's `make -s it-image` hashes APK_INDEX_SUM, and `make
# docker-build` passes it to the integration image's build as `--build-arg
# APK_INDEX_SUM`. The Dockerfile's `integration` stage declares the ARG and
# then, as root, runs `apk upgrade --no-cache`, so a new sum misses the cache
# from that step on (ci-standard.md §9, devcontainer.md §6); `base` and
# `toolchain` do not declare it. So a new Alpine package release changes the
# tag and forces a rebuild, with the fixed package. A base image the script
# cannot read fails the job: a missing index is never a pass. A repository
# adopts v1.29 as one PR: this file, scripts/apk-index-sum.sh (in its
# shellcheck list), the Makefile's APK_INDEX_SUM in it-image and docker-build,
# and the Dockerfile's ARG and apk upgrade. A repository whose integration
# image has no apk base gets `none`, a constant, so its tag changes only with
# its tree. The parallel stage jobs move to v1.30: `runs-on` cannot take a
# needs output on the forge's Actions runner, and the registry-push question
# is with the owner.
# CUSTOMIZE (v1.29): "Read the Alpine package index" runs `make -s
# apk-index-sum`, the Makefile recipe of scripts/apk-index-sum.sh v1, because
# the public release ships no shell scripts; so no script joins a shellcheck
# list. This repository's integration image builds on the Debian Go image,
# which has no apk, so the recipe prints `none` and the Dockerfile declares the
# ARG with no apk upgrade. CUSTOMIZE (main-fix, after main 9ab065b04 shipped
# linux-libc-dev 6.12.116-1 from a cached base upgrade layer): the same step
# also runs `make -s apt-index-sum`, the Debian counterpart, into
# APT_INDEX_SUM, which `make -s it-image` hashes and the integration stage
# declares before its own apt-get upgrade, so a Debian security fix renames
# the image and re-runs that upgrade.
# v1.28.0 (Company Agent ruling 219(3), 2026-10-26): `make deps-check` joins
# the PR tier as a lint-class gate. Its step in the image job drops the
# CI_FULL_TIER condition and runs on every event, as `make lint` does, so a
# module behind its dependency floor fails the PR, not main after the merge
# (another repository's main went red on its push run for exactly this). The
# step keeps IN_IMAGE_NETWORK=bridge for the module proxy and runs in seconds;
# it stays on the full tier too. The image job is already `pr` in CI Gate, so
# no needs or results line changes. A repository adopts v1.28 as a CI-file PR;
# none hand-patches its ci.yml ahead of it.

name: CI

# ONE workflow file, run by two different Actions hosts: github.com and a
# self-hosted forge. Steps that only work on github.com are guarded on
# github.server_url; everything that gates a merge runs on both.
#
# RUNNERS (Company Agent m2077): every job runs on GitHub-hosted
# `ubuntu-latest`, so main's CI Gate can go green on GitHub. The self-hosted
# labels this file used (`bigdisk` for the image-building jobs, `ci-gate` for
# the gate) are gone, and .github/actionlint.yaml no longer lists them. A
# hosted runner has 4 cores, about 14 GB of free disk and a 6 h job limit:
# every job that builds a devcontainer image runs "Free runner disk" before
# its build (github.com only), and no job's timeout (120 min at most) comes
# near the limit, so none is sharded.
#
# Ruling 999: every job runs on GitHub-hosted ubuntu-latest. A self-hosted
# runner is only for a hardware-specific job or one that exceeds a measured
# hosted limit (disk, memory, or 6 h); no job in this workflow qualifies. The
# jobs that build a devcontainer image (lint, image, lint-gates, merge-check,
# integration, soak, test-race, fips) free the runner's disk first.
#
# ci-template v1.21 (ci-standard.md §2, devcontainer.md §7): every stage runs in
# this repository's own devcontainer image and no other. No job sets up Go or
# installs a tool on the runner; the image's pin file decides every version
# and the Makefile carries every flag set. Each stage is one `make` target run
# in the toolchain image through `make ci-toolchain-run`, which copies the
# checkout into the container: a runner reaches its daemon through a socket,
# so a bind mount would resolve on the daemon's host. The canonical scripts
# are Makefile recipes here (ci-toolchain-run, ci-reap-stacks,
# ci-trim-caches, assert-build-tags) because the public release ships no
# shell scripts.
#
# ci-template v1.22 (ci-standard.md §6): the stages keep the Go build,
# golangci-lint and module caches in named volumes on the runner's Docker
# host, kept across jobs and split by trust class (CI_CACHE_CLASS: `main` for
# a push to main, `pr` otherwise), never in a job container's writable layer
# or its /tmp. `make ci-trim-caches` bounds the repository's cache volumes on
# the host (CI_CACHE_MAX_GIB, default 32). CUSTOMIZE: the race, FIPS and
# merged-tree jobs run their stages through the same recipe, so they take the
# same CI_CACHE_CLASS.
#
# ci-template v1.22.2 (ci-standard.md §7): each stage runs at the job slot's
# CPU bound. ci-toolchain-run reads the job container's cgroup cpu.max and
# gives the stage container that --cpus, with GOMAXPROCS from it; no number is
# hardcoded here or in the Makefile.
#
# ci-template v1.23 (ci-standard.md §9): the integration image is named by its
# content, go-luks2-ci-it:<hash> (`make -s it-image`), built once per runner
# and reused by every job and run of that tree. No job removes it: each job
# holds a lease on it (a created, never started container), and
# `make ci-reap-stacks` removes an image older than REAP_IMAGE_MIN_AGE that no
# container uses.
#
# Concurrency (ci-template v1.26.2): main CI runs are keyed per sha. The main
# group is the workflow, the event and the commit, so each commit's run on
# main is its own group and runs to the end, and a merge never cancels the main
# run in progress; a schedule or workflow_dispatch run never shares a group
# with a push run. Every other ref is one group, so a PR's newer run cancels
# the older.
#
# Draft pull requests (ci-template v1.26): a draft PR runs no CI. Every job but
# CI Gate skips when github.event.pull_request.draft is true, and CI Gate
# fails on a draft without running anything, so no draft head carries a green
# or skipped gate into its merge. Marking the PR ready starts no run (there is
# no edited or ready_for_review trigger): the PR's own lane pushes an empty
# commit when the PR leaves draft.
#
# The forge credentials are masked first in every job that has them, and
# reach an image build only as the gomodauth BuildKit secret, from a file
# outside the context that the job removes. No step prints that file, the job
# environment or a matched line; test/ci/workflows asserts it.
#
# ACROSS runs, supersession: the self-hosted host exposes no REST route to
# cancel a run, so the `concurrency` block below is what sheds a superseded
# run.
#
# THREE TIERS, ONE GATE (ci-standard.md §8, sdlc §5a).
#
#   PR tier    every event but a draft PR: Preflight (changed files,
#              schedule guard, architecture gate), Lint, Devcontainer image,
#              Lint Gates, Merged Tree and Race. Lint (ci-template v1.30)
#              runs the tool pins, lint, the releasability gates, the
#              build-tag assertion, gosec and deps-check in the toolchain
#              image. Lint Gates (v1.27) runs `make lint-gates` beside it,
#              only when the Makefile defines the target. The image job runs
#              build and test in the toolchain image built at this commit,
#              and with them the linux binaries, the 32-bit vet, the unit
#              legs (no -race) and their coverage gate, the calibration tests
#              and the API gate. Race is the -race unit run with its
#              pkg/luks2 budget. A PR whose every changed file matches
#              DOCS_ONLY_PATTERN skips the image job, the tag assertion,
#              gosec and the race run; lint and the gates that read the docs
#              still run.
#   Full tier  push to main, workflow_dispatch, and a
#              pull_request labelled `ci:full`: the PR tier plus Integration
#              and FIPS, each its own job in the image, and the image job's
#              security (gosec, govulncheck, go mod verify, trivy's filesystem
#              scan) and trivy image steps. v1.30: a workflow_dispatch off
#              main is refused, never the full tier.
#   Nightly    workflow_dispatch only: the full tier plus
#              Soak, the integration suite looped in the integration image
#              for SOAK_MINUTES.
#
# CI Gate, the single required check, needs EVERY job and reads each by name,
# tagged `pr`, `code`, `scoped`, `full` or `nightly`. A `full` job may be
# skipped only while the full tier is not selected, a `nightly` job only off
# workflow_dispatch, a `code` job only on a docs-only PR and a `scoped` job
# only when no changed file matches LINT_GATES_PATTERN; any other skip, and
# every failure or cancellation, fails it. On a
# draft PR every job but CI Gate skips and CI Gate itself fails.
#
# No CI workflow in this repository is scheduled: its nightly run is suspended,
# so the full tier runs on push to main, workflow_dispatch and a `ci:full` PR,
# and Soak on workflow_dispatch only. nightly.yml stays
# dispatch-only; nightly.yml still runs trivy's filesystem scan, uploads its
# SARIF to code scanning on github.com, and runs the advisory
# misconfiguration scan.
#
# The full tier is CI_FULL_TIER below. A job-level `if:` cannot read env, so
# every full-tier job repeats its expression, and test/ci/workflows asserts
# they stay identical:
#
#   push, or workflow_dispatch on main         -> full tier
#   pull_request labelled ci:full              -> full tier
#
# LABEL EVENTS DO NOT RUN CI. ci.yml does not fire on `labeled`: on this host
# every label add and remove arrives as `labeled`, so each review or task
# label started a run that cancelled the PR's run in progress. A label is read
# when a run starts, so ci:full selects the full tier for any run that begins
# with the label on the PR. The gate is never skipped by an event condition: a
# job skipped by `if:` still posts a status under its name, and both hosts
# count a skipped required check as passing. Gitea does not evaluate
# expressions in a job's `name:`, so every name is literal.
# test/ci/workflows asserts the types below and the literal gate name.
on:
  push:
    branches: [main]                    # trunk-based: main is the ONLY trunk
  pull_request:
    branches: [main]
    # v1.25.4: no `labeled`. Gitea 1.27.1 sends every
    # label add AND remove as `label_updated`, and its matcher maps that to
    # `labeled` whichever label moved, with no `github.event.label` in the
    # payload. Each `task:*` or `code-review` change then started a run that
    # the `concurrency` block let cancel the PR's run in progress, and a run
    # whose jobs an `if:` skips would post `skipped` over the real run's
    # `CI / *` contexts, CI Gate included. An action outside `types` matches
    # nothing: no run, no status. The cost: adding `ci:full` waits for the
    # PR's next push or update-branch, or takes effect through
    # `workflow_dispatch`.
    # v1.35.3: `ready_for_review`. CI Gate fails on a draft, so a PR marked
    # ready with no new push needs its own run, or its head keeps the draft's
    # failed gate until the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  # Lets a run be repeated without inventing a commit, which matters when a
  # failure is the runner's rather than the code's.
  workflow_dispatch:
  # CUSTOMIZE (go-luks2): no schedule trigger (#341, sdlc §5a,
  # TestNoScheduleTrigger); main's full tier runs after every merge and on
  # workflow_dispatch, never on a cron.

# v1.26.2: on main the group is the workflow, the event and the commit sha,
# so each main run is its own group and a merge never cancels the main run in
# progress; a schedule or workflow_dispatch run is in its own event's group
# and never shares one with a push run (superseding v1.25's `main-{event}`
# group). Every other ref is one group, so a PR's newer run cancels the
# older. No expression reaches cancel-in-progress: Gitea 1.27.1 never
# released a main run queued behind one that set it to an expression.
# v1.29.3: a schedule run's group is `schedule-{repository}`, with no sha, so a
# repository has one schedule run at a time (none is scheduled here).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && format('schedule-{0}', github.repository) || github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_THRESHOLD: 90      # CUSTOMIZE: per testing-guidelines.md
  # CUSTOMIZE (v1.9.2): the repo's full build-tag set, SPACE separated. The
  # integration suites and their `!integration` stubs sit behind
  # `integration`; lint, gosec and the assertion below read it, never the
  # unit run (the Makefile's GO_BUILD_TAGS block says why).
  GO_BUILD_TAGS: "integration"
  # v1.23: the full tier (ci-standard.md §8). v1.41 (ruling 742 (2)): every
  # event, a pull_request included, so a PR runs every stage main runs.
  # v1.30 (fix 5): a workflow_dispatch off main is not the full tier (the
  # schedule guard refuses it and CI Gate fails); v1.41: ci/deps-bump, which
  # deps-bump.yml (v1.42: scans.yml) dispatches because its PR starts no
  # pull_request run, is.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  CI_FULL_TIER: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/deps-bump' }}
  # v1.41: `ci:full` on a PR turns off the docs-only and lint-gates path
  # scopes; it selects no tier.
  CI_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # v1.24 (Tenant Agent m749, m751 (a)): the files a docs-only PR may touch. CUSTOMIZE: narrow it
  # in a repo that embeds or generates from docs/ (go:embed, OpenAPI, protos).
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # v1.30 (fix 3): a PR runs the lint-gates job only when a changed file
  # matches this extended regex. CUSTOMIZE: this repository defines no
  # lint-gates target, so the default, every file, stands.
  LINT_GATES_PATTERN: '.'
  # v1.26.1: the template's RELEASABILITY_TEST variable and its docs-only step
  # are not used here. CUSTOMIZE: this repository's releasability check is the
  # gate `make releasability`, not a `go test`, and the lint job's
  # "Public-releasability gate" step below runs it on every pull request,
  # docs-only ones included (it has no docs_only condition), so a private value
  # in README.md or docs/ fails the PR.

  # ANALYSIS TOOL PINS (#21, #44). CUSTOMIZE: the image builds golangci-lint,
  # gosec and govulncheck from build/docker/devcontainer/tool-pins.env; the
  # image job asserts the binaries in it against these, so a skew between the
  # two fails the job rather than scanning with something else. Bumping one is
  # a DELIBERATE change, and the pin file is bumped in the same breath.
  GOLANGCI_LINT_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.8.0"
  # CUSTOMIZE (go-luks2): v1.48's HOSTED_JOBS_PER_REPO and
  # HOSTED_QUEUE_GRACE_SECONDS are not taken. Every job's runs-on is a literal
  # ubuntu-latest (owner ruling 999) and bigdisk is retired here, so the
  # preflight overflow step that reads them is not taken either.

jobs:
  # ---- PR tier ----
  #
  # v1.34: one preflight job, in place of the changes, schedule-guard and
  # arch-gates jobs, in this order: the schedule guard, before anything is
  # checked out, so AGENT_TOKEN (a schedule run and a push to main only)
  # reaches a step beside no repository code; one checkout with
  # persist-credentials false; the changed-files step; the architecture gate.
  # v1.24: is every file this PR changes markdown or under docs/? Off a PR,
  # and on a PR in the full tier, the answer is no without a diff. Any doubt
  # (a failed diff, an empty list) reads as false. v1.30: lint_gates is false
  # only on a PR whose changed files all miss LINT_GATES_PATTERN.
  # v1.29.3 and v1.30: the guard sets `verdict`. `refused`: a
  # workflow_dispatch off main, or a pull request from a checkpoint branch
  # (lane-ckpt/*); every job but CI Gate skips and CI Gate fails. Off
  # github.com, on a schedule run, `busy` while a main push run is in flight
  # and `unreadable` when the API gives no count; on a push to main, `proven`
  # when a green full-tier run already proved this tree. On github.com, where
  # this repository runs, the guard makes no API call, so only `run` and
  # `refused` occur here. Every other job runs only on `run`.
  # Architecture gate (v1.20): go-objstore owns every blob backend, and a repo
  # reaches it only through the packages that are its storage seam; this
  # library has none, so no package may import it. Test files are exempt. A
  # source check with grep on the runner's shell, on the PR tier.
  preflight:
    name: Preflight [changed files, schedule guard, architecture gates]
    runs-on: ubuntu-latest
    # v1.26: a draft PR runs no CI; every job that needs this one skips with it.
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 10       # v1.34: the three jobs had 5 each
    permissions:
      actions: read
      contents: read
    env:
      OBJSTORE_SEAMS: ''      # CUSTOMIZE: this library has no storage seam, so no package may import go-objstore
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      lint_gates: ${{ steps.diff.outputs.lint_gates }}   # v1.30
      verdict: ${{ steps.guard.outputs.verdict }}
      proof: ${{ steps.guard.outputs.proof }}   # v1.30
      # v1.48 (ruling 1024): runs-on JSON for the two hosted-capable classes,
      # read as fromJSON(needs.preflight.outputs.runner_docker) by every job
      # that builds or runs images and fromJSON(needs.preflight.outputs.runner)
      # by CI Gate. `"ubuntu-latest"`, or the Dells' overflow label list.
      runner: ${{ steps.runner.outputs.runner }}
      runner_docker: ${{ steps.runner.outputs.runner_docker }}
    steps:
      - name: Is a main push run of this workflow in flight?
        id: guard
        env:
          EVENT: ${{ github.event_name }}
          SERVER: ${{ github.server_url }}
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
          SHA: ${{ github.sha }}
          # This workflow's own file: the route counts its runs only.
          RUNS_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/ci.yml/runs
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          JOB_TOKEN: ${{ github.token }}
          # v1.30: a push to main reads the tree proof with it as well.
          BOT: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && secrets.AGENT_TOKEN || '' }}
        run: |
          set -uo pipefail
          # runs <token>: sets N to the number of this workflow's push runs
          # on main in progress or waiting. It returns 1, with the answer in
          # CODE, when a reply is not 200 with a count. The token reaches
          # curl as a header from a file descriptor, never on its command line.
          runs() {
            local st n
            N=0
            # v1.29.4: waiting is read before in_progress. A run only moves
            # waiting, then in_progress, then done, so one waiting at the
            # first query is still waiting, in progress or done at the
            # second, and counted or finished. The other order lets a run
            # start between the two queries and be counted by neither.
            for st in waiting in_progress; do
              CODE=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/runs.json" -w '%{http_code}' \
                -H @<(printf 'Authorization: token %s\n' "$1") \
                "$RUNS_API?event=push&branch=main&status=$st&limit=1") || CODE="curl exit $?"
              [ "$CODE" = 200 ] || return 1
              n=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/runs.json") || { CODE="200 with no count"; return 1; }
              echo "$st: $n"
              N=$((N + n))
            done
          }
          # get <token> <url> <file>: 0 on a 200 reply, saved in <file>.
          get() {
            [ "$(curl -sS --max-time 30 -o "$3" -w '%{http_code}' \
              -H @<(printf 'Authorization: token %s\n' "$1") "$2")" = 200 ]
          }
          # v1.30: proof <token>: sets PROOF to the id of the newest of this
          # workflow's last 20 successful runs whose head commit has this
          # commit's tree and whose Integration jobs all succeeded (at least
          # one). It returns 1 when a reply is not 200, and 0 with PROOF
          # empty when no run proves the tree.
          proof() {
            local tree id sha t
            PROOF=
            get "$1" "$REPO_API/git/commits/$SHA" "$RUNNER_TEMP/c.json" || return 1
            tree=$(jq -er '.commit.tree.sha' "$RUNNER_TEMP/c.json") || return 1
            get "$1" "$RUNS_API?status=success&limit=20" "$RUNNER_TEMP/ok.json" || return 1
            while read -r id sha; do
              get "$1" "$REPO_API/git/commits/$sha" "$RUNNER_TEMP/c.json" || continue
              t=$(jq -r '.commit.tree.sha' "$RUNNER_TEMP/c.json")
              [ "$t" = "$tree" ] || continue
              get "$1" "$REPO_API/actions/runs/$id/jobs?limit=100" "$RUNNER_TEMP/j.json" || continue
              if jq -e '[.jobs[] | select(.name | startswith("Integration"))] | length > 0 and all(.conclusion == "success")' \
                   "$RUNNER_TEMP/j.json" >/dev/null; then
                PROOF=$id
                echo "tree $tree: run $id (head $sha) has a green full tier"
                return 0
              fi
            done < <(jq -r '.workflow_runs[]? | "\(.id) \(.head_sha)"' "$RUNNER_TEMP/ok.json")
            echo "tree $tree: no green full-tier run among the last 20 successful runs"
          }
          verdict=run N=0 PROOF=
          # v1.30 (fixes 3 and 5): the refusals come first.
          # v1.39 (ruling 640): deps-bump.yml dispatches this workflow on
          # ci/deps-bump, because the PR it opens with GITHUB_TOKEN starts no
          # pull_request run. That dispatch is the full tier (v1.41,
          # CI_FULL_TIER), so it is not refused. v1.42: scans.yml (which
          # replaces deps-bump.yml, ruling 742 (1)) dispatches it the same way.
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ] && [ "$REF" != refs/heads/ci/deps-bump ]; then
            verdict=refused
            echo "::error::workflow_dispatch on $REF: a dispatch runs on main and ci/deps-bump only (ci-template v1.30, v1.41); every job skips and CI Gate fails"
          elif [ "$EVENT" = pull_request ] && [ "${HEAD_REF#lane-ckpt/}" != "$HEAD_REF" ]; then
            verdict=refused
            echo "::error::a pull request from checkpoint branch $HEAD_REF: a checkpoint branch never opens a PR (ci-template v1.30); every job skips and CI Gate fails"
          fi
          if [ "$verdict" != run ]; then
            :
          elif [ "$EVENT" != schedule ]; then
            echo "not a schedule run: no check"
          elif [ "$SERVER" = https://github.com ]; then
            echo "on github.com the guard makes no API call: no check"
          elif [ -n "$JOB_TOKEN" ] && runs "$JOB_TOKEN"; then
            echo "read with the job token"
          elif job="${CODE:-no job token}"; [ -n "$BOT" ] && runs "$BOT"; then
            echo "read with AGENT_TOKEN; the job token got: $job"
          else
            bot="not set"; [ -z "$BOT" ] || bot="$CODE"
            verdict=unreadable
            echo "::error::the Actions API gave no count (job token: $job; AGENT_TOKEN: $bot), so every guarded job skips and CI Gate fails"
          fi
          if [ "$verdict" = run ] && [ "$N" -gt 0 ]; then
            verdict=busy
            echo "::notice::$N push run(s) of this workflow on main in flight: this schedule run skips its guarded jobs, and CI Gate posts skipped"
          fi
          # v1.30 (fix 2): the tree proof, on a push to main on the forge only.
          if [ "$verdict" = run ] && [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && [ "$SERVER" != https://github.com ]; then
            if { [ -n "$JOB_TOKEN" ] && proof "$JOB_TOKEN"; } || { [ -n "$BOT" ] && proof "$BOT"; }; then
              if [ -n "$PROOF" ]; then
                verdict=proven
                echo "::notice::this tree already has a green full tier in run $PROOF: the guarded jobs skip, and CI Gate passes on it"
              fi
            else
              echo "::warning::the tree proof could not be read: the full tier runs"
            fi
          fi
          echo "verdict: $verdict${PROOF:+ (proof: run $PROOF)}"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "proof=$PROOF" >> "$GITHUB_OUTPUT"

      # v1.48 (Tenant Agent ruling 1024 item 1, queue 250 (a)): the Dells'
      # self-hosted runners supplement the 40 GitHub-hosted runners, and
      # hosted stays the default. On github.com this step counts this
      # repository's jobs on GitHub-hosted runners (a job whose labels name an
      # ubuntu-* image and not self-hosted) in every queued and in-progress
      # run of every workflow, through the Actions API with the job token
      # (actions: read). It outputs `runner` and `runner_docker` as runs-on
      # JSON: `"ubuntu-latest"`, or, when HOSTED_JOBS_PER_REPO hosted jobs or
      # more are in progress, or a hosted job of another run has been queued
      # HOSTED_QUEUE_GRACE_SECONDS or more (the hosted pool is full),
      # `["self-hosted","linux","x64","bigdisk"]` and
      # `["self-hosted","linux","x64","bigdisk-docker"]`. A count it cannot
      # read (a reply that is not 200, a list short of its total_count, a
      # field missing) picks nothing silently: it prints a ::warning naming
      # why and outputs the hosted default. One decision per run: every job
      # of the run takes it. Off github.com it makes no call, and each job's
      # runs-on keeps its forge label (bigdisk, ci-gate) as before v1.48. It
      # runs before the checkout, beside no repository code.
      - name: Hosted or overflow runner (ruling 1024)
        id: runner
        env:
          SERVER: ${{ github.server_url }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions
          RUN_ID: ${{ github.run_id }}
          JOB_TOKEN: ${{ github.token }}
          LIMIT: ${{ env.HOSTED_JOBS_PER_REPO }}
          GRACE: ${{ env.HOSTED_QUEUE_GRACE_SECONDS }}
        run: |
          set -uo pipefail
          HOSTED='"ubuntu-latest"'
          overflow() { printf '["self-hosted","linux","x64","%s"]' "$1"; }
          emit() {
            echo "runner: $1; runner_docker: $2"
            { echo "runner=$1"; echo "runner_docker=$2"; } >> "$GITHUB_OUTPUT"
          }
          # hosted <why>: no count, so the default, with the reason shown.
          hosted() {
            echo "::warning::runner selection: $1; every job of this run takes the GitHub-hosted default, ubuntu-latest, and none overflows to the Dells (ci-template v1.48, ruling 1024)"
            emit "$HOSTED" "$HOSTED"
            exit 0
          }
          if [ "$SERVER" != https://github.com ]; then
            echo "not github.com: each job keeps its forge label (bigdisk, ci-gate); no selection"
            emit "$HOSTED" "$HOSTED"
            exit 0
          fi
          case "$LIMIT:$GRACE" in
            *[!0-9:]*|:*|*:) hosted "HOSTED_JOBS_PER_REPO='$LIMIT' or HOSTED_QUEUE_GRACE_SECONDS='$GRACE' is not a whole number" ;;
          esac
          # get <url> <file>: 0 on a 200 reply, saved in <file>; the answer in
          # CODE. The token reaches curl as a header from a file descriptor.
          get() {
            CODE=$(curl -sS --max-time 30 -o "$2" -w '%{http_code}' \
              -H @<(printf 'Authorization: Bearer %s\n' "$JOB_TOKEN") \
              -H 'Accept: application/vnd.github+json' "$1") || CODE="curl exit $?"
            [ "$CODE" = 200 ]
          }
          # pages <url> <key> <out>: every page of a listing, its <key> items
          # one JSON object per line in <out>. 1, with WHY set, when a reply is
          # not 200 or the items fall short of total_count.
          pages() {
            local p=1 got=0 total n
            : > "$3"
            while :; do
              get "$1&per_page=100&page=$p" "$RUNNER_TEMP/sel-page.json" || { WHY="$1: $CODE"; return 1; }
              total=$(jq -er '.total_count | numbers' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no total_count"; return 1; }
              n=$(jq -er --arg k "$2" '.[$k] | arrays | length' "$RUNNER_TEMP/sel-page.json") || { WHY="$1: 200 with no $2 list"; return 1; }
              jq -c --arg k "$2" '.[$k][]' "$RUNNER_TEMP/sel-page.json" >> "$3"
              got=$((got + n))
              { [ "$got" -lt "$total" ] && [ "$n" -gt 0 ]; } || break
              [ "$p" -lt 10 ] || { WHY="$1: more than 1000 entries"; return 1; }
              p=$((p + 1))
            done
            [ "$got" -ge "$total" ] || { WHY="$1: $got of $total entries"; return 1; }
          }
          : > "$RUNNER_TEMP/sel-runs.jsonl"
          for st in queued in_progress; do
            pages "$API/runs?status=$st" workflow_runs "$RUNNER_TEMP/sel-r.jsonl" || hosted "the Actions API gave no complete run list ($WHY)"
            cat "$RUNNER_TEMP/sel-r.jsonl" >> "$RUNNER_TEMP/sel-runs.jsonl"
          done
          : > "$RUNNER_TEMP/sel-jobs.jsonl"
          for id in $(jq -r '.id' "$RUNNER_TEMP/sel-runs.jsonl" | sort -u); do
            pages "$API/runs/$id/jobs?filter=latest" jobs "$RUNNER_TEMP/sel-j.jsonl" || hosted "the Actions API gave no complete job list ($WHY)"
            cat "$RUNNER_TEMP/sel-j.jsonl" >> "$RUNNER_TEMP/sel-jobs.jsonl"
          done
          # In progress: every hosted job, this one included. Queued: a hosted
          # job of another run (this run's jobs wait on this one) queued for
          # GRACE seconds or more, so a runner did not take it at once.
          read -r running queued < <(jq -rs --argjson run "$RUN_ID" --argjson grace "$GRACE" '
              [.[] | select((.labels // []) | any(startswith("ubuntu-")) and all(. != "self-hosted"))] as $h
              | ($h | map(select(.status == "in_progress")) | length) as $r
              | ($h | map(select(.status == "queued" and .run_id != $run
                    and now - ((.created_at // .started_at) | fromdateiso8601) >= $grace)) | length) as $q
              | "\($r) \($q)"' "$RUNNER_TEMP/sel-jobs.jsonl") || hosted "the job list could not be counted"
          echo "this repository: $running hosted job(s) in progress (HOSTED_JOBS_PER_REPO=$LIMIT); $queued hosted job(s) of other runs queued ${GRACE}s or more"
          if [ "$running" -ge "$LIMIT" ]; then
            why="$running hosted jobs in progress, HOSTED_JOBS_PER_REPO=$LIMIT"
          elif [ "$queued" -gt 0 ]; then
            why="$queued hosted job(s) queued ${GRACE}s or more: the hosted pool is full"
          else
            emit "$HOSTED" "$HOSTED"
            exit 0
          fi
          echo "::notice::runner selection: $why; this run's jobs overflow to the Dells (bigdisk, bigdisk-docker) (ci-template v1.48, ruling 1024)"
          emit "$(overflow bigdisk)" "$(overflow bigdisk-docker)"

      # v1.34: the full history on a PR run for the changed-files diff, one
      # commit otherwise. v1.41: every PR run, ci:full or not. No credential is left in the checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      # v1.38 (owner ruling 633, decision 219(d)): a job that names the
      # `release` label runs only on a push to refs/heads/main or a tag, or a
      # workflow_dispatch on main, and never for a pull request. This step
      # reads every .github/workflows/*.yml and *.yaml of the repository as
      # text, takes each job whose runs-on names `release` (plain, in a list,
      # or as a quoted string inside an expression), and evaluates its `if:`
      # under every other event: a pull_request or pull_request_target event
      # in a workflow that has that trigger (a), and the push of another
      # branch, a dispatch off main or on a tag, schedule, workflow_run,
      # merge_group, release, create, issue_comment and repository_dispatch
      # (b). A value it cannot know (vars, needs, secrets, the server) may
      # hold anything, so the `if:` must be false whatever it holds; an `if:`
      # it cannot read fails. It prints each file:job and the reason. A lint,
      # not the gate: the runner side refuses such a job as well.
      # v1.43 (ruling 833): on github.com every other job runs on a standard
      # GitHub-hosted image on every event (c), or its runs-on line says why
      # it cannot, `# self-hosted: <reason>`; a larger runner is refused (d).
      # v1.46 (ruling 999): the reason names its category, hardware: or
      # oversize: (credential: for the one Codex review job); a reason with
      # no category is (e).
      # v1.47 (ruling 1007): label and category are checked together. The
      # review-only labels codex and qwen run only in code-review.yml, codex
      # with credential: and qwen with hardware:, and credential: is only for
      # codex; a waiver does not lift it (f).
      # v1.48 (ruling 1024): in ci.yml, a runs-on that reads
      # needs.preflight.outputs.runner or runner_docker is checked with the
      # output at its default ("ubuntu-latest", which must give a standard
      # image) and at its overflow, where exactly
      # [self-hosted, linux, x64, bigdisk] or [..., bigdisk-docker] passes too.
      # Its tests: testdata/runner-labels-tests.py.
      - name: Runner labels (ruling 633)
        run: |
          python3 -I - <<'PY'
          import glob, json, re, sys

          # Reads .github/workflows/*.yml|yaml as text (no YAML library): the
          # top-level `on:` keys, and each job's `runs-on` and `if`. A job names
          # `release` when that label appears in its runs-on, plain, in a list or as a
          # quoted string in an expression. Its `if` is evaluated under every event
          # outside the release allow-list, with every value this step cannot know
          # (vars, needs, secrets, server_url, ...) unknown; the job passes only when
          # the `if` is false in each of them whatever the unknowns hold.
          U = object()  # unknown value
          OPEN = "$" "{{"  # split, so the runner does not read it as an expression
          ALLOWED = "push to refs/heads/main or refs/tags/*, or workflow_dispatch on main"
          PR = {"pull_request", "pull_request_target"}
          CTX = [  # (event, ref) pairs a release job must never run on
              ("pull_request", "refs/pull/1/merge"), ("pull_request_target", "refs/heads/main"),
              ("push", "refs/heads/feature"), ("workflow_dispatch", "refs/heads/feature"),
              ("workflow_dispatch", "refs/tags/v1.0.0"), ("schedule", "refs/heads/main"),
              ("workflow_run", "refs/heads/main"), ("merge_group", "refs/heads/gh-readonly-queue/main/pr-1"),
              ("release", "refs/tags/v1.0.0"), ("create", "refs/tags/v1.0.0"),
              ("issue_comment", "refs/heads/main"), ("repository_dispatch", "refs/heads/main"),
          ]


          def ctx_get(ev, ref, path):
              p = path.lower()
              name = ref.split("/", 2)[-1]
              known = {"github.event_name": ev, "github.ref": ref, "github.event.ref": ref,
                       "github.ref_name": name,
                       "github.ref_type": "tag" if ref.startswith("refs/tags/") else "branch",
                       "github.head_ref": "feature" if ev in PR else "",
                       "github.base_ref": "main" if ev in PR else ""}
              if p in known:
                  return known[p]
              if ev not in PR and (p == "github.event.pull_request" or p.startswith("github.event.pull_request.")):
                  return None
              return U


          TOK = re.compile(r"\s*(?:(?P<s>'(?:[^']|'')*')|(?P<n>-?\d+(?:\.\d+)?)|(?P<op>&&|\|\||==|!=|<=|>=|[!<>()\[\],.])|(?P<id>[A-Za-z_][\w-]*|\*))")


          def lex(s):
              out, i = [], 0
              while i < len(s):
                  if s[i:].strip() == "":
                      break
                  m = TOK.match(s, i)
                  if not m:
                      raise ValueError(f"cannot read the expression at {s[i:i+20]!r}")
                  i = m.end()
                  if m.group("s"):
                      out.append(("s", m.group("s")[1:-1].replace("''", "'")))
                  elif m.group("n"):
                      out.append(("v", float(m.group("n"))))
                  elif m.group("op"):
                      out.append(("op", m.group("op")))
                  else:
                      out.append(("id", m.group("id")))
              return out


          def truthy(v):
              if v is U:
                  return U
              if isinstance(v, float) and v != v:
                  return False
              return v not in (None, False, 0, "", 0.0)


          def num(v):
              if v is None or v is False:
                  return 0.0
              if v is True:
                  return 1.0
              if isinstance(v, (int, float)):
                  return float(v)
              if isinstance(v, str):
                  try:
                      return float(v.strip() or 0)
                  except ValueError:
                      return float("nan")
              return float("nan")


          def eq(a, b):
              if a is U or b is U:
                  return U
              if isinstance(a, str) and isinstance(b, str):
                  return a.lower() == b.lower()
              if type(a) is type(b) and not isinstance(a, (int, float)):
                  return a == b
              return num(a) == num(b)


          class P:
              def __init__(self, toks, get):
                  self.t, self.i, self.get = toks, 0, get

              def peek(self):
                  return self.t[self.i] if self.i < len(self.t) else (None, None)

              def take(self, want=None):
                  k, v = self.peek()
                  if want is not None and v != want:
                      raise ValueError(f"expected {want!r}, found {v!r}")
                  self.i += 1
                  return k, v

              def parse(self):
                  v = self.orx()
                  if self.i != len(self.t):
                      raise ValueError(f"unexpected {self.peek()[1]!r}")
                  return v

              def orx(self):
                  a = self.andx()
                  while self.peek() == ("op", "||"):
                      self.take()
                      b = self.andx()
                      ta = truthy(a)
                      if ta is True:
                          pass
                      elif ta is False:
                          a = b
                      else:
                          a = b if truthy(b) is True else U
                  return a

              def andx(self):
                  a = self.cmp()
                  while self.peek() == ("op", "&&"):
                      self.take()
                      b = self.cmp()
                      ta = truthy(a)
                      if ta is False:
                          pass
                      elif ta is True:
                          a = b
                      else:
                          a = b if truthy(b) is False else U
                  return a

              def cmp(self):
                  a = self.unary()
                  while self.peek()[0] == "op" and self.peek()[1] in ("==", "!=", "<", "<=", ">", ">="):
                      op = self.take()[1]
                      b = self.unary()
                      if op == "==":
                          a = eq(a, b)
                      elif op == "!=":
                          r = eq(a, b)
                          a = U if r is U else not r
                      elif a is U or b is U:
                          a = U
                      else:
                          x, y = (a.lower(), b.lower()) if isinstance(a, str) and isinstance(b, str) else (num(a), num(b))
                          a = {"<": x < y, "<=": x <= y, ">": x > y, ">=": x >= y}[op]
                  return a

              def unary(self):
                  if self.peek() == ("op", "!"):
                      self.take()
                      t = truthy(self.unary())
                      return U if t is U else not t
                  return self.primary()

              def primary(self):
                  k, v = self.take()
                  if k == "s" or k == "v":
                      return v
                  if (k, v) == ("op", "("):
                      r = self.orx()
                      self.take(")")
                      return r
                  if k != "id":
                      raise ValueError(f"unexpected {v!r}")
                  lv = v.lower()
                  if lv in ("true", "false"):
                      return lv == "true"
                  if lv == "null":
                      return None
                  if self.peek() == ("op", "("):
                      self.take()
                      args = []
                      if self.peek() != ("op", ")"):
                          args.append(self.orx())
                          while self.peek() == ("op", ","):
                              self.take()
                              args.append(self.orx())
                      self.take(")")
                      return self.call(lv, args)
                  path, exact = v, True
                  while self.peek() in (("op", "."), ("op", "[")):
                      if self.take()[1] == ".":
                          k2, v2 = self.take()
                          if k2 != "id":
                              raise ValueError(f"unexpected {v2!r} after '.'")
                          path += "." + v2
                          exact = exact and v2 != "*"
                      else:
                          idx = self.orx()
                          self.take("]")
                          if isinstance(idx, str):
                              path += "." + idx
                          else:
                              exact = False
                  return self.get(path) if exact else U

              def call(self, f, a):
                  if f == "always":
                      return True
                  if f in ("startswith", "endswith", "contains") and len(a) == 2:
                      if U in a:
                          return U
                      if f == "contains" and isinstance(a[0], list):
                          return any(eq(x, a[1]) is True for x in a[0])
                      x, y = (str(s).lower() if s is not None else "" for s in a)
                      return x.startswith(y) if f == "startswith" else x.endswith(y) if f == "endswith" else y in x
                  if f == "fromjson" and len(a) == 1 and isinstance(a[0], str):
                      try:
                          return json.loads(a[0])
                      except ValueError:
                          return U
                  if f == "format" and a and U not in a and isinstance(a[0], str):
                      return re.sub(r"\{(\d+)\}", lambda m: str(a[int(m.group(1)) + 1]) if int(m.group(1)) + 1 < len(a) else m.group(0), a[0])
                  return U  # success(), failure(), hashFiles(), ...: unknown


          def unquote(s):
              s = s.strip()
              if len(s) >= 2 and s[0] == s[-1] == "'":
                  return s[1:-1].replace("''", "'")
              if len(s) >= 2 and s[0] == s[-1] == '"':
                  return json.loads(s)
              return s


          def strip_comment(s):
              q = None
              for i, c in enumerate(s):
                  if q:
                      if c == q:
                          q = None
                  elif c in "'\"":
                      q = c
                  elif c == "#" and (i == 0 or s[i - 1] in " \t"):
                      return s[:i].rstrip()
              return s.rstrip()


          def ind(line):
              return len(line) - len(line.lstrip(" "))


          def body(lines, i, inline):
              """The value text of the key on line i: the inline part plus every deeper line."""
              base, parts = ind(lines[i]), []
              j = i + 1
              while j < len(lines) and (not lines[j].strip() or ind(lines[j]) > base):
                  if lines[j].strip() and not lines[j].lstrip().startswith("#"):
                      parts.append(strip_comment(lines[j]).strip())
                  j += 1
              inline = strip_comment(inline).strip()
              if inline[:1] in ("|", ">"):
                  return (" " if inline[0] == ">" else "\n").join(parts)
              return " ".join([inline] + parts).strip()


          def keys_under(lines, i):
              """(line, key) for each direct child key of the block opened on line i."""
              base, out, child = ind(lines[i]), [], None
              for j in range(i + 1, len(lines)):
                  s = lines[j]
                  if not s.strip() or s.lstrip().startswith("#"):
                      continue
                  if ind(s) <= base:
                      break
                  child = ind(s) if child is None else child
                  if ind(s) == child:
                      m = re.match(r"\s*(?:-\s+)?(['\"]?)([^'\":#]+)\1\s*(?::\s*(.*))?$", s)
                      if m:
                          out.append((j, m.group(2).strip(), m.group(3) or ""))
              return out


          def triggers(lines):
              for i, s in enumerate(lines):
                  m = re.match(r"(['\"]?)(on|true)\1\s*:\s*(.*)$", s)
                  if m:
                      v = strip_comment(m.group(3)).strip()
                      if v.startswith("{"):  # a flow mapping: its keys, nested ones too
                          return set(re.findall(r"([A-Za-z_]+)['\"]?\s*:", v))
                      if v:
                          return {unquote(x) for x in re.split(r"[\s,\[\]]+", v) if x}
                      return {k for _, k, _ in keys_under(lines, i)}
              return set()


          # v1.43 (ruling 833): the standard GitHub-hosted images, free on a public
          # repository; a larger runner (cores, large, xlarge, gpu) bills even there.
          STANDARD = re.compile(r"(ubuntu-(latest|24\.04|22\.04)(-arm)?|ubuntu-slim)")
          LARGER = re.compile(r"(cores|xlarge|large|gpu)", re.I)
          WAIVER = re.compile(r"#\s*self-hosted:\s*(hardware|oversize|credential)\s*:\s*\S")
          BARE = re.compile(r"#\s*self-hosted:")  # v1.46: a waiver whose reason names no category
          # v1.47 (ruling 1007): a review-only label runs only in code-review.yml, and
          # only with its own category; credential: is the codex job's alone.
          REVIEW = {"codex": "credential", "qwen": "hardware"}
          REVIEW_FILES = {"code-review.yml", "code-review.yaml"}
          REVIEW_TOKEN = re.compile(r"(?<![\w.-])['\"]?(codex|qwen)['\"]?(?![\w-])", re.I)
          GH = "https://github.com"
          # v1.48 (ruling 1024): ci.yml's preflight step `Hosted or overflow runner
          # (ruling 1024)` outputs runs-on JSON, "ubuntu-latest" by default and the
          # Dells' overflow list when the hosted pool is full. In ci.yml only, a
          # runs-on that reads exactly these outputs is checked under both: the
          # default must be a standard image, as (c) asks of every job, and the
          # overflow may also be exactly the list its output names. Any other
          # self-hosted value still needs its waiver.
          SEL_FILES = {"ci.yml", "ci.yaml"}
          SEL_OUT = {"needs.preflight.outputs.runner": "bigdisk",
                     "needs.preflight.outputs.runner_docker": "bigdisk-docker"}
          OVERFLOW = [["self-hosted", "linux", "x64", v] for v in SEL_OUT.values()]
          HOSTED_CTX = [  # (event, ref, head repo) on github.com; o/r is this repository
              ("push", "refs/heads/main", None), ("push", "refs/heads/feature", None),
              ("pull_request", "refs/pull/1/merge", "o/r"), ("pull_request", "refs/pull/1/merge", "fork/r"),
              ("workflow_dispatch", "refs/heads/main", None), ("schedule", "refs/heads/main", None),
          ]


          def hosted_get(ev, ref, head, sel=None):
              def get(path):
                  p = path.lower()
                  if sel and p in SEL_OUT:  # v1.48: the selection output, as JSON text
                      return json.dumps("ubuntu-latest" if sel == "default" else ["self-hosted", "linux", "x64", SEL_OUT[p]])
                  if p == "github.server_url":
                      return GH
                  if p == "github.repository":
                      return "o/r"
                  if p == "github.event.pull_request.head.repo.full_name":
                      return head if ev in PR else None
                  if p == "github.event.pull_request.draft":
                      return False if ev in PR else None
                  return ctx_get(ev, ref, path)
              return get


          def labels(value):
              # A runs-on value's labels: a string, a list, or an expression's result.
              if value is U or value is None:
                  return None
              if isinstance(value, list):
                  return [str(x) for x in value]
              return [str(value)]


          def runs_on_labels(text, ev, ref, head, sel=None):
              t = text.strip()
              if t.startswith("group:") or t.startswith("labels:") or " labels:" in t:
                  m = re.search(r"labels:\s*(\[[^\]]*\]|\S+)", t)
                  t = m.group(1) if m else ""
              m = re.fullmatch(r"\$\{\{(.*)\}\}", unquote(t), re.S)
              if m:
                  return labels(P(lex(m.group(1)), hosted_get(ev, ref, head, sel)).parse())
              if t.startswith("["):
                  return [unquote(x) for x in re.split(r"\s*,\s*", t.strip("[] ")) if x]
              if t.startswith("- "):
                  return [unquote(x) for x in re.split(r"\s*-\s+", " " + t) if x.strip()]
              return [unquote(t)]


          def review_labels(text):
              # The review-only labels a runs-on names, in its text or in what an
              # expression there yields on any github.com event.
              found = {m.lower() for m in REVIEW_TOKEN.findall(text)}
              for ev, ref, head in HOSTED_CTX:
                  try:
                      got = runs_on_labels(text, ev, ref, head)
                  except ValueError:
                      continue
                  found |= {g.lower() for g in got or [] if g.lower() in REVIEW}
              return sorted(found)


          def review_finding(path, where, ro, ro_line):
              # v1.47 (ruling 1007): label and category together, whatever the waiver says.
              names = review_labels(ro)
              m = WAIVER.search(ro_line)
              cat = m.group(1) if m else None
              base = path.replace("\\", "/").rsplit("/", 1)[-1]
              if names and base not in REVIEW_FILES:
                  return (f"{where}: (f) names the review-only label {', '.join(names)}; ruling 1007 reserves codex and "
                          f"qwen to code-review.yml whatever the `# self-hosted:` waiver says")
              if names:
                  wrong = [n for n in names if cat != REVIEW[n]]
                  if len(names) > 1 or wrong:
                      return (f"{where}: (f) runs on {', '.join(names)} with the category {cat or 'none'}; ruling 1007 pairs "
                              f"codex with `credential:` and qwen with `hardware:`, one review label per job")
                  return None
              if cat == "credential":
                  return (f"{where}: (f) uses the `credential:` category without the codex label; ruling 1007 keeps it "
                          f"for code-review.yml's Codex review job alone")
              return None


          def names_release(text):
              return re.search(r"(?<![\w.-])['\"]?release['\"]?(?![\w-])", text) is not None


          def condition(text):
              t = unquote(text) if text else ""
              m = re.fullmatch(r"\s*\$\{\{(.*)\}\}\s*", t, re.S)
              if m and OPEN not in m.group(1):
                  return m.group(1)
              if OPEN in t:
                  raise ValueError("text around the expression makes it a string, which is always true")
              return t


          def check(path):
              lines = open(path, encoding="utf-8").read().splitlines()
              on = triggers(lines)
              bad = []
              for i, s in enumerate(lines):
                  if re.match(r"jobs\s*:\s*(#.*)?$", s):
                      for j, job, _ in keys_under(lines, i):
                          ro = cond = ro_line = None
                          for k, key, inline in keys_under(lines, j):
                              if key == "runs-on":
                                  ro, ro_line = body(lines, k, inline), lines[k]
                              elif key == "if":
                                  cond = body(lines, k, inline)
                          where = f"{path}:{job}"
                          if ro is not None and not names_release(ro):
                              # v1.43 (ruling 833): hosted first.
                              if LARGER.search(ro) and re.search(r"ubuntu|windows|macos", ro):
                                  bad.append(f"{where}: (d) names a larger GitHub-hosted runner ({ro}); it bills on a public repository")
                                  continue
                              rf = review_finding(path, where, ro, ro_line)
                              if rf:
                                  bad.append(rf)
                                  continue
                              if WAIVER.search(ro_line):

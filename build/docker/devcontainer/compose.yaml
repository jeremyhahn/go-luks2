# The integration stage as a compose service; its privilege set matches test/tools/docker-run flag for flag (TestComposeIntegrationServiceHasTheLaunchersPrivileges).

services:
  integration:
    image: ${GO_LUKS2_IT_IMAGE:?set by make integration-test}
    pull_policy: never
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - MKNOD
      - SETUID
      - SETGID
    security_opt:
      - seccomp=${GO_LUKS2_SECCOMP_PROFILE:?set by make integration-test}
      - apparmor=unconfined
    devices:
      - /dev/mapper/control
      - /dev/loop-control
    device_cgroup_rules:
      - "b 7:* rwm"
      - "b ${GO_LUKS2_DM_MAJOR:?set by make integration-test}:* rwm"
    volumes:
      - ${GO_LUKS2_TEST_STATE_DIR:?set by make integration-test}:/var/lib/go-luks2-test-state

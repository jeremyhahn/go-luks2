name: t
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize]
jobs:
  scope:
    runs-on: ${{ github.server_url == 'https://github.com' && (github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","linux","x64","bigdisk"]') || 'ubuntu-latest') || 'bigdisk' }}
    steps:
      - run: true
